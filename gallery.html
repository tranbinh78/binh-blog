</head>

<body>
  <div class="wrapper">

    <!-- Sidebar -->
    <aside class="sidebar" role="navigation" aria-label="Chính">
      <div class="brand">
        <img src="assets/avatar.jpg" alt="Avatar Tran Binh" />
        <div>
          <h1>Tran Binh</h1>
          <div style="color:var(--muted);font-size:13px">Personal website</div>
        </div>
      </div>

      <ul class="nav">
        <li><a href="index.html">Home</a></li>
        <li><a href="tieng-anh.html">Tiếng Anh</a></li>

        <li><a href="contact.html">Contact</a></li>
      </ul>

<!-- Nút chuyển Dark Mode -->
  <div class="theme-switch-wrapper">
      <label class="theme-switch" for="darkToggle">
          <input type="checkbox" id="darkToggle">
          <span class="slider"></span>
      </label>
      <span id="themeLabel">🌙 Dark Mode</span>
  </div>
      
    </aside>

    <!-- Main content -->
    <main class="main">
      <div class="header-row">
        <div>
          <h2 class="site-title">Gallery</h2>
          <p class="lead">Một vài khoảnh khắc và hình ảnh tôi yêu thích.</p>
        </div>
      </div>

      <section class="article">

        <div class="gallery-grid">
          <img src="assets/gallery-1.jpg" alt="Ảnh 1">
          <img src="assets/gallery-2.jpg" alt="Ảnh 2">
          <img src="assets/gallery-3.jpg" alt="Ảnh 3">
          <img src="assets/gallery-4.jpg" alt="Ảnh 4">
          <img src="assets/gallery-5.jpg" alt="Ảnh 5">
          <img src="assets/gallery-6.jpg" alt="Ảnh 6">
        </div>

      </section>

    </main>
  </div>

 <script>
  const toggle = document.getElementById("darkToggle");
  const label = document.getElementById("themeLabel");
  const root = document.documentElement;

  // Load trạng thái đã lưu
  if (localStorage.getItem("theme") === "dark") {
    root.classList.add("dark");
    toggle.checked = true;
    label.textContent = "☀️ Light Mode";
  }

  toggle.addEventListener("change", () => {
    if (toggle.checked) {
      root.classList.add("dark");
      label.textContent = "☀️ Light Mode";
      localStorage.setItem("theme", "dark");
    } else {
      root.classList.remove("dark");
      label.textContent = "🌙 Dark Mode";
      localStorage.setItem("theme", "light");
    }
  });
</script>
  
</body>
</html>
