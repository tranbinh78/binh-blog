<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<title>Bài học | Binh Blog</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    font-family: "Be Vietnam Pro", sans-serif;
    max-width: 1200px;
    margin: auto;
    padding: 20px;
    background: #faf9f4;
    color: #333;
    line-height: 1.8;
    transition: 0.3s;
    display: grid;
    grid-template-columns: 240px 1fr 260px;
    gap: 25px;
  }
  body.dark { background:#1b1b1b; color:#eee; }

  /* ===== PROGRESS BAR ===== */
  #progress-container {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 6px;
    background: transparent;
    z-index: 9999;
  }
  #progress-bar {
    height: 100%;
    width: 0%;
    background: #c9b3ff;
    transition: width 0.1s linear;
  }
  body.dark #progress-bar { background:#7a6adf; }


  /* ===== SIDEBAR ===== */
  #sidebar {
    background:#ffffff;
    border-radius:10px;
    border:1px solid #ddd;
    padding:15px;
    height: fit-content;
    max-height: 85vh;
    overflow-y: auto;
    position: sticky;
    top: 20px;
  }
  body.dark #sidebar { background:#2b2b2b; border-color:#666; }

  #sidebar h3 { margin-top:0; }

  #sidebar a {
    display:block;
    padding:8px 10px;
    margin-bottom:6px;
    text-decoration:none;
    color:#333;
    border-radius:6px;
    transition:0.2s;
  }
  body.dark #sidebar a { color:#eee; }

  #sidebar a:hover { background:#e6ddff; }
  #sidebar a.active { background:#d7caff; font-weight:700; }
  body.dark #sidebar a.active { background:#5b4fa8; color:white; }

  #mobile-sidebar-btn {
    display:none;
    background:#d7caff;
    padding:10px 15px;
    border:none;
    border-radius:6px;
    margin-bottom: 15px;
    cursor:pointer;
  }
  body.dark #mobile-sidebar-btn { background:#5b4fa8; color:white; }


  /* ===== CONTENT ===== */
  .content-area { padding:0 10px; }

  header {
    display:flex;
    justify-content: space-between;
    align-items:center;
    margin-bottom:25px;
  }

  .back-btn {
    background:#e6ddff;
    padding:8px 14px;
    border-radius:6px;
    text-decoration:none;
    color:#333;
    font-weight:600;
  }
  .back-btn:hover { background:#d1c3ff; }

  .reading-btn {
    background:#ffe9c6;
    padding:8px 14px;
    border-radius:6px;
    border:none;
    cursor:pointer;
    font-weight:600;
    margin-left:10px;
  }
  body.dark .reading-btn { background:#705f33; color:white; }
  .reading-btn:hover { background:#ffdfad; }

  h2, h3 {
    margin-top: 30px;
    color: #4a3fa8;
  }
  body.dark h2, body.dark h3 { color:#cfc4ff; }

  .box {
    padding:14px 18px;
    background:#fff;
    border-left:5px solid #9c7bff;
    border-radius:6px;
    margin:20px 0;
  }
  body.dark .box { background:#2a2a2a; border-color:#bba0ff; }


  /* ===== TOC ===== */
  #toc {
    background:#ffffff;
    border-radius:10px;
    padding:15px;
    border:1px solid #ddd;
    position:sticky;
    top:20px;
    height: fit-content;
  }
  body.dark #toc { background:#2a2a2a; border-color:#555; }

  #toc a {
    display:block;
    padding:4px 6px;
    margin-bottom:6px;
    text-decoration:none;
    color:#444;
    border-radius:6px;
  }
  body.dark #toc a { color:#eee; }

  #toc a.active {
    background:#d7caff;
    font-weight:700;
  }
  body.dark #toc a.active {
    background:#5b4fa8;
    color:#fff;
  }

  /* ===== NEXT / PREV ===== */
  .nav-buttons {
    display:flex;
    justify-content: space-between;
    margin-top:40px;
    gap:10px;
  }
  .np-btn {
    flex:1;
    padding:14px;
    background:#e6ddff;
    border-radius:8px;
    text-align:center;
    text-decoration:none;
    color:#333;
    font-weight:600;
  }
  .np-btn:hover { background:#d1c3ff; }
  body.dark .np-btn { background:#5b4fa8; color:white; }


  /* ===== MOBILE MODE ===== */
  @media(max-width:900px){
    body { grid-template-columns: 1fr; }

    #sidebar, #toc { display:none; }

    #mobile-sidebar-btn { display:block; }

    #sidebar.mobile-open {
      display:block;
      position:relative;
      max-height:none;
    }
  }


  /* ===== READING MODE ===== */
  body.reading-mode {
    grid-template-columns: 1fr !important;
  }

  body.reading-mode #sidebar,
  body.reading-mode #toc {
    display: none !important;
  }

  body.reading-mode .content-area {
    max-width: 800px;
    margin:auto;
  }

/* Fade-in animation cho content */
.fade-in {
  opacity: 0;
  transform: translateY(10px);
  animation: fadeInAnim 0.5s ease-out forwards;
}

@keyframes fadeInAnim {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
  
</style>
</head>

<body>

<!-- Progress Bar -->
<div id="progress-container"><div id="progress-bar"></div></div>

<!-- SIDEBAR -->
<div id="sidebar">
  <h3>📚 Bài học</h3>
  <div id="sidebar-list">Đang tải...</div>
</div>

<!-- CONTENT -->
<div class="content-area">
  <button id="mobile-sidebar-btn">📚 Danh sách bài</button>

  <header>
    <a href="/binh-blog/grammar-index.html" class="back-btn">← Quay lại</a>

    <h1 id="title">Đang tải...</h1>

    <!-- Reading mode button -->
    <button id="reading-toggle" class="reading-btn">📖 Reading Mode</button>
  </header>

  <div id="content">Đang tải nội dung...</div>

  <div class="nav-buttons" id="nav-buttons"></div>
</div>

<!-- TOC -->
<div id="toc">
  <h3>Mục lục</h3>
  <ul id="toc-list"><li>Đang tạo...</li></ul>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const file = params.get("file");

function mdToHtml(text) {
  return text
    .replace(/^# (.*$)/gim, "<h1 id='$1'>$1</h1>")
    .replace(/^## (.*$)/gim, "<h2 id='$1'>$1</h2>")
    .replace(/^### (.*$)/gim, "<h3 id='$1'>$1</h3>")
    .replace(/^\> (.*$)/gim, "<div class='box'>$1</div>")
    .replace(/^- (.*$)/gim, "<li>$1</li>")
    .replace(/\*\*(.*?)\*\*/gim, "<b>$1</b>")
    .replace(/\*(.*?)\*/gim, "<i>$1</i>");
}

/* ===== Progress Bar ===== */
function updateProgressBar() {
  const pageHeight = document.documentElement.scrollHeight - window.innerHeight;
  const scrolled = (window.scrollY / pageHeight) * 100;
  document.getElementById("progress-bar").style.width = scrolled + "%";
}
window.addEventListener("scroll", updateProgressBar);


/* ===== SIDEBAR ===== */
async function loadSidebar() {
  const res = await fetch("/binh-blog/grammar/grammar.json");
  const list = await res.json();

  const sb = document.getElementById("sidebar-list");
  sb.innerHTML = "";

  list.forEach(item => {
    sb.innerHTML += `
      <a href="/binh-blog/lesson.html?file=${item.file}"
         class="${item.file === file ? 'active' : ''}">
         ${item.title}
      </a>`;
  });
}


/* ===== TOC ===== */
function generateTOC() {
  const toc = document.getElementById("toc-list");
  toc.innerHTML = "";

  const headers = document.querySelectorAll("h2, h3");
  headers.forEach(h => {
    const id = h.innerText.replace(/\s+/g,"-");
    h.id = id;

    toc.innerHTML += `
      <li style="margin-left:${h.tagName==='H3'?'15px':'0'}">
        <a href="#${id}" data-id="${id}">${h.innerText}</a>
      </li>`;
  });
}

/* ===== TOC Highlight ===== */
function activateTOCHighlight() {
  const sections = document.querySelectorAll("h2,h3");
  const tocLinks = document.querySelectorAll("#toc a");

  window.addEventListener("scroll", () => {
    let current = "";
    sections.forEach(sec => {
      const top = sec.offsetTop - 140;
      if (scrollY >= top) current = sec.id;
    });

    tocLinks.forEach(link => {
      link.classList.remove("active");
      if (link.dataset.id === current) link.classList.add("active");
    });
  });
}


/* ===== NEXT / PREV ===== */
async function loadNextPrev() {
  const res = await fetch("/binh-blog/grammar/grammar.json");
  const list = await res.json();

  const index = list.findIndex(x => x.file === file);
  const prev = list[index - 1];
  const next = list[index + 1];

  let html = "";
  if (prev) html += `<a class="np-btn" href="/binh-blog/lesson.html?file=${prev.file}">← ${prev.title}</a>`;
  if (next) html += `<a class="np-btn" href="/binh-blog/lesson.html?file=${next.file}">${next.title} →</a>`;

  document.getElementById("nav-buttons").innerHTML = html;
}


/* ===== LOAD LESSON ===== */
async function loadLesson() {
  const res = await fetch(`/binh-blog/grammar/${file}`);
  const text = await res.text();

  document.getElementById("title").innerText =
    file.replace(".md","").replace(/-/g," ").replace(/\b\w/g,c=>c.toUpperCase());

  document.getElementById("content").innerHTML = mdToHtml(text);
  document.getElementById("content").classList.add("fade-in");

  generateTOC();
  activateTOCHighlight();
}

loadLesson();
loadSidebar();
loadNextPrev();


/* ===== Reading Mode Toggle + Save State ===== */
const readingBtn = document.getElementById("reading-toggle");

/* Khôi phục trạng thái khi load trang */
if (localStorage.getItem("readingMode") === "on") {
  document.body.classList.add("reading-mode");
  readingBtn.textContent = "🔙 Thoát Reading Mode";
} else {
  readingBtn.textContent = "📖 Reading Mode";
}

/* Khi click nút */
readingBtn.addEventListener("click", () => {
  document.body.classList.toggle("reading-mode");

  if (document.body.classList.contains("reading-mode")) {
    readingBtn.textContent = "🔙 Thoát Reading Mode";
    localStorage.setItem("readingMode", "on");
  } else {
    readingBtn.textContent = "📖 Reading Mode";
    localStorage.setItem("readingMode", "off");
  }
});


/* ===== Mobile Sidebar Toggle ===== */
document.getElementById("mobile-sidebar-btn").onclick = () => {
  document.getElementById("sidebar").classList.toggle("mobile-open");
};
</script>

</body>
</html>
