<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<title>Bài học | Binh Blog</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    font-family: "Be Vietnam Pro", sans-serif;
    max-width: 1000px;
    margin: auto;
    padding: 20px;
    background: #faf9f4;
    color: #333;
    line-height: 1.8;
    transition: 0.3s;
    display: flex;
    gap: 25px;
  }
  body.dark { background:#1b1b1b; color:#eee; }

  .content-area { flex: 1; }

  /* Header */
  header {
    display:flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    padding: 12px 0;
  }
  header h1 {
    font-size: 26px;
    margin: 0;
  }
  .back-btn {
    background: #e6ddff;
    padding: 8px 14px;
    border-radius: 6px;
    text-decoration: none;
    color: #333;
    font-weight: 600;
    transition: 0.2s;
  }
  .back-btn:hover { background:#d1c3ff; }

  h2, h3 {
    margin-top: 30px;
    color: #4a3fa8;
  }
  body.dark h2, body.dark h3 { color:#cfc4ff; }

  /* Highlight Box */
  .box {
    padding: 14px 18px;
    background:#fff;
    border-left: 5px solid #9c7bff;
    border-radius: 6px;
    margin: 20px 0;
  }
  body.dark .box { background:#2a2a2a; border-color:#bba0ff; }

  /* TOC */
  #toc {
    width: 250px;
    background: #ffffff;
    border-radius: 8px;
    padding: 15px;
    height: fit-content;
    border: 1px solid #ddd;
    position: sticky;
    top: 20px;
  }
  body.dark #toc { background:#2d2d2d; border-color:#555; }

  #toc h3 {
    font-size: 18px;
    margin-bottom: 12px;
    color: #333;
  }
  body.dark #toc h3 { color:#ddd; }

  #toc ul {
    list-style: none;
    padding-left: 0;
    margin: 0;
  }
  #toc li {
    margin-bottom: 8px;
  }
  #toc a {
    color: #444;
    text-decoration: none;
    font-size: 15px;
    padding: 4px 6px;
    border-radius: 6px;
    display: block;
  }

  /* TOC Highlight */
  #toc a.active {
    background: #d7caff;
    font-weight: 700;
  }
  body.dark #toc a.active {
    background: #5b4fa8;
    color: #fff;
  }

  #toc a:hover {
    text-decoration: underline;
  }

  /* Next/Prev Buttons */
  .nav-buttons {
    display:flex;
    justify-content: space-between;
    margin-top: 50px;
    gap: 10px;
  }
  .np-btn {
    flex: 1;
    padding: 14px;
    background:#e6ddff;
    text-align:center;
    border-radius:10px;
    text-decoration: none;
    color:#333;
    font-weight:600;
  }
  .np-btn:hover { background:#d1c3ff; }
  body.dark .np-btn {
    background:#5b4fa8;
    color:white;
  }
  body.dark .np-btn:hover { background:#483c8c; }

  @media(max-width:900px){
    body { flex-direction: column; }
    #toc {
      width: 100%;
      position: relative;
      top: 0;
      margin-bottom: 20px;
    }
  }

</style>
</head>

<body>

<div class="content-area">
  <header>
    <a href="/binh-blog/grammar-index.html" class="back-btn">← Quay lại</a>
    <h1 id="title">Đang tải bài học...</h1>
    <div></div>
  </header>

  <div id="content">Vui lòng chờ...</div>

  <div class="nav-buttons" id="nav-buttons"></div>
</div>

<!-- TOC Sidebar -->
<div id="toc">
  <h3>Mục lục</h3>
  <ul id="toc-list">
    <li>Đang tạo...</li>
  </ul>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const file = params.get("file");

// Markdown → HTML
function mdToHtml(text) {
  return text
    .replace(/^# (.*$)/gim, "<h1 id='$1'>$1</h1>")
    .replace(/^## (.*$)/gim, "<h2 id='$1'>$1</h2>")
    .replace(/^### (.*$)/gim, "<h3 id='$1'>$1</h3>")
    .replace(/^\> (.*$)/gim, "<div class='box'>$1</div>")
    .replace(/^- (.*$)/gim, "<li>$1</li>")
    .replace(/\*\*(.*?)\*\*/gim, "<b>$1</b>")
    .replace(/\*(.*?)\*/gim, "<i>$1</i>")
    .replace(/`(.*?)`/gim, "<code>$1</code>");
}

// Tạo TOC
function generateTOC() {
  const toc = document.getElementById("toc-list");
  toc.innerHTML = "";
  const headers = document.querySelectorAll("h2, h3");

  headers.forEach(h => {
    const id = h.innerText.replace(/\s+/g, "-");
    h.id = id;

    toc.innerHTML += `
      <li style="margin-left:${h.tagName === 'H3' ? '15px' : '0'}">
        <a href="#${id}" data-id="${id}">${h.innerText}</a>
      </li>
    `;
  });
}

// Scroll Spy
function activateTOCHighlight() {
  const sections = document.querySelectorAll("h2, h3");
  const tocLinks = document.querySelectorAll("#toc a");

  window.addEventListener("scroll", () => {
    let current = "";

    sections.forEach(section => {
      const top = section.offsetTop - 120;
      if (scrollY >= top) current = section.id;
    });

    tocLinks.forEach(link => {
      link.classList.remove("active");
      if (link.dataset.id === current) link.classList.add("active");
    });
  });
}

// 🟦 Next / Previous bài
async function loadNextPrev(currentFile) {
  const res = await fetch("/binh-blog/grammar/grammar.json");
  const list = await res.json();

  const index = list.findIndex(x => x.file === currentFile);

  const prev = list[index - 1];
  const next = list[index + 1];

  let html = "";

  if (prev) {
    html += `<a class="np-btn" href="/binh-blog/lesson.html?file=${prev.file}">← ${prev.title}</a>`;
  }
  if (next) {
    html += `<a class="np-btn" href="/binh-blog/lesson.html?file=${next.file}">${next.title} →</a>`;
  }

  document.getElementById("nav-buttons").innerHTML = html;
}

// LOAD bài học
async function loadLesson() {
  const res = await fetch(`/binh-blog/grammar/${file}`);
  let text = await res.text();

  document.getElementById("title").innerText =
    file.replace(".md","").replace(/-/g," ").replace(/\b\w/g, c => c.toUpperCase());

  document.getElementById("content").innerHTML = mdToHtml(text);

  generateTOC();
  activateTOCHighlight();
  loadNextPrev(file);
}

loadLesson();
</script>

</body>
</html>
