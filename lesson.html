<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<title>Bài học | Binh Blog</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
/* ===============================
   GLOBAL LAYOUT & THEME
================================= */
body {
  font-family: "Be Vietnam Pro", sans-serif;
  max-width: 1250px;
  margin: auto;
  padding: 20px;
  background: #faf9f4;
  color: #333;
  line-height: 1.8;
  transition: 0.3s;
  display: grid;
  grid-template-columns: 260px 1fr 250px;
  gap: 25px;
}
body.dark { background:#1b1b1b; color:#eee; }

/* ===============================
   PROGRESS BAR
================================= */
#progress-container {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 6px;
  z-index: 9999;
}
#progress-bar {
  height: 100%;
  width: 0%;
  background: #c9b3ff;
  transition: width 0.1s linear;
}
body.dark #progress-bar { background:#7a6adf; }

/* ===============================
   SIDEBAR (MODULE CURRICULUM)
================================= */
#sidebar {
  background:#ffffff;
  border-radius:12px;
  border:1px solid #ddd;
  padding:15px;
  position:sticky;
  top:20px;
  max-height:85vh;
  overflow-y:auto;
}
body.dark #sidebar { background:#2b2b2b; border-color:#666; }

.module-title {
  font-size:17px;
  font-weight:700;
  margin:10px 0 8px;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.lesson-item {
  padding:8px 12px;
  margin:4px 0;
  border-radius:8px;
  cursor:pointer;
  text-decoration:none;
  display:block;
  color:#333;
}
.lesson-item:hover { background:#ede3ff; }
.lesson-item.active {
  background:#d7caff;
  font-weight:700;
}
body.dark .lesson-item { color:#eee; }
body.dark .lesson-item.active { background:#5b4fa8; color:#fff; }

/* collapse */
.module-lessons { display:none; padding-left:5px; }
.module-open .module-lessons { display:block; }

/* ===============================
   CONTENT AREA
================================= */
.content-area { padding:0 10px; }

header {
  display:flex;
  justify-content: space-between;
  align-items:center;
  margin-bottom:25px;
}

.back-btn {
  background:#e6ddff;
  padding:8px 14px;
  border-radius:6px;
  text-decoration:none;
  color:#333;
  font-weight:600;
}
.back-btn:hover { background:#d1c3ff; }

.header-controls { display:flex; gap:8px; align-items:center; }

/* Reading button */
.reading-btn {
  background:#ffe9c6;
  padding:8px 12px;
  border-radius:6px;
  border:none;
  cursor:pointer;
  font-weight:600;
}
.reading-btn:hover { background:#ffdfad; }
body.dark .reading-btn { background:#705f33; color:white; }

/* Search */
#search-box {
  padding:8px 12px;
  border-radius:6px;
  border:1px solid #ccc;
  font-size:15px;
  width:220px;
}
#search-box:focus { border-color:#a88bff; }

/* fade-in animation */
.fade-in {
  opacity:0; transform:translateY(10px);
  animation:fadeIn 0.5s ease-out forwards;
}
@keyframes fadeIn { to { opacity:1; transform:translateY(0); } }

/* markdown content styling */
h2, h3 { margin-top:30px; color:#4a3fa8; }
body.dark h2, body.dark h3 { color:#cfc4ff; }

.box {
  padding:14px 18px;
  background:#fff;
  border-left:5px solid #9c7bff;
  border-radius:6px;
  margin:20px 0;
}
body.dark .box { background:#2a2a2a; border-color:#bba0ff; }

mark { background:#ffed8a; padding:2px 4px; border-radius:4px; }
body.dark mark { background:#caa52c; }

/* ===============================
   TOC FLOATING
================================= */
#toc {
  background:#ffffff;
  border-radius:12px;
  border:1px solid #ddd;
  padding:15px;
  position:sticky;
  top:20px;
  height:fit-content;
}
body.dark #toc { background:#2a2a2a; border-color:#555; }

#toc a {
  display:block;
  padding:4px 6px;
  margin-bottom:6px;
  text-decoration:none;
  color:#444;
  border-radius:6px;
}
#toc a.active {
  background:#d7caff;
  font-weight:700;
}
body.dark #toc a { color:#eee; }
body.dark #toc a.active { background:#5b4fa8; color:#fff; }

/* ===============================
   NEXT / PREV BUTTON
================================= */
.nav-buttons {
  display:flex;
  justify-content: space-between;
  margin-top:40px;
  gap:10px;
}
.np-btn {
  flex:1;
  padding:14px;
  background:#e6ddff;
  border-radius:8px;
  text-align:center;
  text-decoration:none;
  color:#333;
  font-weight:600;
}
.np-btn:hover { background:#d1c3ff; }
body.dark .np-btn { background:#5b4fa8; color:white; }

/* ===============================
   QUIZ MODAL STYLES
================================= */
#quiz-modal { display:none; position:fixed; left:0; top:0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index:99999; align-items:center; justify-content:center; }
#quiz-box { width:96%; max-width:780px; background:#fff; padding:18px; border-radius:10px; max-height:90vh; overflow:auto; box-shadow:0 10px 30px rgba(0,0,0,0.15); }
body.dark #quiz-box { background:#222; color:#eee; }
#quiz-box h3 { margin:0 0 6px 0; }
#quiz-box label { display:block; padding:8px; border-radius:8px; margin-bottom:8px; border:1px solid #eee; cursor:pointer; }
body.dark #quiz-box label { border:1px solid #444; }
#quiz-box label input { margin-right:8px; }

/* ===============================
   MOBILE RESPONSIVE & MOBILE OPTIMIZATIONS
================================= */
@media(max-width:900px){
  body { grid-template-columns:1fr; padding:10px; }
  #sidebar, #toc { display:none; }
  #mobile-sidebar-btn { display:inline-block; margin-bottom:12px; background:#d7caff; padding:10px 12px; border-radius:8px; border:none; }
  header { flex-direction: column; align-items:flex-start; gap:10px; }
  header h1 { font-size:20px; }
  #search-box { width:100%; }
  .nav-buttons { flex-direction:column; gap:10px; }
  .np-btn { width:100%; font-size:16px; padding:14px; }
  /* mobile slide sidebar */
  #sidebar.mobile-open { display:block !important; position:fixed; top:0; left:0; width:80%; max-width:300px; height:100vh; background:#fff; z-index:99998; padding:20px; border-right:1px solid #ddd; box-shadow:2px 0 10px rgba(0,0,0,0.12); }
  body.dark #sidebar.mobile-open { background:#2b2b2b; }
  #mobile-overlay { display:none; }
  #mobile-overlay.show { display:block; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.45); z-index:99997; }
}

/* ===============================
   READING MODE
================================= */
body.reading-mode { grid-template-columns:1fr !important; }
body.reading-mode #sidebar, body.reading-mode #toc { display:none !important; }
body.reading-mode .content-area { max-width:800px; margin:auto; }
</style>
</head>

<body>

<!-- Progress bar -->
<div id="progress-container"><div id="progress-bar"></div></div>

<!-- SIDEBAR -->
<div id="sidebar"></div>
 
<!-- CONTENT -->
<div class="content-area">
  <button id="mobile-sidebar-btn" style="display:none">📚 Danh sách bài</button>

  <header>
    <a href="/binh-blog/grammar-index.html" class="back-btn">← Quay lại</a>

    <h1 id="title">Đang tải...</h1>

    <div class="header-controls">
      <input id="search-box" type="text" placeholder="🔍 Tìm trong bài...">
      <button id="reading-toggle" class="reading-btn">📖 Reading Mode</button>
    </div>
  </header>

  <div id="content">Đang tải nội dung...</div>

<!-- BÀI TẬP CUỐI BÀI -->
<div id="exercise-section" style="
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 20px;
    margin-top: 40px;
    margin-bottom: 25px;
">
  <h2 style="margin-top:0; color:#4a3fa8;">📘 Bài tập củng cố</h2>
  <p style="margin-bottom:15px;">
    Nhấn nút <b>Luyện tập</b> để làm 10 câu kiểm tra dành riêng cho bài học này.
  </p>

  <button onclick="document.getElementById('open-quiz-btn').click()"
    style="
      background:#ffdede;
      padding:10px 16px;
      border-radius:8px;
      border:none;
      cursor:pointer;
      font-size:16px;
      font-weight:600;
    ">
    📘 Luyện tập
  </button>
   
  <div class="nav-buttons" id="nav-buttons"></div>

</div>
   
</div>

<!-- TOC -->
<div id="toc">
  <h3>Mục lục</h3>
  <ul id="toc-list"><li>Đang tạo...</li></ul>
</div>

<!-- Mobile overlay for sidebar/TOC -->
<div id="mobile-overlay"></div>

<!-- QUIZ POPUP -->
<div id="quiz-modal" aria-hidden="true">
  <div id="quiz-box" role="dialog" aria-modal="true">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <h3 id="quiz-title" style="margin:0">Quiz</h3>
      <div>
        <button id="quiz-close" style="background:#eee;border:none;padding:6px 10px;border-radius:6px;cursor:pointer;">Đóng</button>
      </div>
    </div>
    <div id="quiz-content">Đang tải quiz...</div>
    <div id="quiz-footer" style="margin-top:12px;display:flex;justify-content:space-between;align-items:center;">
      <div id="quiz-result"></div>
      <div>
        <button id="quiz-submit" style="background:#c9b3ff;border:none;padding:8px 12px;border-radius:6px;cursor:pointer;">Nộp bài</button>
        <button id="quiz-retry" style="background:#eee;border:none;padding:8px 12px;border-radius:6px;cursor:pointer;display:none;margin-left:6px;">Làm lại</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ===============================
   LẤY FILE HIỆN TẠI
================================= */
const params = new URLSearchParams(window.location.search);
const file = params.get("file");

/* Markdown -> HTML (mini parser) */
function mdToHtml(text) {
  return text
    .replace(/^# (.*$)/gim,"<h1>$1</h1>")
    .replace(/^## (.*$)/gim,"<h2>$1</h2>")
    .replace(/^### (.*$)/gim,"<h3>$1</h3>")
    .replace(/^\> (.*$)/gim,"<div class='box'>$1</div>")
    .replace(/^- (.*$)/gim,"<li>$1</li>")
    .replace(/\*\*(.*?)\*\*/gim,"<b>$1</b>")
    .replace(/\*(.*?)\*/gim,"<i>$1</i>");
}

/* ===============================
   PROGRESS BAR
================================= */
window.addEventListener("scroll", () => {
  const pageHeight = document.documentElement.scrollHeight - window.innerHeight;
  const scrolled = (window.scrollY / pageHeight) * 100;
  document.getElementById("progress-bar").style.width = scrolled + "%";
});

/* ===============================
   BUILD SIDEBAR (MODULE S1)
================================= */
async function loadSidebar() {
  const res = await fetch("/binh-blog/grammar/grammar.json");
  const list = await res.json();

  const sidebar = document.getElementById("sidebar");
  sidebar.innerHTML = "<h3>📘 Bài học</h3>";

  const modules = {
    "Tenses": list.slice(0, 12),
    "Modal Verbs": list.slice(12, 16),
    "Passive Voice": list.slice(16, 21),
    "Conditionals": list.slice(21, 25),
    "Verb Forms": list.slice(25, 30),
    "Nouns / Articles": list.slice(30, 36)
  };

  for (const moduleName in modules) {
    let lessons = modules[moduleName];

    const moduleDiv = document.createElement("div");
    moduleDiv.className = "module";

    moduleDiv.innerHTML = `
      <div class="module-title">
        <span>📚 ${moduleName}</span>
        <span>▾</span>
      </div>
      <div class="module-lessons"></div>
    `;

    const listDiv = moduleDiv.querySelector(".module-lessons");

    lessons.forEach(item => {
      const a = document.createElement("a");
      a.className = "lesson-item";
      a.href = `/binh-blog/lesson.html?file=${item.file}`;
      a.innerText = item.title;

      if (item.file === file) a.classList.add("active");

      listDiv.appendChild(a);
    });

    // auto open module chứa bài hiện tại
    if (lessons.some(x => x.file === file)) {
      moduleDiv.classList.add("module-open");
    }

    // toggle accordion
    moduleDiv.querySelector(".module-title").onclick = () =>
      moduleDiv.classList.toggle("module-open");

    sidebar.appendChild(moduleDiv);
  }
}

/* ===============================
   TABLE OF CONTENTS
================================= */
function generateTOC() {
  const toc = document.getElementById("toc-list");
  toc.innerHTML = "";

  const headers = document.querySelectorAll("h2,h3");
  headers.forEach(h => {
    const id = h.innerText.replace(/\s+/g,"-");
    h.id = id;
    toc.innerHTML += `
      <li style="margin-left:${h.tagName==='H3'?'15px':'0'}">
        <a href="#${id}" data-id="${id}">${h.innerText}</a>
      </li>`;
  });
}

function activateTOCHighlight() {
  const sections = document.querySelectorAll("h2,h3");
  const tocLinks = document.querySelectorAll("#toc a");
  window.addEventListener("scroll", () => {
    let current = "";
    sections.forEach(sec => {
      const top = sec.offsetTop - 140;
      if (scrollY >= top) current = sec.id;
    });
    tocLinks.forEach(link => {
      link.classList.remove("active");
      if (link.dataset.id === current) link.classList.add("active");
    });
  });
}

/* ===============================
   NEXT / PREV
================================= */
async function loadNextPrev() {
  const res = await fetch("/binh-blog/grammar/grammar.json");
  const list = await res.json();

  const i = list.findIndex(x => x.file === file);
  const prev = list[i - 1];
  const next = list[i + 1];

  let html = "";
  if (prev) html += `<a class="np-btn" href="/binh-blog/lesson.html?file=${prev.file}">← ${prev.title}</a>`;
  if (next) html += `<a class="np-btn" href="/binh-blog/lesson.html?file=${next.file}">${next.title} →</a>`;

  document.getElementById("nav-buttons").innerHTML = html;
}

/* ===============================
   SEARCH TRONG BÀI
================================= */
function removeHighlights() {
  const content = document.getElementById("content");
  content.innerHTML = content.innerHTML.replace(/<mark>(.*?)<\/mark>/g,"$1");
}

function highlightKeyword(keyword) {
  if (!keyword.trim()) return;
  removeHighlights();
  const content = document.getElementById("content");
  const html = content.innerHTML;
  const regex = new RegExp(`(${keyword})`,"gi");
  content.innerHTML = html.replace(regex,"<mark>$1</mark>");
  const firstHit = document.querySelector("mark");
  if (firstHit) firstHit.scrollIntoView({behavior:"smooth", block:"center"});
}

document.getElementById("search-box")
  .addEventListener("keydown", e => {
    if (e.key === "Enter") highlightKeyword(e.target.value);
  });

/* ===============================
   READING MODE (auto save)
================================= */
const readingBtn = document.getElementById("reading-toggle");
if (localStorage.getItem("readingMode") === "on") {
  document.body.classList.add("reading-mode");
  readingBtn.textContent = "🔙 Thoát Reading Mode";
} else {
  readingBtn.textContent = "📖 Reading Mode";
}
readingBtn.onclick = () => {
  document.body.classList.toggle("reading-mode");
  if (document.body.classList.contains("reading-mode")) {
    readingBtn.textContent = "🔙 Thoát Reading Mode";
    localStorage.setItem("readingMode","on");
  } else {
    readingBtn.textContent = "📖 Reading Mode";
    localStorage.setItem("readingMode","off");
  }
};

/* ===============================
   MOBILE SIDEBAR SLIDE-IN + TOC POPUP
================================= */
const mobileBtn = document.getElementById("mobile-sidebar-btn");
const sidebar = document.getElementById("sidebar");
const mobileOverlay = document.getElementById("mobile-overlay");

mobileBtn.onclick = () => {
  sidebar.classList.add("mobile-open");
  mobileOverlay.classList.add("show");
};
mobileOverlay.onclick = () => {
  sidebar.classList.remove("mobile-open");
  mobileOverlay.classList.remove("show");
};

/* Create mobile TOC popup when small */
function enableMobileTOCButton() {
  if (window.innerWidth >= 768) return;
  const existing = document.getElementById("mobile-toc-btn");
  if (existing) return;

  const tocBtn = document.createElement("button");
  tocBtn.id = "mobile-toc-btn";
  tocBtn.textContent = "☰ Mục lục";
  tocBtn.style = "width:100%;padding:10px;background:#e6ddff;border:none;border-radius:6px;margin:12px 0;font-weight:600;";
  document.querySelector(".content-area").insertBefore(tocBtn, document.getElementById("content"));

  const tocPopup = document.createElement("div");
  tocPopup.id = "toc-popup";
  tocPopup.style = "display:none;position:fixed;top:0;right:0;width:80%;max-width:300px;height:100vh;background:#fff;z-index:99999;padding:20px;overflow:auto;border-left:1px solid #ddd;";
  if (document.body.classList.contains("dark")) tocPopup.style.background = "#2a2a2a";
  tocPopup.innerHTML = "<h3>Mục lục</h3><div id='toc-copy'></div>";
  document.body.appendChild(tocPopup);

  tocBtn.onclick = () => {
    document.getElementById("toc-copy").innerHTML = document.getElementById("toc-list").outerHTML;
    tocPopup.style.display = "block";
    mobileOverlay.classList.add("show");
  };

  mobileOverlay.onclick = () => {
    tocPopup.style.display = "none";
    mobileOverlay.classList.remove("show");
  };
}

/* ===============================
   LOAD LESSON
================================= */
async function loadLesson() {
  if (!file) {
    document.getElementById("content").innerHTML = "<p>Không tìm thấy file.</p>";
    return;
  }
  const res = await fetch(`/binh-blog/grammar/${file}`);
  const text = await res.text();

  document.getElementById("title").innerText =
    file.replace(".md","").replace(/-/g," ").replace(/\b\w/g,c=>c.toUpperCase());

  const cont = document.getElementById("content");
  cont.innerHTML = mdToHtml(text);
  cont.classList.add("fade-in");

  generateTOC();
  activateTOCHighlight();
  enableMobileTOCButton();
}

/* ===============================
   MOBILE ACCORDION FOR MODULES
================================= */
function enableMobileAccordion() {
  if (window.innerWidth > 768) return;
  const modules = document.querySelectorAll(".module");
  modules.forEach(m => {
    const title = m.querySelector(".module-title");
    title.addEventListener("click", () => m.classList.toggle("module-open"));
  });
}

/* ===============================
   QUIZ POPUP ENGINE (loads / renders / scores)
================================= */
// helper to get current lesson slug (from ?file=present-simple.md)
function currentSlug() {
  const p = new URLSearchParams(window.location.search);
  const f = p.get("file") || "";
  return f.replace(".md","");
}

const openBtn = document.getElementById("open-quiz-btn");
const modal = document.getElementById("quiz-modal");
const quizContent = document.getElementById("quiz-content");
const quizTitle = document.getElementById("quiz-title");
const quizSubmit = document.getElementById("quiz-submit");
const quizClose = document.getElementById("quiz-close");
const quizResult = document.getElementById("quiz-result");
const quizRetry = document.getElementById("quiz-retry");

let quizData = null;
let userAnswers = {};

// Open modal
openBtn && openBtn.addEventListener("click", async () => {
  const slug = currentSlug();
  if (!slug) { alert("Không xác định được bài học."); return; }
  modal.style.display = "flex";
  await loadQuiz(slug);
});

// Close
quizClose.addEventListener("click", () => {
  modal.style.display = "none";
});

// Load quiz JSON
async function loadQuiz(slug) {
  quizContent.innerHTML = "Đang tải quiz...";
  quizResult.innerHTML = "";
  quizRetry.style.display = "none";
  quizSubmit.style.display = "inline-block";
  userAnswers = {};
  try {
    const res = await fetch(`/binh-blog/grammar/quiz/${slug}.json`);
    if (!res.ok) { quizContent.innerHTML = "<p>Không tìm thấy quiz cho bài này.</p>"; return; }
    quizData = await res.json();
    renderQuiz(quizData);
  } catch (e) {
    quizContent.innerHTML = "<p>Lỗi khi tải quiz.</p>";
    console.error(e);
  }
}

// Render quiz questions (multiple choice)
function renderQuiz(data) {
  quizTitle.innerText = data.title + " — Quiz";
  const html = data.questions.map((q, idx) => {
    const choices = q.choices.map((c, ci) => {
      return `<label style="display:block;padding:8px;border-radius:6px;margin-bottom:6px;border:1px solid #eee;cursor:pointer;">
        <input type="radio" name="q${idx}" value="${ci}" style="margin-right:8px">${String.fromCharCode(65+ci)}. ${c}
      </label>`;
    }).join("");
    return `<div style="margin-bottom:12px;" data-qid="${q.id}">
      <div style="font-weight:600;margin-bottom:6px;">${idx+1}. ${q.question}</div>
      <div>${choices}</div>
      <div class="q-explain" style="display:none;margin-top:6px;color:#444;background:#fafafa;padding:8px;border-radius:6px;">${q.explanation}</div>
    </div>`;
  }).join("");
  quizContent.innerHTML = html;
  // attach change listeners
  data.questions.forEach((q, idx) => {
    const radios = quizContent.querySelectorAll(`input[name="q${idx}"]`);
    radios.forEach(r => {
      r.addEventListener("change", () => {
        userAnswers[q.id] = parseInt(r.value,10);
      });
    });
  });
  quizContent.scrollTop = 0;
}

// Submit quiz
quizSubmit.addEventListener("click", () => {
  if (!quizData) return;
  const total = quizData.questions.length;
  let correct = 0;
  quizData.questions.forEach((q, idx) => {
    const u = userAnswers[q.id];
    const qDiv = quizContent.querySelector(`[data-qid="${q.id}"]`);
    const explainDiv = qDiv.querySelector(".q-explain");
    if (u === undefined) qDiv.style.opacity = "0.9";
    if (u === q.answer) {
      correct++;
      const labels = qDiv.querySelectorAll("label");
      labels.forEach((lab, ci) => { if (ci === u) lab.style.background = "#d4ffd9"; });
    } else {
      const labels = qDiv.querySelectorAll("label");
      labels.forEach((lab, ci) => {
        if (ci === q.answer) lab.style.background = "#d4ffd9";
        if (ci === (userAnswers[q.id] || -1) && ci !== q.answer) lab.style.background = "#ffd9d9";
      });
    }
    explainDiv.style.display = "block";
  });

  const score = Math.round((correct/total)*100);
  quizResult.innerHTML = `<div style="font-weight:700">Điểm: ${score}% — ${correct}/${total} đúng</div>`;
  // save to localStorage
  const slug = currentSlug();
  try { localStorage.setItem('quiz-score-'+slug, JSON.stringify({score, correct, total, time:Date.now()})); } catch(e){}
  quizSubmit.style.display = "none";
  quizRetry.style.display = "inline-block";
});

// Retry
quizRetry.addEventListener("click", () => {
  const slug = currentSlug();
  loadQuiz(slug);
});

// allow closing modal with ESC and clicking outside
document.addEventListener("keydown", (e) => { if (e.key === "Escape") modal.style.display = "none"; });
modal.addEventListener("click", (e) => { if (e.target === modal) modal.style.display = "none"; });

/* ===============================
   INIT
================================= */
loadLesson();
loadSidebar();
loadNextPrev();
enableMobileAccordion();

// ensure mobile TOC prepared
setTimeout(enableMobileTOCButton, 500);
</script>
