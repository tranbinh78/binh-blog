<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài học | Bình Blog</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            background: #f7f5ef;
        }
        .container {
            max-width: 1280px;
            margin: auto;
            padding: 20px;
            display: flex;
        }
        .sidebar {
            width: 260px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            height: fit-content;
            border: 1px solid #e0ded8;
        }
        .content {
            flex: 1;
            margin-left: 24px;
            background: white;
            padding: 32px;
            border-radius: 14px;
            border: 1px solid #e0ded8;
        }
        .toc {
            width: 260px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-left: 24px;
            height: fit-content;
            border: 1px solid #e0ded8;
        }

        /* Modal Quiz */
        #quizModal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.45);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        #quizBox {
            width: 70%;
            max-height: 90%;
            overflow-y: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #ddd;
        }
        .answer.correct {
            background: #d4f8d4 !important;
        }
        .answer.wrong {
            background: #ffd6d6 !important;
        }

        .quiz-choice {
            padding: 10px 14px;
            border: 1px solid #ccc;
            margin-top: 4px;
            border-radius: 6px;
            cursor: pointer;
        }
        .quiz-choice:hover {
            background: #f0f0f0;
        }

        .closeQuiz {
            float: right;
            background: #ddd;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
        }
        .submit-btn {
            margin-top: 20px;
            padding: 12px 20px;
            background: #4a9cff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .submit-btn:hover {
            background: #1f7cff;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="sidebar" id="sidebar">
        <!-- sidebar load động bằng JS -->
    </div>

    <div class="content">
        <button onclick="history.back()" class="backBtn">← Quay lại</button>
        <div id="lesson-title"></div>
        <div id="lesson-content">Đang tải nội dung…</div>

        <div id="practice-box" style="margin-top:40px; padding:20px; border-radius:10px; border:1px solid #e0ded8;">
            <h3>📘 Bài tập củng cố</h3>
            <p>Nhấn nút <b>Luyện tập</b> để làm 10 câu kiểm tra riêng cho bài học này.</p>
            <button id="startQuizBtn" class="submit-btn" style="background:#ff7777">Luyện tập</button>
        </div>
    </div>

    <div class="toc" id="toc"></div>
</div>

<!-- QUIZ MODAL -->
<div id="quizModal">
    <div id="quizBox">
        <span class="closeQuiz" onclick="closeQuiz()">Đóng</span>
        <h2 id="quizTitle"></h2>
        <div id="quizContainer"></div>
        <button id="submitQuizBtn" class="submit-btn">Nộp bài</button>
    </div>
</div>
<script>
// Lấy query ?file=
function getQueryVariable(variable) {
    const query = window.location.search.substring(1);
    const vars = query.split("&");
    for (let i = 0; i < vars.length; i++) {
        const pair = vars[i].split("=");
        if (pair[0] === variable) return decodeURIComponent(pair[1]);
    }
    return null;
}

const lessonFile = getQueryVariable("file");

// Tải file .md
if (lessonFile) {
    fetch(`grammar/${lessonFile}.md`)
        .then(res => res.text())
        .then(md => {
            document.getElementById("lesson-content").innerHTML = marked.parse(md);

            const title = md.split("\n")[0].replace("#", "").trim();
            document.getElementById("lesson-title").innerHTML = `<h1>${title}</h1>`;

            buildTOC();
        });
} else {
    document.getElementById("lesson-content").innerHTML = "Không tìm thấy bài học.";
}

// Build Sidebar
fetch("grammar/grammar.json")
    .then(res => res.json())
    .then(data => {
        const sidebar = document.getElementById("sidebar");
        sidebar.innerHTML = "<h3>📚 Mục lục Grammar</h3>";

        Object.keys(data).forEach(sectionName => {
            const sec = document.createElement("div");
            sec.className = "sidebar-section";
            sec.innerHTML = `<h4>${sectionName}</h4>`;

            const ul = document.createElement("ul");
            data[sectionName].forEach(item => {
                const li = document.createElement("li");
                li.innerHTML = `<a href="lesson.html?file=${item.file}">${item.title}</a>`;
                ul.appendChild(li);
            });

            sec.appendChild(ul);
            sidebar.appendChild(sec);
        });
    });

// Build Table of Contents
function buildTOC() {
    const toc = document.getElementById("toc");
    toc.innerHTML = "<h3>Mục lục</h3>";

    const headers = document.querySelectorAll(".content h1, .content h2, .content h3");
    headers.forEach((h, i) => {
        const id = "section-" + i;
        h.id = id;

        const item = document.createElement("div");
        item.className = "toc-item";
        item.innerHTML = `<a href="#${id}">${h.innerText}</a>`;
        toc.appendChild(item);
    });
}
</script>

 
<!-- QUIZ ENGINE -->
<script>
const quizModal = document.getElementById("quizModal");
const quizTitle = document.getElementById("quizTitle");
const quizContainer = document.getElementById("quizContainer");
const submitQuizBtn = document.getElementById("submitQuizBtn");
const startQuizBtn = document.getElementById("startQuizBtn");

// Mở modal luyện tập
startQuizBtn.addEventListener("click", () => {
    const file = getQueryVariable("file");
    if (!file) {
        alert("Không tìm thấy bài học!");
        return;
    }

    loadQuiz(file);
    quizModal.style.display = "flex";
});

// Đóng modal
function closeQuiz() {
    quizModal.style.display = "none";
}

// Tải file JSON đúng bài
function loadQuiz(file) {
    fetch(`../quiz/${file}.json`)
        .then(res => res.json())
        .then(data => {
            quizTitle.innerText = data.title;
            quizContainer.innerHTML = "";

            data.questions.forEach((q, index) => {
                let html = `
                    <div class="quiz-block">
                        <p><b>${index + 1}. ${q.question}</b></p>
                `;

                q.choices.forEach((c, i) => {
                    html += `
                        <label class="quiz-option">
                            <input type="radio" name="q${index}" value="${i}">
                            ${String.fromCharCode(65 + i)}. ${c}
                        </label>
                    `;
                });

                html += `
                        <p id="exp${index}" style="display:none; margin-top:6px; color:#444;"></p>
                        <hr>
                    </div>
                `;

                quizContainer.innerHTML += html;
            });

            // Gắn hành động nộp bài
            submitQuizBtn.onclick = () => checkQuiz(data);
        })
        .catch(err => {
            quizContainer.innerHTML = "<p>Không tải được bài luyện tập.</p>";
            console.error(err);
        });
}

// Kiểm tra bài
function checkQuiz(data) {
    data.questions.forEach((q, index) => {
        const options = document.querySelectorAll(`input[name="q${index}"]`);

        let selected = -1;

        // reset màu trước
        options.forEach(o => {
            o.parentElement.style.background = "transparent";
        });

        // xác định đáp án chọn
        options.forEach((o, i) => {
            if (o.checked) selected = i;
        });

        // tô xanh đáp án đúng
        const correct = options[q.answer];
        if (correct) {
            correct.parentElement.style.background = "#c8ffc8";
        }

        // tô đỏ nếu sai
        if (selected !== -1 && selected !== q.answer) {
            const wrong = options[selected];
            if (wrong) wrong.parentElement.style.background = "#ffd6d6";
        }

        // hiện giải thích
        const exp = document.getElementById("exp" + index);
        exp.style.display = "block";
        exp.innerText = q.explanation;
    });
}
</script>
</body>
</html>
