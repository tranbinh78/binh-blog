  <style>
    body {

    header {

    /* Cards */

    /* Pagination */

    /* Dark mode */

    body.dark header{ background:#222; }

  </style>
</head>

<body>
<header>
  <h1>Binh Blog</h1>
  <p>Chia sẻ kiến thức tiếng Anh, lập trình và cuộc sống</p>

  <div id="hamburger">☰   </div>

  <nav>
    <a href="#" onclick="loadPosts()">Home</a>
    <a href="#" onclick="loadPosts('Tiếng Anh')">Tiếng Anh</a>

     <!-- Trang About -->
    <a href="about.html">About</a>

<main>

<div id="search-wrapper">

</div>


<div id="post-list">
  <p>Đang tải bài viết...</p>

</main>

<footer>
  ©2025 — Binh Blog

<style>
/* ===== RESET ===== */
html { scroll-behavior: smooth; }
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: "Be Vietnam Pro", sans-serif;
  background: #fffdf9;
  color: #333;
  line-height: 1.85;
}

/* ===== HEADER ===== */
header {
  background: #d7f3e3;
  padding: 20px;
  text-align: center;
  border-bottom: 2px solid #cde7ff;
}

header h1 { font-size: 28px; margin-bottom: 10px; }
header p { font-size: 16px; color: #666; }

nav a {
  margin: 0 12px;
  text-decoration: none;
  color: #333;
  padding: 6px 10px;
  border-radius: 6px;
}
nav a:hover { background: #cde7ff; }

/* ===== HAMBURGER MENU ===== */
#hamburger {
  display: none;
  font-size: 30px;
  cursor: pointer;
  padding: 8px 12px;
  background: #cde7ff;
  border-radius: 8px;
  width: fit-content;
  margin: 10px auto;
}

@media (max-width: 768px) {
  #hamburger { display: block; }

  nav {
    display: none;
    flex-direction: column;
    background: #fff;
    border: 1px solid #dcd3ff;
    padding: 15px;
    margin-top: 10px;
    border-radius: 12px;
  }

  nav.show { display: flex; }
  nav a {
    background: #f3eaff;
    margin: 6px 0;
    text-align: center;
  }
}

/* ===== POSTS ===== */
main {
  max-width: 800px;
  margin: 40px auto;
  padding: 0 15px;
}

.post-card {
  display: flex;
  background: #fff;
  border: 1px solid #e0d8ff;
  border-radius: 14px;
  overflow: hidden;
  margin-bottom: 28px;
  transition: 0.3s;
}

.post-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 20px rgba(120, 90, 255, 0.12);
}

.post-card img {
  width: 180px;
  object-fit: cover;
}

.post-info { padding: 16px; }
.post-info h2 { margin-bottom: 8px; font-size: 20px; }
.post-info .desc { color: #666; margin-bottom: 6px; }
.post-info .date { color: #999; font-size: 13px; }

a.btn {
  background: #d7caff;
  padding: 10px 18px;
  border-radius: 10px;
  text-decoration: none;
  color: #333;
  font-weight: 600;
}
a.btn:hover { background: #c9b3ff; }

/* MOBILE FIX */
@media (max-width:768px) {
  .post-card { flex-direction: column; text-align: center; }
  .post-card img { width: 100%; }
}

/* ===== SEARCH BOX ===== */
#search-wrapper { position: relative; margin-bottom: 12px; }
#search {
  width: 100%;
  padding: 10px 14px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 16px;
}

#suggest-list {
  position: absolute;
  top: 45px;
  left: 0;
  width: 100%;
  background: white;
  border: 1px solid #ddd;
  list-style: none;
  border-radius: 8px;
  display: none;
  max-height: 220px;
  overflow-y: auto;
  z-index: 99;
}

#suggest-list li {
  padding: 8px 12px;
  cursor: pointer;
}
#suggest-list li:hover { background: #f0f0ff; }

.search-highlight { font-weight: 700; color: #2f1fa6; }

/* ===== PAGINATION ===== */
#pagination {
  text-align: center;
  margin: 30px 0;
}

.page-btn {
  padding: 8px 14px;
  margin: 0 5px;
  border-radius: 6px;
  background: #f3eaff;
  cursor: pointer;
  font-weight: 600;
}

.page-btn.active {
  background: #d7caff;
}

/* DARK MODE */
body.dark { background: #1a1a1a; color: #eee; }
body.dark nav a { color: white; }
body.dark .post-card { background: #333; border-color: #555; }
body.dark footer { background: #222; }

/* FOOTER */
footer {
  text-align:center; padding:25px; margin-top:40px;
  background:#fef6ff; border-top:1px solid #e9d8f2;
}

.sug-item:hover {
    background: #f0f0f0;
}

</style>

<script>
/* =========================
   BIẾN TOÀN CỤC
========================= */
let POSTS = [];
let FILTER_CATEGORY = null;
let CURRENT_PAGE = 1;
const POSTS_PER_PAGE = 5;

/* =========================
   LOAD POSTS
========================= */
async function loadPosts(filter = null) {
  FILTER_CATEGORY = filter;
  CURRENT_PAGE = 1;

  const res = await fetch("/binh-blog/posts/posts.json");
  let posts = await res.json();

  // Sắp xếp bài mới → cũ
  posts.sort((a, b) => new Date(b.date) - new Date(a.date));

  // Nếu lọc chuyên mục
  if (filter) {
    posts = posts.filter(p => p.category === filter);
  }

  POSTS = posts;
  renderPage(1);
  renderPagination();
}

/* =========================
   RENDER PAGE
========================= */
function renderPage(page) {
  CURRENT_PAGE = page;
  const start = (page - 1) * POSTS_PER_PAGE;
  const end = start + POSTS_PER_PAGE;

  const displayPosts = POSTS.slice(start, end);
  const container = document.getElementById("post-list");
  container.innerHTML = "";

  displayPosts.forEach(post => {
    container.innerHTML += `
      <article class="post-card">
        <img src="${post.thumbnail}" alt="${post.title}">
        <div class="post-info">
          <h2>${post.title}</h2>
          <p class="desc">${post.description}</p>
          <p class="date">📅 ${post.date}</p>
          <a href="/binh-blog/posts/${post.file}" class="btn">Đọc bài →</a>
        </div>
      </article>
    `;
  });
}

/* =========================
   PHÂN TRANG
========================= */
function renderPagination() {
  const totalPages = Math.ceil(POSTS.length / POSTS_PER_PAGE);
  const pag = document.getElementById("pagination");
  pag.innerHTML = "";

  if (totalPages <= 1) return;

  if (CURRENT_PAGE > 1) {
    pag.innerHTML += `<span class="page-btn" onclick="renderPage(${CURRENT_PAGE - 1})">← Trước</span>`;
  }

  for (let i = 1; i <= totalPages; i++) {
    pag.innerHTML += `
      <span class="page-btn ${i === CURRENT_PAGE ? "active" : ""}" 
            onclick="renderPage(${i})">${i}</span>
    `;
  }

  if (CURRENT_PAGE < totalPages) {
    pag.innerHTML += `<span class="page-btn" onclick="renderPage(${CURRENT_PAGE + 1})">Tiếp →</span>`;
  }
}

 
// ⭐ THÊM HÀM NÀY ĐỂ FIX LỖI
function filterCategory(cat) {
  loadPosts(cat);
}

/* =========================
   DARK MODE
========================= */
const toggleBtn = document.getElementById("theme-toggle");
if (localStorage.getItem("theme") === "dark") {
  document.body.classList.add("dark");
  toggleBtn.textContent = "Light Mode";
}

toggleBtn.addEventListener("click", () => {
  document.body.classList.toggle("dark");
  const isDark = document.body.classList.contains("dark");
  toggleBtn.textContent = isDark ? "Light Mode" : "Dark Mode";
  localStorage.setItem("theme", isDark ? "dark" : "light");
});

/* =========================
   HAMBURGER MENU
========================= */
const ham = document.getElementById("hamburger");
const nav = document.querySelector("nav");

ham.addEventListener("click", () => {
  nav.classList.toggle("show");
});

document.addEventListener("click", e => {
  if (!nav.contains(e.target) && !ham.contains(e.target)) {
    nav.classList.remove("show");
  }
});

/* =========================
   KHỞI ĐỘNG TRANG
========================= */
loadPosts();      // HIỂN THỊ BÀI VIẾT
enableSearch();   // BẬT SEARCH

/* ===== SEARCH HELPERS (SAFE VERSION) ===== */

// highlight từ khóa trong text (dùng trong render kết quả & gợi ý)
function highlight(text, keyword) {
  if (!keyword) return text;
  const safeKeyword = keyword.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const regex = new RegExp(safeKeyword, "gi");
  return text.replace(regex, match => `<mark>${match}</mark>`);
}

// Google-mini search: tìm trong title, content, category, tags; sắp theo điểm
function doFullSearch(keyword) {
  keyword = (keyword || "").trim().toLowerCase();
  const list = document.getElementById("post-list");
  if (!list) return;

  list.innerHTML = "";

  if (!keyword) {
    list.innerHTML = "<p>Hãy nhập từ khóa để tìm kiếm.</p>";
    return;
  }

  const scored = [];

  POSTS.forEach(post => {
    let score = 0;

    const title = (post.title || "").toLowerCase();
    const desc = (post.description || "").toLowerCase();
    const category = (post.category || "").toLowerCase();
    const tags = (post.tags || []).join(" ").toLowerCase();

    if (title.includes(keyword)) score += 5;
    if (category.includes(keyword)) score += 3;
    if (tags.includes(keyword)) score += 3;

    // Tìm trong mô tả bài viết
    const matches = desc.match(new RegExp(keyword, "gi"));
    if (matches) score += matches.length;

    if (score > 0) scored.push({ post, score });
  });

  scored.sort((a, b) => b.score - a.score);

  if (scored.length === 0) {
    list.innerHTML = "<p>Không tìm thấy bài nào...</p>";
    return;
  }

  scored.forEach(({ post }) => {
    const item = document.createElement("div");
    item.className = "post-item";

    const highlightedTitle = highlight(post.title || "", keyword);
    const highlightedDesc = highlight(
      (post.description || "").substring(0, 180),
      keyword
    );

    item.innerHTML = `
      <h3>${highlightedTitle}</h3>
      <p>${highlightedDesc}</p>
      <div style="font-size:14px;color:#777;margin-top:5px;">
        Category: ${post.category || "Không có"}<br>
        Tags: ${(post.tags || []).join(", ")}
      </div>
    `;
    list.appendChild(item);
  });
}

// Enable search: bắt Enter + gợi ý (keyup)
function enableSearch() {
  const searchBox = document.getElementById("search");
  const suggestList = document.getElementById("suggest-list"); // đảm bảo HTML có id này

  if (!searchBox) return;

  // Enter để search
  searchBox.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      doFullSearch(searchBox.value);
      if (suggestList) suggestList.style.display = "none";
    }
  });

  // Keyup để show suggestions
  searchBox.addEventListener("keyup", function (e) {
    showSuggestions(searchBox.value);
  });
}

// Tạo và hiển thị gợi ý (autocomplete) — an toàn, dùng template string
function showSuggestions(keyword) {
  const sugBox = document.getElementById("suggest-list");
  if (!sugBox) return;

  if (!keyword || keyword.trim() === "") {
    sugBox.style.display = "none";
    sugBox.innerHTML = "";
    return;
  }

  const lower = keyword.toLowerCase();
  let SugList = [];

  POSTS.forEach(post => {
    if (post.title && post.title.toLowerCase().includes(lower)) SugList.push(post.title);
    if (post.category && post.category.toLowerCase().includes(lower)) SugList.push(post.category);
    if (post.tags) post.tags.forEach(tag => {
      if (tag.toLowerCase().includes(lower)) SugList.push(tag);
    });
  });

  SugList = [...new Set(SugList)].slice(0, 8); // loại trùng + giới hạn

  if (SugList.length === 0) {
    sugBox.style.display = "none";
    sugBox.innerHTML = "";
    return;
  }

  sugBox.innerHTML = SugList.map(s => `
    <div class="sug-item" style="padding:8px;cursor:pointer;">
      ${highlight(s, keyword)}
    </div>
  `).join("");

  sugBox.style.display = "block";

  // click vào gợi ý: điền ô search + chạy full search
  sugBox.querySelectorAll(".sug-item").forEach(item => {
    item.addEventListener("click", () => {
      const text = item.innerText || item.textContent;
      document.getElementById("search").value = text;
      sugBox.style.display = "none";
      doFullSearch(text);
    });
  });
}

</script>
</body>
</html>
