<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Grammar Test – Binh Blog</title>

<link rel="stylesheet" href="/binh-blog/style.css" />

<style>
/* ===============================
   LAYOUT & TEST UI
================================= */
.container { max-width:1200px; margin:0 auto; padding:20px; display:flex; gap:22px; }
aside.sidebar { width:260px; flex-shrink:0; }
.content-area { flex:1; }

.test-box { background:white; padding:20px; border-radius:12px; box-shadow:0 4px 16px rgba(0,0,0,0.05); }
.test-controls { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:16px; }
.select { padding:8px 12px; border-radius:6px; border:1px solid #ccc; cursor:pointer; }
#start-btn, #submit-btn, #retry-btn {
  padding:8px 16px; border:none; border-radius:6px; cursor:pointer; font-weight:600;
}
#start-btn { background:#9d6cff; color:white; }
#submit-btn { background:#6ccf7d; color:white; display:none; }
#retry-btn { background:#ffa8a8; color:white; display:none; }

.timer-box {
  font-size:20px;
  font-weight:700;
  color:#d9534f;
  margin-bottom:12px;
  display:none;
}

.question-item {
  background:#fafafa;
  border:1px solid #e5e5e5;
  padding:14px;
  border-radius:8px;
  margin-bottom:12px;
}
.q-title { font-weight:700; margin-bottom:8px; }

.question-item label {
  display:block;
  padding:8px;
  border-radius:6px;
  border:1px solid #ddd;
  margin-bottom:6px;
  cursor:pointer;
}

.correct-answer { background:#d4ffd9 !important; }
.wrong-answer { background:#ffd9d9 !important; }

#result-box {
  font-size:20px;
  font-weight:700;
  margin-top:20px;
}
</style>
</head>

<body>

<!-- HEADER (giống các trang khác) -->
<div class="topbar">
  <a href="/binh-blog/" class="logo">Binh Blog</a>
  <button id="reading-toggle">Reading Mode</button>
  <input id="search-box" placeholder="Tìm trong bài..." />
</div>

<div class="container">

<!-- SIDEBAR (auto load từ grammar.json) -->
<aside class="sidebar" id="sidebar">Đang tải...</aside>

<!-- MAIN TEST AREA -->
<main class="content-area">
  <h1>Grammar Test</h1>

  <div class="test-box">

    <div class="test-controls">
      <select id="group-select" class="select">
        <option value="">-- Chọn nhóm --</option>
        <option value="present">Present Tenses</option>
        <option value="past">Past Tenses</option>
        <option value="future">Future Tenses</option>
        <option value="conditionals">Conditionals</option>
        <option value="modal">Modal Verbs</option>
        <option value="verbs">Verb Forms</option>
        <option value="all-grammar">All Grammar</option>
      </select>

      <select id="num-select" class="select">
        <option value="10">10</option>
        <option value="20" selected>20</option>
        <option value="40">40</option>
        <option value="60">60</option>
        <option value="100">100</option>
      </select>

      <select id="mode-select" class="select">
        <option value="practice">Practice</option>
        <option value="exam">Exam Mode</option>
      </select>

      <button id="start-btn">Bắt đầu</button>
      <button id="submit-btn">Nộp bài</button>
      <button id="retry-btn">Làm lại</button>
    </div>

    <div id="timer-box" class="timer-box"></div>

    <div id="questions"></div>
    <div id="result-box"></div>

  </div>
</main>

</div>

<script>
/* ======================================================================
   LOAD SIDEBAR (GIỐNG lesson.html)
====================================================================== */
async function loadSidebar() {
  try {
    const res = await fetch("/binh-blog/grammar/grammar.json");
    const list = await res.json();
    const sidebar = document.getElementById("sidebar");
    sidebar.innerHTML = "<h3>Bài học</h3>";

    const modules = {
      "Tenses": list.slice(0, 13),
      "Modal Verbs": list.slice(13, 17),
      "Passive Voice": list.slice(17, 22),
      "Conditionals": list.slice(22, 26),
      "Verb Forms": list.slice(26, 35),
      "Advanced Grammar": list.slice(35, 40)
    };

    for (const mod in modules) {
      const box = document.createElement("div");
      box.innerHTML = `<h4>${mod}</h4>`;
      modules[mod].forEach(item => {
        const a = document.createElement("a");
        a.href = `/binh-blog/lesson.html?file=${item.file}`;
        a.className = "lesson-link";
        a.innerText = item.title;
        box.appendChild(a);
      });
      sidebar.appendChild(box);
    }

    // THÊM “Grammar Tests”
    const testBox = document.createElement("div");
    testBox.innerHTML = `<h4>Grammar Tests</h4>
      <a href="/binh-blog/grammar/test.html?group=present">Present Tenses Test</a>
      <a href="/binh-blog/grammar/test.html?group=past">Past Tenses Test</a>
      <a href="/binh-blog/grammar/test.html?group=future">Future Tenses Test</a>
      <a href="/binh-blog/grammar/test.html?group=conditionals">Conditionals Test</a>
      <a href="/binh-blog/grammar/test.html?group=modal">Modal Verbs Test</a>
      <a href="/binh-blog/grammar/test.html?group=verbs">Verb Forms Test</a>
      <a href="/binh-blog/grammar/test.html?group=all-grammar">All Grammar Test</a>`;
    sidebar.appendChild(testBox);

  } catch(e) {
    document.getElementById("sidebar").innerText = "Lỗi sidebar";
  }
}
loadSidebar();

/* ======================================================================
   LOAD QUESTIONS FROM JSON
====================================================================== */
let TEST_DATA = {};
let currentGroup = "";
let timer = null;
let timeLeft = 0;

async function loadTestData() {
  const res = await fetch("/binh-blog/grammar/quiz/test-groups.json");
  TEST_DATA = await res.json();
}
loadTestData();

/* ======================================================================
   RENDER TEST
====================================================================== */
function renderTest(group, count) {
  currentGroup = group;

  const pool = TEST_DATA[group];
  if (!pool) {
    document.getElementById("questions").innerHTML =
      "<p>Không có dữ liệu nhóm này.</p>";
    return;
  }

  const selected = [...pool].sort(() => Math.random() - 0.5).slice(0, count);

  const qBox = document.getElementById("questions");
  qBox.innerHTML = "";

  selected.forEach((q, idx) => {
    const div = document.createElement("div");
    div.className = "question-item";
    div.dataset.answer = q.answer;

    div.innerHTML = `
      <div class="q-title">${idx+1}. ${q.question}</div>
      ${q.choices.map((c,i)=>`
        <label>
          <input type="radio" name="q${idx}" value="${i}">
          ${String.fromCharCode(65+i)}. ${c}
        </label>
      `).join("")}
    `;
    qBox.appendChild(div);

    div.querySelectorAll("input[type=radio]").forEach(r => {
      r.addEventListener("change", () => {
        div.dataset.user = r.value;
      });
    });
  });

  document.getElementById("submit-btn").style.display = "inline-block";
  document.getElementById("retry-btn").style.display = "none";
  document.getElementById("result-box").innerHTML = "";
}

/* ======================================================================
   TIMER — AUTOMATIC SUBMIT WHEN EXAM MODE
====================================================================== */
function startTimer(seconds) {
  timeLeft = seconds;
  const box = document.getElementById("timer-box");

  box.style.display = "block";
  box.textContent = formatTime(timeLeft);

  clearInterval(timer);

  timer = setInterval(() => {
    timeLeft--;
    box.textContent = formatTime(timeLeft);

    if (timeLeft <= 0) {
      clearInterval(timer);
      autoSubmit();
    }
  }, 1000);
}

function formatTime(sec) {
  const m = Math.floor(sec/60);
  const s = sec % 60;
  return `${m}:${s.toString().padStart(2,"0")}`;
}

/* ======================================================================
   SUBMIT TEST
====================================================================== */
function submitTest(auto=false) {
  clearInterval(timer);

  const qItems = document.querySelectorAll(".question-item");
  let correct = 0;

  qItems.forEach(div => {
    const ans = parseInt(div.dataset.answer);
    const user = parseInt(div.dataset.user ?? -1);
    const labels = div.querySelectorAll("label");

    labels.forEach((lab,i)=>{
      if (i === ans) lab.classList.add("correct-answer");
      if (i === user && user !== ans) lab.classList.add("wrong-answer");
    });

    if (user === ans) correct++;
  });

  document.getElementById("result-box").innerHTML =
    `Kết quả: <b>${correct}/${qItems.length}</b>`;

  document.getElementById("submit-btn").style.display = "none";
  document.getElementById("retry-btn").style.display = "inline-block";

  if (auto) alert("Hết giờ! Hệ thống đã tự động nộp bài.");
}

function autoSubmit() { submitTest(true); }

/* ======================================================================
   BUTTON EVENTS
====================================================================== */
document.getElementById("start-btn").addEventListener("click", ()=>{
  const g = document.getElementById("group-select").value;
  const n = parseInt(document.getElementById("num-select").value);
  const mode = document.getElementById("mode-select").value;

  if (!g) { alert("Chọn nhóm trước."); return; }

  renderTest(g,n);

  if (mode==="exam") {
    startTimer(n*60);
  } else {
    document.getElementById("timer-box").style.display = "none";
  }
});

document.getElementById("submit-btn").addEventListener("click", ()=>{
  submitTest(false);
});

document.getElementById("retry-btn").addEventListener("click", ()=>{
  const g = currentGroup;
  const n = parseInt(document.getElementById("num-select").value);
  renderTest(g,n);
});

/* ======================================================================
   AUTO START FROM URL
====================================================================== */
function autoStart() {
  const p = new URLSearchParams(window.location.search);
  const g = p.get("group");
  const n = p.get("num");
  const m = p.get("mode");

  if (!g) return;

  document.getElementById("group-select").value = g;
  document.getElementById("num-select").value = n ?? (g==="all-grammar" ? "60":"20");
  if (m) document.getElementById("mode-select").value = m;

  document.getElementById("start-btn").click();
}

setTimeout(autoStart,500);

</script>
</body>
</html>
