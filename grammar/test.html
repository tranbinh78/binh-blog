<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Grammar Test – Binh Blog</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="/binh-blog/style.css">

<style>
/* --- Styles dành riêng cho trang Test (bổ sung nhẹ nhàng) --- */
.test-container {
  max-width: 900px;
  margin: auto;
  background: white;
  padding: 20px 25px;
  border-radius: 10px;
  box-shadow: 0 0 8px rgba(0,0,0,0.1);
}

.test-header {
  font-size: 26px;
  font-weight: 700;
  margin-bottom: 15px;
}

.test-controls {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.select {
  padding: 8px 12px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

#start-btn, #submit-btn, #retry-btn {
  padding: 10px 16px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
}

#start-btn { background: #d9c6ff; }
#submit-btn { background: #b9ffb4; display:none; }
#retry-btn { background: #ffe1b9; display:none; }

.question {
  padding: 15px;
  background: #fafafa;
  margin-bottom: 15px;
  border-radius: 8px;
  border: 1px solid #eee;
}

.choice-label {
  display: block;
  padding: 6px;
  border-radius: 6px;
  margin-bottom: 6px;
  border: 1px solid #ddd;
  cursor: pointer;
}

.correct { background: #d4ffd9 !important; }
.wrong   { background: #ffd9d9 !important; }

.timer-box {
  padding: 10px;
  background: #fff8d1;
  border-radius: 8px;
  margin-bottom: 15px;
  font-weight: 700;
  display: none;
}
</style>

</head>

<body>

<!-- Progress -->
<div id="progress">
  <div id="progress-bar"></div>
</div>

<!-- HEADER giống lesson.html -->
<header>
  <a href="/binh-blog/index.html" class="logo">Binh Blog</a>
  <button id="reading-toggle">📖 Reading Mode</button>
  <input id="search-box" placeholder="Tìm trong bài..." />
</header>

<div class="container">

  <!-- SIDEBAR -->
  <aside id="sidebar"></aside>

  <!-- MAIN CONTENT -->
  <main class="content-area">
    <h1 class="test-header">Grammar Test</h1>

    <div id="test-box" class="test-container">

      <div class="test-controls">
        <select id="group-select" class="select">
          <option value="">-- Chọn nhóm --</option>
          <option value="present">Present Tenses</option>
          <option value="past">Past Tenses</option>
          <option value="future">Future Tenses</option>
          <option value="conditionals">Conditionals</option>
          <option value="modal">Modal Verbs</option>
          <option value="verbs">Verb Forms</option>
          <option value="all-grammar">All Grammar</option>
        </select>

        <select id="num-select" class="select">
          <option value="10">10</option>
          <option value="20" selected>20</option>
          <option value="40">40</option>
          <option value="60">60</option>
          <option value="100">100</option>
        </select>

        <select id="mode-select" class="select">
          <option value="practice">Practice</option>
          <option value="exam">Exam Mode</option>
        </select>

        <button id="start-btn">Bắt đầu</button>
        <button id="submit-btn">Nộp bài</button>
        <button id="retry-btn">Làm lại</button>
      </div>

     <!-- TIMER HIỂN THỊ TẠI ĐÂY -->
      <div id="timer-box" class="timer-box" style="display:none;"></div>

      <div id="questions"></div>
      <div id="result"></div>

    </div>
  </main>

</div>

<!-- PART 2 — Sidebar loader, progress, reading mode -->
<style>
/* Sidebar / layout tweaks for test page */
.container { display: flex; gap: 22px; align-items: flex-start; padding: 20px; max-width: 1200px; margin: 0 auto; }
aside#sidebar { width: 260px; flex-shrink:0; position: sticky; top: 20px; }
.content-area { flex:1; min-width: 0; }
.module { border-bottom: 1px solid #eee; padding: 8px 0; }
.module-title { display:flex; justify-content:space-between; align-items:center; cursor:pointer; padding:6px 8px; }
.module-lessons { padding-left:8px; display:none; }
.module-open .module-lessons { display:block; }
.lesson-item { display:block; padding:6px 8px; color:#333; text-decoration:none; border-radius:6px; margin-bottom:6px; }
.lesson-item.active { background:#eef; font-weight:600; }

/* small responsive */
@media (max-width: 900px) {
  .container { flex-direction: column; padding: 12px; }
  aside#sidebar { width:100%; position:relative; top:0; order:2; }
  .content-area { order:1; }
}
</style>

<script>
/* -----------------------------
   Sidebar, Progress, Reading Mode
   (Paste this after HTML Part 1)
   ----------------------------- */

// Progress bar
window.addEventListener("scroll", () => {
  try {
    const pageHeight = document.documentElement.scrollHeight - window.innerHeight;
    const scrolled = pageHeight > 0 ? (window.scrollY / pageHeight) * 100 : 0;
    const bar = document.getElementById("progress-bar");
    if (bar) bar.style.width = scrolled + "%";
  } catch(e){ /* ignore */ }
});

// Reading Mode toggle (persist)
const readingBtn = document.getElementById("reading-toggle");
if (readingBtn) {
  if (localStorage.getItem("readingMode") === "on") {
    document.body.classList.add("reading-mode");
    readingBtn.textContent = "🔙 Thoát Reading Mode";
  } else {
    readingBtn.textContent = "📖 Reading Mode";
  }
  readingBtn.addEventListener("click", () => {
    document.body.classList.toggle("reading-mode");
    if (document.body.classList.contains("reading-mode")) {
      readingBtn.textContent = "🔙 Thoát Reading Mode";
      localStorage.setItem("readingMode","on");
    } else {
      readingBtn.textContent = "📖 Reading Mode";
      localStorage.setItem("readingMode","off");
    }
  });
}

/* ===============================
   BUILD SIDEBAR (Module groups)
   Same logic as lesson; uses grammar/grammar.json
================================= */
async function loadSidebarForTest() {
  try {
    const res = await fetch("/binh-blog/grammar/grammar.json");
    if (!res.ok) throw new Error("Cannot load grammar.json");
    const list = await res.json();

    const sidebar = document.getElementById("sidebar");
    if (!sidebar) return;

    sidebar.innerHTML = "<h3 style='margin:8px 0'>📘 Bài học</h3>";

    const modules = {
      "Tenses": list.slice(0, 13),
      "Modal Verbs": list.slice(13, 17),
      "Passive Voice": list.slice(17, 22),
      "Conditionals": list.slice(22, 26),
      "Verb Forms": list.slice(26, 35),
      "Advanced Grammar": list.slice(35, 40)
    };

    for (const moduleName in modules) {
      const lessons = modules[moduleName];
      const moduleDiv = document.createElement("div");
      moduleDiv.className = "module";

      moduleDiv.innerHTML = `
        <div class="module-title">
          <span>${moduleName}</span>
          <span>▾</span>
        </div>
        <div class="module-lessons"></div>
      `;
      const listDiv = moduleDiv.querySelector(".module-lessons");

      lessons.forEach(item => {
        const a = document.createElement("a");
        a.className = "lesson-item";
        a.href = `/binh-blog/lesson.html?file=${item.file}`;
        a.innerText = item.title;
        listDiv.appendChild(a);
      });

      // auto open if current lesson inside (not necessary here)
      moduleDiv.querySelector(".module-title").onclick = () => {
        moduleDiv.classList.toggle("module-open");
      };

      sidebar.appendChild(moduleDiv);
    }

    // ---- Add Grammar Tests module at the end ----
    const testsModule = document.createElement('div');
    testsModule.className = "module module-tests";
    testsModule.innerHTML = `
      <div class="module-title"><span>📝 Grammar Tests</span><span>▾</span></div>
      <div class="module-lessons">
        <a class="lesson-item" href="/binh-blog/grammar/test.html?group=present">Present Tenses Test</a>
        <a class="lesson-item" href="/binh-blog/grammar/test.html?group=past">Past Tenses Test</a>
        <a class="lesson-item" href="/binh-blog/grammar/test.html?group=future">Future Tenses Test</a>
        <a class="lesson-item" href="/binh-blog/grammar/test.html?group=conditionals">Conditionals Test</a>
        <a class="lesson-item" href="/binh-blog/grammar/test.html?group=modal">Modal Verbs Test</a>
        <a class="lesson-item" href="/binh-blog/grammar/test.html?group=verbs">Verb Forms Test</a>
        <a class="lesson-item" href="/binh-blog/grammar/test.html?group=all-grammar">All Grammar Exam</a>
      </div>
    `;
    testsModule.querySelector(".module-title").onclick = () => testsModule.classList.toggle("module-open");
    sidebar.appendChild(testsModule);

  } catch (e) {
    console.error("Sidebar load error:", e);
    const sidebar = document.getElementById("sidebar");
    if (sidebar) sidebar.innerHTML = "<div class='hint'>Không tải được sidebar.</div>";
  }
}

/* initialize sidebar */
document.addEventListener("DOMContentLoaded", () => {
  loadSidebarForTest();
});
</script>

<script>
/* -------------------------------------------------
   PART 3 — FULL TEST ENGINE
   ------------------------------------------------- */

let allQuestions = [];
let examMode = false;
let timerInterval = null;

/* Elements */
const groupSelect = document.getElementById("group-select");
const numSelect   = document.getElementById("num-select");
const modeSelect  = document.getElementById("mode-select");
const startBtn    = document.getElementById("start-btn");
const submitBtn   = document.getElementById("submit-btn");
const retryBtn    = document.getElementById("retry-btn");
const questionsDiv= document.getElementById("questions");
const resultDiv   = document.getElementById("result");
const timerDiv    = document.getElementById("timer");

/* -------------------------------------------------
   Fetch nhóm (test-groups.json)
------------------------------------------------- */
async function buildTestForGroup(group, limit) {
  const res = await fetch("/binh-blog/grammar/quiz/test-groups.json");
  if (!res.ok) throw new Error("Không tải được test-groups.json");
  const groups = await res.json();

  if (!groups[group]) throw new Error("Nhóm không tồn tại: " + group);
  
  let pool = [];

  for (const slug of groups[group]) {
    const url = `/binh-blog/grammar/quiz/${slug}.json`;
    const r = await fetch(url);
    if (!r.ok) continue;
    const data = await r.json();
    data.questions.forEach((q, i) => {
      pool.push({
        slug,
        idx: i,
        question: q.question,
        choices: q.choices,
        answer: q.answer,
        explanation: q.explanation
      });
    });
  }

  // RANDOM
  pool = pool.sort(() => Math.random() - 0.5);

  // CẮT SỐ LƯỢNG
  return pool.slice(0, limit);
}

/* -------------------------------------------------
   RENDER QUESTIONS
------------------------------------------------- */
function renderTest() {
  questionsDiv.innerHTML = "";
  resultDiv.innerHTML = "";
  submitBtn.style.display = "inline-block";
  retryBtn.style.display  = "none";

  allQuestions.forEach((q, index) => {
    const div = document.createElement("div");
    div.className = "question";
    div.dataset.qindex = index;

    const htmlChoices = q.choices.map((c, ci) => `
      <label class="choice-label">
        <input type="radio" name="q${index}" value="${ci}">
        ${String.fromCharCode(65+ci)}. ${c}
      </label>
    `).join("");

    div.innerHTML = `
      <div class="q-title"><b>${index+1}. ${q.question}</b></div>
      <div class="q-choices">${htmlChoices}</div>
      <div class="q-exp" style="display:none; margin-top:8px;
           background:#f7f7f7; padding:10px; border-radius:6px;">
        <b>Giải thích:</b> ${q.explanation}
      </div>
    `;
    questionsDiv.appendChild(div);
  });
}

/* -------------------------------------------------
   START TEST
------------------------------------------------- */
startBtn.addEventListener("click", async () => {
  const group = groupSelect.value;
  if (!group) { alert("Chọn nhóm trước."); return; }

  // Bộ quy tắc mới của bạn:
  // → Nhóm thường mặc định 20 câu
  // → all-grammar mặc định 60 câu
  if (group === "all-grammar") numSelect.value = "60";
  else numSelect.value = "20";

  const num  = parseInt(numSelect.value,10) || 20;
  const mode = modeSelect.value;

  examMode = (mode === "exam");

  try {
    allQuestions = await buildTestForGroup(group, num);
    renderTest();

    // Exam Mode = bật đồng hồ, 1 câu = 1 phút
    if (examMode) {
      startTimer(num * 60);
    } else {
      timerDiv.style.display = "none";
    }

  } catch (err) {
    alert("Lỗi: " + err.message);
    console.error(err);
  }
});

/* -------------------------------------------------
   TIMER (Exam Mode)
------------------------------------------------- */
function startTimer(seconds) {
  clearInterval(timerInterval);
  timerDiv.style.display = "block";

  function update() {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    timerDiv.textContent = `⏳ Thời gian: ${m}m ${s}s`;

    if (seconds <= 0) {
      clearInterval(timerInterval);
      lockAllInputs();
      submitBtn.click();
      return;
    }
    seconds--;
  }

  update();
  timerInterval = setInterval(update, 1000);
}

/* Khóa input khi hết giờ */
function lockAllInputs() {
  document.querySelectorAll("input[type=radio]")
    .forEach(i => i.disabled = true);
}

/* -------------------------------------------------
   SUBMIT TEST
------------------------------------------------- */
submitBtn.addEventListener("click", () => {
  clearInterval(timerInterval);

  let correct = 0;

  allQuestions.forEach((q, index) => {
    const qDiv = document.querySelector(`[data-qindex="${index}"]`);
    const radios = qDiv.querySelectorAll("input[type=radio]");
    const expDiv = qDiv.querySelector(".q-exp");

    let selected = -1;
    radios.forEach(r => { if (r.checked) selected = parseInt(r.value); });

    // Highlight
    const labels = qDiv.querySelectorAll(".choice-label");
    labels.forEach(l => l.classList.remove("correct","wrong"));

    if (selected === q.answer) {
      correct++;
      labels[q.answer].classList.add("correct");
    } else {
      labels[q.answer].classList.add("correct");
      if (selected >= 0) labels[selected].classList.add("wrong");
    }

    expDiv.style.display = "block";
  });

  // RESULT
  const total = allQuestions.length;
  const score = Math.round((correct / total) * 100);

  resultDiv.innerHTML = `
    <h3>Kết quả</h3>
    <p><b>${correct}/${total}</b> câu đúng — <b>${score}%</b></p>
  `;

  submitBtn.style.display = "none";
  retryBtn.style.display  = "inline-block";

  // Save localStorage
  try {
    const group = groupSelect.value;
    localStorage.setItem(
      "test-score-" + group,
      JSON.stringify({ correct, total, score, time: Date.now() })
    );
  } catch(e){}
});

/* -------------------------------------------------
   RETRY
------------------------------------------------- */
retryBtn.addEventListener("click", () => {
  const group = groupSelect.value;
  if (!group) return;
  startBtn.click();
});

/* -------------------------------------------------
   AUTO START FROM URL
   /test.html?group=present&num=40&mode=exam
------------------------------------------------- */
function autoStartFromURL() {
  const params = new URLSearchParams(window.location.search);
  const g = params.get("group");
  const n = params.get("num");
  const m = params.get("mode");

  if (!g) return;

  // Set nhóm
  groupSelect.value = g;

  // Số câu
  if (n) numSelect.value = n;
  else {
    if (g === "all-grammar") numSelect.value = "60";
    else numSelect.value = "20";
  }

  // Chế độ
  if (m) modeSelect.value = m;

  // Tự động bắt đầu
  startBtn.click();
}

setTimeout(autoStartFromURL, 500);

/* ===============================
   EXAM MODE TIMER + AUTO SUBMIT
================================= */
let timer = null;
let timeLeft = 0;

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${m}:${s.toString().padStart(2,"0")}`;
}

function startExamTimer() {
  const numEl = document.getElementById("num-select");       // match HTML
  const display = document.getElementById("timer-box");     // match HTML

  if (!numEl) { console.error("Không tìm thấy #num-select"); alert("Lỗi: thiếu element num-select"); return; }
  if (!display) { console.error("Không tìm thấy #timer-box"); alert("Lỗi: thiếu element timer-box"); return; }

  const count = parseInt(numEl.value, 10) || 20;
  timeLeft = count * 60; // 1 câu = 60s

  display.style.display = "inline-block";
  display.innerText = formatTime(timeLeft);

  if (timer) clearInterval(timer);
  timer = setInterval(() => {
    timeLeft--;
    display.innerText = formatTime(timeLeft);

    if (timeLeft <= 0) {
      clearInterval(timer);
      timer = null;
      autoSubmitExam();
    }
  }, 1000);
}

function autoSubmitExam() {
  // Khóa toàn bộ đáp án
  document.querySelectorAll("input[type=radio]").forEach(r => r.disabled = true);

  // Tự động thu bài
  submitTest(true);
}

 // Hiển thị điểm
  const scoreBox = document.getElementById("score-box");
  scoreBox.innerHTML = `Điểm: <b>${correct}/${items.length}</b>`;
  scoreBox.style.display = "block";

  // Lưu localStorage
  const saveKey = "test-score-" + currentGroup;
  localStorage.setItem(saveKey, JSON.stringify({
    score: correct,
    total: items.length,
    time: new Date().toISOString()
  }));

  if (auto) {
    alert("Hết giờ! Hệ thống đã tự động nộp bài.");
  }
}  

/* ===============================
   BẮT ĐẦU BÀI / NỘP BÀI (sửa: chờ DOM)
================================= */
document.addEventListener("DOMContentLoaded", () => {

  const startBtn = document.getElementById("start-btn");
  const submitBtn = document.getElementById("submit-btn");
  const retryBtn = document.getElementById("retry-btn");

  const groupEl = document.getElementById("group-select");
  const numEl = document.getElementById("num-select");
  const modeEl = document.getElementById("mode-select");

  if (!startBtn) {
    console.error("Không tìm thấy nút Start – kiểm tra lại HTML.");
    return;
  }

  // BẮT ĐẦU
  startBtn.addEventListener("click", () => {

    const group = groupEl.value;
    const count = parseInt(numEl.value);
    const mode = modeEl.value;

    if (!group) {
      alert("Bạn phải chọn nhóm bài test!");
      return;
    }

    if (typeof renderQuestions === "function") {
      renderQuestions(group, count);
    }

    if (mode === "exam") {
      startExamTimer();
    } else {
      document.getElementById("timer-box").style.display = "none";
    }

    submitBtn.style.display = "inline-block";
    retryBtn.style.display = "none";
  });

  // NỘP BÀI
  submitBtn.addEventListener("click", () => {
    submitTest(false);
    retryBtn.style.display = "inline-block";
  });

  // LÀM LẠI
  retryBtn.addEventListener("click", () => {
    location.reload();
  });
});  
</script>
</body>
</html>
