<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài viết • Binh Blog</title>

  <link rel="stylesheet" href="../assets/style.css">

  <style>
    .answer-text {
        display: none;
        background: #f6f0ff;
        padding: 10px;
        margin: 5px 0 15px 0;
        border-left: 4px solid #a67cff;
        border-radius: 6px;
    }
    #toggle-answer {
        background: #d8c7ff;
        padding: 10px 16px;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        margin: 10px 0;
    }
  </style>
</head>

<body>

  <div id="post-container">
    <div id="post-content"></div>
  </div>

<script>
// =========================================
// 1) LOAD NỘI DUNG FILE BÀI HỌC
// =========================================
async function loadPost() {
    const urlParams = new URLSearchParams(window.location.search);
    const file = urlParams.get("file");

    if (!file) {
        document.getElementById("post-content").innerHTML = "<p>Không tìm thấy bài viết.</p>";
        return;
    }

    try {
        let response = await fetch("./" + file);
        let html = await response.text();
        document.getElementById("post-content").innerHTML = html;

        autoFixAnswers(); // chuẩn hóa phần câu trả lời
    } catch (err) {
        document.getElementById("post-content").innerHTML = "<p>Lỗi tải bài viết.</p>";
        console.error(err);
    }
}

loadPost();


// =========================================
// 2) AUTO FIX PHẦN ĐÁP ÁN – CHUẨN HOÁ 100%
// =========================================

function autoFixAnswers() {

    const content = document.getElementById("post-content");
    if (!content) return;

    // tìm tiêu đề mục đáp án
    const answerHeader = [...content.querySelectorAll("h2, h3, h4")]
        .find(h => h.textContent.toLowerCase().includes("đáp án"));

    if (!answerHeader) return;  // không có phần đáp án → bỏ qua

    // tạo exercise-box nếu chưa có
    let box = content.querySelector("#exercise-box");
    if (!box) {
        box = document.createElement("div");
        box.id = "exercise-box";
        answerHeader.insertAdjacentElement("afterend", box);
    }

    // gom toàn bộ phần tử từ sau header cho đến header kế tiếp
    let cur = answerHeader.nextElementSibling;
    let collected = [];

    while (cur && !["H2","H3","H4"].includes(cur.tagName)) {
        collected.push(cur);
        cur = cur.nextElementSibling;
    }

    // đưa vào box
    collected.forEach(el => box.appendChild(el));

    // chuẩn hóa từng câu trả lời
    const paras = box.querySelectorAll("p");

    paras.forEach(p => {
        // nếu chưa có answer-text ngay sau → tạo mới
        if (!p.nextElementSibling || !p.nextElementSibling.classList.contains("answer-text")) {

            const hasAnswerInside = p.innerHTML.toLowerCase().includes("đáp án:");
            if (!hasAnswerInside) return;

            let ans = document.createElement("p");
            ans.className = "answer-text";
            ans.innerHTML = p.innerHTML;  // lấy toàn bộ nội dung
            p.insertAdjacentElement("afterend", ans);

            // xoá đáp án gốc trong câu hỏi
            p.innerHTML = p.innerHTML.split("Đáp án:")[0].trim();
        }
    });

    // tạo nút toggle nếu chưa có
    if (!content.querySelector("#toggle-answer")) {
        let btn = document.createElement("button");
        btn.id = "toggle-answer";
        btn.textContent = "👉 Hiện đáp án";
        answerHeader.insertAdjacentElement("afterend", btn);
    }
}


// =========================================
// 3) NÚT ẨN / HIỆN ĐÁP ÁN
// =========================================

document.addEventListener("click", e => {
    if (e.target.id !== "toggle-answer") return;

    const answers = document.querySelectorAll(".answer-text");
    if (!answers.length) return;

    const showing = answers[0].style.display === "block";

    answers.forEach(a => {
        a.style.display = showing ? "none" : "block";
    });

    e.target.textContent = showing ? "👉 Hiện đáp án" : "🔒 Ẩn đáp án";
});
</script>

</body>
</html>
