<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>%%PAGE_TITLE%% — Binh Blog</title>
  <style>
    /* --- Tối giản CSS cho giao diện bài học (dùng chung) --- */
    body{font-family:Inter, system-ui, Arial, sans-serif; margin:0; padding:24px; background:#fff;}
    .container{max-width:980px; margin:0 auto; padding:0 20px;}
    header{display:flex; align-items:center; gap:12px; margin-bottom:18px;}
    h1{font-size:28px; margin:6px 0;}
    .meta{color:#666; font-size:14px; margin-bottom:18px;}
    .grid{display:flex; gap:24px;}
    .left{width:260px;}
    .card{background:#faf5ff;border-radius:10px;padding:18px;box-shadow:0 6px 20px rgba(120,80,200,0.08);}
    .content{flex:1;}
    .section-title{display:flex; align-items:center; gap:12px; margin-top:22px; margin-bottom:12px;}
    .exercise-box{margin-top:12px;}
    button#toggle-answer{background:#e8dfff;border:1px solid #d7c7ff;padding:8px 12px;border-radius:8px; cursor:pointer;}
    .answer-text{display:none; margin:6px 0 18px; padding:10px 12px; background:#f7fff5; border-left:4px solid #7bd389;}
    .answer-text.show{display:block;}
    p.question{margin:12px 0; color:#222;}
    .quiz-button{display:inline-block;margin-top:14px;padding:10px 14px;background:#ead8ff;border-radius:10px;color:#4b2fb3;text-decoration:none;font-weight:700;}
    .related{background:#faf5ff;border-radius:10px;padding:12px;margin-top:18px;}
    footer{margin-top:40px; text-align:center; color:#999; font-size:13px;}
    /* small responsive */
    @media (max-width:880px){.grid{flex-direction:column}.left{width:100%}}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div style="width:56px;height:56px;background:#e9e7ff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#4b2fb3">BB</div>
      <div>
        <h1>%%PAGE_TITLE%%</h1>
        <div class="meta">📅 %%DATE%% • Category: %%CATEGORY%%</div>
      </div>
    </header>

    <div class="grid">
      <aside class="left">
        <div class="card">
          <div style="width:72px;height:72px;background:#fff;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;color:#4b2fb3;font-weight:700">🙂</div>
          <div style="text-align:center;font-weight:700">Xin chào, mình là Bình 👋</div>
          <div style="color:#666;margin-top:8px;font-size:14px">Chia sẻ tiếng Anh, lập trình và cuộc sống mỗi ngày.</div>
        </div>
      </aside>

      <main class="content">
        <!-- CONTENT START -->
        <article class="card" style="padding:22px;">
          <h2 style="margin-top:0">Giới thiệu</h2>
          <p style="color:#333;line-height:1.6">
            %%INTRO%%
          </p>

          <h3 class="section-title"><span style="width:6px;height:28px;background:#7b61ff;display:inline-block;border-radius:2px"></span> 4. Bài tập – Chọn đáp án đúng</h3>

          <!-- BUTTON: Toggle answers -->
          <div>
            <button id="toggle-answer">👉 Hiện đáp án</button>
          </div>

          <!-- EXERCISES MUST BE INSIDE #exercise-box -->
          <div id="exercise-box" class="exercise-box">
            <!-- Each question: <p class="question">...</p>
                 Then a <p class="answer-text" data-q="1">Đáp án: ...</p> (display:none) -->
            %%EXERCISES%%

          </div>

          <a class="quiz-button" href="%%QUIZ_LINK%%">👉 Làm bài tập: %%QUIZ_TITLE%%</a>

          <div class="related">
            <strong>Bài viết liên quan</strong>
            <ul style="margin:10px 0 0;padding-left:18px;color:#4b2fb3">
              %%RELATED_LINKS%%
            </ul>
          </div>
        </article>
        <!-- CONTENT END -->

      </main>
    </div>

    <footer>©2025 — Binh Blog</footer>
  </div>

  <!-- COMMON JS: toggle answers (works for any page using the template above) -->
  <script>
    (function(){
      const btn = document.getElementById('toggle-answer');
      if(!btn) return;
      // Find all answer elements inside #exercise-box
      const exerciseBox = document.getElementById('exercise-box');
      if(!exerciseBox) {
        console.warn('Không tìm thấy #exercise-box');
        return;
      }

      const answers = exerciseBox.querySelectorAll('.answer-text');

      function areAnswersHidden(){
        if(answers.length===0) return true;
        return Array.from(answers).every(a => window.getComputedStyle(a).display==='none' || !a.classList.contains('show'));
      }

      btn.addEventListener('click', function(){
        if(answers.length===0){
          // show friendly warning (console + small alert)
          console.warn('Không tìm thấy phần tử .answer-text để hiển/ẩn đáp án.');
          alert('Chưa có phần đáp án (class="answer-text") — kiểm tra file bài.'); 
          return;
        }
        const show = areAnswersHidden();
        answers.forEach(a=>{
          if(show){
            a.classList.add('show');
          } else {
            a.classList.remove('show');
          }
        });
        btn.textContent = show ? '🙈 Ẩn đáp án' : '👉 Hiện đáp án';
      });
    })();
  </script>
</body>
</html>
