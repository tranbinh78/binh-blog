<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grammar Index | Binh Blog</title>

  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: "Be Vietnam Pro", sans-serif;
      background: #faf9ff;
      margin: 0;
      padding: 0;
      transition: 0.3s;
      opacity: 0;
      animation: fadeIn 0.8s ease forwards;
    }
    @keyframes fadeIn { to { opacity: 1; } }

    body.dark {
      background: #17151f;
      color: #eee;
    }

    .container {
      max-width: 1100px;
      margin: 40px auto 80px;
      padding: 20px;
    }

    h1 {
      font-size: 34px;
      text-align: center;
      margin-bottom: 10px;
      color: #2a235a;
      font-weight: 800;
    }
    body.dark h1 { color: #d6ccff; }

    .subtitle {
      text-align: center;
      color: #555;
      margin-bottom: 30px;
    }
    body.dark .subtitle { color: #bbb; }

    /* Dark mode */
    .toggle-box { text-align: right; margin-bottom: 10px; }
    .toggle-btn {
      background: #dcd2ff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    body.dark .toggle-btn { background: #3b335f; color: #eee; }

    /* Roadmap */
    .roadmap-title {
      text-align: center;
      font-size: 22px;
      margin-bottom: 20px;
      margin-top: 10px;
      color: #4635d4;
    }
    body.dark .roadmap-title { color: #cfc4ff; }

    .roadmap {
      display: flex;
      flex-direction: column;
      gap: 25px;
      margin-bottom: 40px;
    }
    .roadmap-row {
      display: flex;
      justify-content: center;
      gap: 20px;
    }
    .roadmap-item {
      padding: 12px 16px;
      border-radius: 12px;
      background: #fff;
      border: 2px solid #b7a6ff;
      min-width: 170px;
      text-align: center;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }
    .roadmap-item:hover {
      background: #f1ebff;
      transform: translateY(-3px);
      box-shadow: 0 4px 10px rgba(100,80,255,0.2);
    }
    body.dark .roadmap-item { background: #2a2536; color: #cabdff; }

    .roadmap-item.completed { background:#e6f9ee; border-color:#0f7738; color:#0f7738; }
    .roadmap-item.soon { background:#efefef; }
    .roadmap-item.learned { box-shadow: 0 0 12px rgba(255,210,75,0.8); }

    /* Filters */
    .filters {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 30px;
    }
    .filter-btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid #b6a5ff;
      background: white;
      cursor: pointer;
      font-weight: 600;
    }
    .filter-btn.active {
      background: #c7b6ff;
      border-color: #6f54ff;
    }

    /* Search */
    #search-box {
      width: 100%;
      padding: 14px;
      margin-bottom: 35px;
      border: 2px solid #b9aaff;
      border-radius: 10px;
      font-size: 18px;
    }

    /* Cards */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: 0.25s;
    }
    .card:hover { transform: translateY(-4px); }
    body.dark .card { background: #2a2636; }

    .card-icon { font-size: 36px; }
    .card-title { font-size: 20px; font-weight: 700; }

    .status { font-size: 14px; font-weight: 600; }

    .learned-tag {
      background:#fff8d1;
      color:#b08500;
      padding:4px 10px;
      border-radius:8px;
      font-size:14px;
      width: fit-content;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="toggle-box">
    <button id="darkToggle" class="toggle-btn">🌙 Dark Mode</button>
  </div>

  <h1>📘 Grammar Index</h1>
  <h2 class="roadmap-title">🗺️ Lộ Trình Học 12 Thì Tiếng Anh</h2>

  <div class="roadmap">
    <div class="roadmap-row">
      <div class="roadmap-item" data-file="present-simple.html">Present Simple</div>
      <div class="roadmap-item" data-file="present-continuous.html">Present Continuous</div>
      <div class="roadmap-item" data-file="present-perfect.html">Present Perfect</div>
      <div class="roadmap-item" data-file="present-perfect-continuous.html">P. Perfect Continuous</div>
    </div>

    <div class="roadmap-row">
      <div class="roadmap-item" data-file="past-simple.html">Past Simple</div>
      <div class="roadmap-item" data-file="past-continuous.html">Past Continuous</div>
      <div class="roadmap-item" data-file="past-perfect.html">Past Perfect</div>
      <div class="roadmap-item" data-file="used-to.html">Used to / Be used to / Get used to</div>
    </div>

    <div class="roadmap-row">
      <div class="roadmap-item" data-file="future-simple.html">Future Simple</div>
      <div class="roadmap-item" data-file="future-continuous.html">Future Continuous</div>
      <div class="roadmap-item" data-file="near-future.html">Near Future</div>
      <div class="roadmap-item" data-file="will-vs-going-to.html">Will-vs-Going-to</div>
    </div>
  </div>

  <p id="progress-text" class="subtitle">Đang tải tiến độ…</p>

  <div id="progress-bar" style="width:100%;height:16px;background:#e9e4ff;border-radius:10px;">
    <div id="progress-fill" style="height:100%;width:0%;background:#7b61ff;transition:0.4s;"></div>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="present">Present</button>
    <button class="filter-btn" data-filter="past">Past</button>
    <button class="filter-btn" data-filter="future">Future</button>

    <button class="filter-btn active" data-status="all">All</button>
    <button class="filter-btn" data-status="completed">Completed</button>
    <button class="filter-btn" data-status="soon">Coming Soon</button>

    <button class="filter-btn" data-learn="learned">Đã học</button>
    <button class="filter-btn" data-learn="notlearned">Chưa học</button>
  </div>

  <input type="text" id="search-box" placeholder="🔍 Tìm kiếm...">

  <div id="card-container" class="card-grid"></div>

</div>

<script>
document.addEventListener("DOMContentLoaded", async () => {

  /* LOAD POSTS */
  const res = await fetch("posts/posts.json");
  let posts = await res.json();
  posts = posts.filter(p => p.category === "Tiếng Anh");

  const container = document.getElementById("card-container");

  posts.forEach(post => {
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.file = post.file;

    if (post.file.startsWith("present-")) card.dataset.group = "present";
    else if (post.file.startsWith("past-")) card.dataset.group = "past";
    else card.dataset.group = "future";

    card.innerHTML = `
      <div class="card-icon">📘</div>
      <div class="card-title">${post.title}</div>
      <div class="status">Loading...</div>
      <a class="btn-view">Xem bài</a>
    `;

    fetch(`posts/${post.file}`).then(r => {
      const status = card.querySelector(".status");
      const btn = card.querySelector(".btn-view");

      if (r.ok) {
        card.dataset.status = "completed";
        status.textContent = "✔ Completed";
        btn.href = `post.html?file=${post.file}`;
      } else {
        card.dataset.status = "soon";
        status.textContent = "⏳ Coming soon";
        btn.remove();
      }
    });

    container.appendChild(card);
  });

  /* FILTER SYSTEM */
  const filterBtns = document.querySelectorAll(".filter-btn");
  const searchBox = document.getElementById("search-box");

  function applyFilters() {
    const groupFilter = document.querySelector(".filter-btn[data-filter].active").dataset.filter;
    const statusFilter = document.querySelector(".filter-btn[data-status].active").dataset.status;

    const cards = document.querySelectorAll(".card");
    const searchValue = searchBox.value.toLowerCase();

    cards.forEach(card => {
      const matchGroup = (groupFilter === "all" || card.dataset.group === groupFilter);
      const matchStatus = (statusFilter === "all" || card.dataset.status === statusFilter);
      const matchSearch = card.textContent.toLowerCase().includes(searchValue);

      card.style.display = (matchGroup && matchStatus && matchSearch) ? "flex" : "none";
    });
  }

  filterBtns.forEach(btn => {
    btn.addEventListener("click", () => {
      if (btn.dataset.filter) {
        document.querySelectorAll('.filter-btn[data-filter]')
          .forEach(b => b.classList.remove("active"));
      }
      if (btn.dataset.status) {
        document.querySelectorAll('.filter-btn[data-status]')
          .forEach(b => b.classList.remove("active"));
      }
      if (btn.dataset.learn) {
        document.querySelectorAll('.filter-btn[data-learn]')
          .forEach(b => b.classList.remove("active"));
      }

      btn.classList.add("active");
      applyFilters();
    });
  });

  searchBox.addEventListener("input", applyFilters);

  /* DARK MODE */
  const darkToggle = document.getElementById("darkToggle");
  if (localStorage.getItem("darkmode") === "true") {
    document.body.classList.add("dark");
    darkToggle.textContent = "🌞 Light Mode";
  }

  darkToggle.addEventListener("click", () => {
    document.body.classList.toggle("dark");
    const isDark = document.body.classList.contains("dark");
    localStorage.setItem("darkmode", isDark);
    darkToggle.textContent = isDark ? "🌞 Light Mode" : "🌙 Dark Mode";
  });

});
</script>

</body>
</html>
