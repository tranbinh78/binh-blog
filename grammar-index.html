<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grammar Index | Binh Blog</title>

  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: "Be Vietnam Pro", sans-serif;
      background: #faf9ff;
      margin: 0;
      padding: 0;
      transition: 0.3s;
    }

    /* DARK MODE */
    body.dark {
      background: #17151f;
      color: #eee;
    }

    .container {
      max-width: 1000px;
      margin: 40px auto 80px;
      padding: 20px;
    }

    h1 {
      font-size: 34px;
      text-align: center;
      margin-bottom: 10px;
      color: #2a235a;
      font-weight: 800;
      transition: 0.3s;
    }

    body.dark h1 {
      color: #d6ccff;
    }

    .subtitle {
      text-align: center;
      color: #555;
      margin-bottom: 40px;
      transition: 0.3s;
    }

    body.dark .subtitle {
      color: #bbb;
    }

    /* Dark Mode Toggle */
    .toggle-box {
      text-align: right;
      margin-bottom: 15px;
    }
    .toggle-btn {
      background: #dcd2ff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }
    .toggle-btn:hover { background: #c4b5ff; }
    body.dark .toggle-btn { background: #3b335f; color: #eee; }

    /* Group Title */
    .group-title {
      font-size: 26px;
      margin-top: 40px;
      margin-bottom: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: 0.3s;
    }

    body.dark .group-title {
      color: #decfff;
    }

    .group-icon { font-size: 30px; }

    /* Card List */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    /* CARD */
    .card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      transition: 0.25s;
      border-left: 6px solid transparent;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    }

    body.dark .card {
      background: #2a2636;
      box-shadow: none;
    }

    .card-icon {
      font-size: 36px;
    }

    .card-title {
      font-size: 20px;
      font-weight: 700;
    }

    .status {
      font-size: 15px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      display: inline-block;
    }

    /* Completed */
    .completed {
      background: #e6f9ee;
      color: #0b7a3d;
      border-left-color: #0fa34a !important;
    }

    body.dark .completed {
      background: #203427;
      color: #46f996;
    }

    /* Coming Soon */
    .soon {
      background: #f3f3f3;
      color: #777;
    }

    body.dark .soon {
      background: #2e2e2e;
      color: #aaa;
    }

    .btn-view {
      margin-top: auto;
      padding: 8px 14px;
      background: #dcd2ff;
      border-radius: 8px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      color: #333;
      transition: 0.3s;
    }

    .btn-view:hover { background: #c4b5ff; }
    body.dark .btn-view { background: #3b335f; color: #eee; }

  </style>
</head>

<body>

<div class="container">

  <!-- DARK MODE BUTTON -->
  <div class="toggle-box">
    <button class="toggle-btn" id="darkToggle">🌙 Dark Mode</button>
  </div>

  <h1>📘 Grammar Index</h1>
  <p class="subtitle">Danh sách toàn bộ các thì – tự động cập nhật từ posts.json</p>

  <!-- PRESENT GROUP -->
  <div class="group-title"><span class="group-icon">⏳</span> Thì Hiện Tại (Present Tenses)</div>
  <div id="present" class="card-grid"></div>

  <!-- PAST GROUP -->
  <div class="group-title"><span class="group-icon">⏱️</span> Thì Quá Khứ (Past Tenses)</div>
  <div id="past" class="card-grid"></div>

  <!-- FUTURE GROUP -->
  <div class="group-title"><span class="group-icon">⏭️</span> Thì Tương Lai (Future Tenses)</div>
  <div id="future" class="card-grid"></div>

</div>

<!-- ⭐ AUTO LOAD POSTS + DARK MODE -->
<script>
document.addEventListener("DOMContentLoaded", async () => {

  // LOAD POSTS.JSON
  const res = await fetch("posts/posts.json");
  let posts = await res.json();

  posts = posts.filter(p => p.category === "Tiếng Anh");

  const groups = {
    present: document.getElementById("present"),
    past: document.getElementById("past"),
    future: document.getElementById("future"),
  };

  // RENDER CARD
  posts.forEach(post => {
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.file = post.file;

    // ICON AUTO BY GROUP
    let icon = "📘";
    if (post.file.startsWith("past-")) icon = "📙";
    if (post.file.startsWith("future-") || post.file.startsWith("near-future")) icon = "📗";

    card.innerHTML = `
      <div class="card-icon">${icon}</div>
      <div class="card-title">${post.title}</div>
      <div class="status">Đang kiểm tra...</div>
      <a class="btn-view">Xem bài</a>
    `;

    // CHECK IF FILE EXISTS
    fetch(`posts/${post.file}`)
      .then(r => {
        const status = card.querySelector(".status");
        const btn = card.querySelector(".btn-view");
        if (r.ok) {
          card.classList.add("completed");
          status.textContent = "✔ Completed";
          btn.href = `post.html?file=${post.file}`;
        } else {
          card.classList.add("soon");
          status.textContent = "⏳ Coming soon";
          btn.remove();
        }
      });

    // GROUP ASSIGN
    if (post.file.startsWith("present-")) groups.present.appendChild(card);
    else if (post.file.startsWith("past-")) groups.past.appendChild(card);
    else if (post.file.startsWith("future-") || post.file.startsWith("near-future")) groups.future.appendChild(card);

  });

  // DARK MODE
  const toggle = document.getElementById("darkToggle");

  if (localStorage.getItem("darkmode") === "true") {
    document.body.classList.add("dark");
    toggle.textContent = "🌞 Light Mode";
  }

  toggle.addEventListener("click", () => {
    document.body.classList.toggle("dark");
    const isDark = document.body.classList.contains("dark");
    localStorage.setItem("darkmode", isDark);
    toggle.textContent = isDark ? "🌞 Light Mode" : "🌙 Dark Mode";
  });

});
</script>

</body>
</html>
