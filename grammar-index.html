<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grammar Index | Binh Blog</title>

  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: "Be Vietnam Pro", sans-serif;
      background: #faf9ff;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 950px;
      margin: 40px auto 80px;
      padding: 20px;
    }

    h1 {
      font-size: 34px;
      text-align: center;
      margin-bottom: 10px;
      color: #2a235a;
      font-weight: 800;
    }

    .subtitle {
      text-align: center;
      color: #555;
      margin-bottom: 40px;
    }

    .group-title {
      font-size: 26px;
      margin-top: 40px;
      margin-bottom: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon { font-size: 30px; }

    .list-box {
      background: #f2edff;
      padding: 20px 28px;
      border-radius: 14px;
      border-left: 6px solid #9378ff;
      margin-bottom: 30px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    }

    .grammar-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
      padding: 10px 14px;
      font-size: 18px;
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
      transition: 0.25s;
      color: #4734d3;
    }

    .grammar-item:hover {
      background: #ece6ff;
      transform: translateX(4px);
    }

    /* ✔ Completed */
    .completed {
      color: #087a3d !important;
      background: #e6f9ee;
      border-left: 4px solid #0fa34a;
    }

    /* ⏳ Coming soon */
    .soon {
      color: #777 !important;
      background: #f3f3f3;
      border-left: 4px solid #aaa;
      font-style: italic;
    }

    #present, #past, #future {
      min-height: 50px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📘 Grammar Index</h1>
  <p class="subtitle">Danh sách toàn bộ các thì – tự động cập nhật theo posts.json</p>

  <!-- GROUPS -->
  <div class="group-title"><span class="icon">⏳</span> Thì Hiện Tại (Present Tenses)</div>
  <div class="list-box" id="present"></div>

  <div class="group-title"><span class="icon">⏱️</span> Thì Quá Khứ (Past Tenses)</div>
  <div class="list-box" id="past"></div>

  <div class="group-title"><span class="icon">⏭️</span> Thì Tương Lai (Future Tenses)</div>
  <div class="list-box" id="future"></div>

  <a href="index.html" class="back">← Quay lại trang chủ</a>

</div>

<!-- ⭐ Script tự động tạo toàn bộ danh sách -->
<script>
document.addEventListener("DOMContentLoaded", async () => {
  const res = await fetch("posts/posts.json");
  let posts = await res.json();

  // Lấy bài category "Tiếng Anh"
  posts = posts.filter(p => p.category === "Tiếng Anh");

  const present = document.getElementById("present");
  const past = document.getElementById("past");
  const future = document.getElementById("future");

  posts.forEach(post => {
    const item = document.createElement("a");
    item.className = "grammar-item";
    item.textContent = post.title;
    item.dataset.file = post.file;

    // Gắn link nếu có file
    fetch(`posts/${post.file}`)
      .then(r => {
        if (r.ok) {
          item.href = `post.html?file=${post.file}`;
          item.classList.add("completed");
          item.textContent = "✔ " + item.textContent;
        } else {
          item.classList.add("soon");
          item.textContent = "⏳ " + item.textContent;
        }
      });

    // ✔ Tự động phân nhóm theo tên file
    if (post.file.startsWith("present-")) present.appendChild(item);
    else if (post.file.startsWith("past-")) past.appendChild(item);
    else if (post.file.startsWith("future-") || post.file.startsWith("near-future")) future.appendChild(item);
    else present.appendChild(item); // fallback
  });
});
</script>

</body>
</html>
