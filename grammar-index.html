<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grammar Index | Binh Blog</title>

  <style>
    body {
      font-family: "Be Vietnam Pro", sans-serif;
      margin: 0;
      background: #fdfcf8;
      color: #333;
      padding: 20px;
    }
    body.dark {
      background: #1a1a1a;
      color: #eee;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 32px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      max-width: 1100px;
      margin: auto;
    }

    .card {
      background: #ffffff;
      padding: 18px;
      border-radius: 18px;
      border: 2px solid #e4e4e4;
      cursor: pointer;
      transition: 0.25s;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: #d7caff;
      box-shadow: 0 6px 16px rgba(120, 90, 255, 0.12);
    }

    .card img {
      width: 100%;
      border-radius: 12px;
      height: 140px;
      object-fit: cover;
      margin-bottom: 10px;
    }

    .card h3 {
      margin-bottom: 6px;
      font-size: 22px;
    }

    .desc {
      font-size: 14px;
      opacity: 0.8;
    }

    body.dark .card {
      background: #2d2d2d;
      border-color: #555;
    }
  </style>
</head>

<body>

  <h1>📘 English Grammar Lessons</h1>

  <div class="grid" id="grammar-list">
    <p>Đang tải...</p>
  </div>

 <script>
  async function loadGrammar() {
    const res = await fetch("/binh-blog/grammar/grammar.json");
    const data = await res.json();

    const container = document.getElementById("grammar-list");
    container.innerHTML = "";

    data.forEach(item => {
      container.innerHTML += `
        <div class="card" onclick="location.href='/binh-blog/lesson.html?file=${item.file}'">
          <img src="${item.thumbnail}" alt="${item.title}">
          <h3>${item.title}</h3>
          <p class="desc">${item.description}</p>
        </div>
      `;
    });
  }

  loadGrammar();
</script>

</body>
</html>
