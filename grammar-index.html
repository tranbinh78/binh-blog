<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grammar Index | Binh Blog</title>

  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: "Be Vietnam Pro", sans-serif;
      background: #faf9ff;
      margin: 0;
      padding: 0;
      transition: 0.3s;
    }

    /* DARK MODE BODY */
    body.dark {
      background: #17151f;
      color: #eee;
    }

    .container {
      max-width: 950px;
      margin: 40px auto 80px;
      padding: 20px;
    }

    h1 {
      font-size: 34px;
      text-align: center;
      margin-bottom: 10px;
      color: #2a235a;
      font-weight: 800;
      transition: 0.3s;
    }

    body.dark h1 {
      color: #d6ccff;
    }

    .subtitle {
      text-align: center;
      color: #555;
      margin-bottom: 40px;
      transition: 0.3s;
    }

    body.dark .subtitle {
      color: #bbb;
    }

    /* DARK MODE TOGGLE */
    .toggle-box {
      text-align: right;
      margin-bottom: 15px;
    }

    .toggle-btn {
      background: #dcd2ff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    .toggle-btn:hover {
      background: #c4b5ff;
    }

    body.dark .toggle-btn {
      background: #3b335f;
      color: #eee;
    }

    body.dark .toggle-btn:hover {
      background: #4e4386;
    }

    /* GROUP TITLE */
    .group-title {
      font-size: 26px;
      margin-top: 40px;
      margin-bottom: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: 0.3s;
    }

    body.dark .group-title {
      color: #dcd2ff;
    }

    .icon { font-size: 30px; }

    /* BOX */
    .list-box {
      background: #f2edff;
      padding: 20px 28px;
      border-radius: 14px;
      border-left: 6px solid #9378ff;
      margin-bottom: 30px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
      transition: 0.3s;
    }

    body.dark .list-box {
      background: #2a2636;
      border-left-color: #6d54ff;
      box-shadow: none;
    }

    /* ITEM */
    .grammar-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
      padding: 10px 14px;
      font-size: 18px;
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
      transition: 0.25s;
      color: #4734d3;
    }

    .grammar-item:hover {
      background: #ece6ff;
      transform: translateX(4px);
    }

    body.dark .grammar-item {
      color: #bda8ff;
    }

    body.dark .grammar-item:hover {
      background: #3a344b;
    }

    /* ✔ Completed */
    .completed {
      color: #087a3d !important;
      background: #e6f9ee;
      border-left: 4px solid #0fa34a;
    }

    body.dark .completed {
      color: #65ff9a !important;
      background: #223426;
      border-left-color: #17d45e;
    }

    /* ⏳ Coming soon */
    .soon {
      color: #777 !important;
      background: #f3f3f3;
      border-left: 4px solid #aaa;
      font-style: italic;
    }

    body.dark .soon {
      color: #aaa !important;
      background: #2e2e2e;
      border-left-color: #666;
    }

    .back {
      display: inline-block;
      margin-top: 30px;
      padding: 10px 18px;
      background: #d9d1ff;
      text-decoration: none;
      color: #333;
      font-weight: 600;
      border-radius: 8px;
      transition: 0.3s;
    }

    .back:hover { background: #c8bef8; }

    body.dark .back {
      background: #3b335f;
      color: #eee;
    }

    body.dark .back:hover {
      background: #504478;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="toggle-box">
    <button class="toggle-btn" id="darkToggle">🌙 Dark Mode</button>
  </div>

  <h1>📘 Grammar Index</h1>
  <p class="subtitle">Danh sách toàn bộ các thì – tự động cập nhật theo posts.json</p>

  <!-- GROUPS -->
  <div class="group-title"><span class="icon">⏳</span> Thì Hiện Tại (Present Tenses)</div>
  <div class="list-box" id="present"></div>

  <div class="group-title"><span class="icon">⏱️</span> Thì Quá Khứ (Past Tenses)</div>
  <div class="list-box" id="past"></div>

  <div class="group-title"><span class="icon">⏭️</span> Thì Tương Lai (Future Tenses)</div>
  <div class="list-box" id="future"></div>

  <a href="index.html" class="back">← Quay lại trang chủ</a>

</div>

<!-- ⭐ SCRIPT: Tự động load + highlight + Dark Mode -->
<script>
document.addEventListener("DOMContentLoaded", async () => {

  // Tải bài từ posts.json
  const res = await fetch("posts/posts.json");
  let posts = await res.json();

  posts = posts.filter(p => p.category === "Tiếng Anh");

  const present = document.getElementById("present");
  const past = document.getElementById("past");
  const future = document.getElementById("future");

  posts.forEach(post => {
    const item = document.createElement("a");
    item.className = "grammar-item";
    item.textContent = post.title;
    item.dataset.file = post.file;

    fetch(`posts/${post.file}`)
      .then(r => {
        if (r.ok) {
          item.href = `post.html?file=${post.file}`;
          item.classList.add("completed");
          item.textContent = "✔ " + item.textContent;
        } else {
          item.classList.add("soon");
          item.textContent = "⏳ " + item.textContent;
        }
      });
  // ✔ Tự động phân nhóm theo tên file (đã sửa lỗi)
    if (post.file.startsWith("present-")) present.appendChild(item);
    else if (post.file.startsWith("past-")) past.appendChild(item);
    else if (post.file.startsWith("future-") || post.file.startsWith("near-future")) future.appendChild(item);
    });
  // Không fallback → bài viết thường sẽ bị bỏ qua
  // ⭐ DARK MODE
  const toggle = document.getElementById("darkToggle");

  // Load trạng thái
  if (localStorage.getItem("darkmode") === "true") {
    document.body.classList.add("dark");
    toggle.textContent = "🌞 Light Mode";
  }

  toggle.addEventListener("click", () => {
    document.body.classList.toggle("dark");

    const isDark = document.body.classList.contains("dark");
    localStorage.setItem("darkmode", isDark);

    toggle.textContent = isDark ? "🌞 Light Mode" : "🌙 Dark Mode";
  });

});
</script>

</body>
</html>
