<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Grammar Index | Binh Blog — Study Dashboard</title>

  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#fbf9ff;
      --card:#fff;
      --muted:#6b6b7a;
      --accent:#7b61ff;
      --accent-2:#9f84ff;
      --glass: rgba(123,97,255,0.08);
      --success:#29bf7a;
      --danger:#ff6b6b;
      --shadow: 0 8px 28px rgba(37,31,63,0.06);
    }
    *{box-sizing:border-box}
    body{
      font-family:"Be Vietnam Pro",system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial;
      background: linear-gradient(180deg,#fbf9ff 0%, #f6fbff 100%);
      margin:0;
      color:#13131a;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    .wrap{max-width:1180px;margin:32px auto;padding:24px}

    header.main{
      display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:22px;
    }

    .brand{
      display:flex;gap:14px;align-items:center;
    }
    .brand .logo{
      width:60px;height:60px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));
      display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px;box-shadow:var(--shadow);
    }
    .brand h1{margin:0;font-size:20px}
    .brand p{margin:0;color:var(--muted);font-size:13px}

    .controls{display:flex;gap:12px;align-items:center}
    .btn{
      background:var(--accent);color:#fff;padding:10px 14px;border-radius:10px;border:none;font-weight:700;cursor:pointer;
      box-shadow:0 6px 20px rgba(123,97,255,0.18);
    }
    .btn.ghost{background:transparent;color:var(--accent);border:1px solid rgba(123,97,255,0.12);box-shadow:none}

    /* progress area */
    .progress-wrap{display:flex;align-items:center;gap:20px;margin:18px 0 28px}
    .progress{flex:1;background:linear-gradient(90deg,#f1eeff,#fcfdff);padding:12px;border-radius:12px;border:1px solid rgba(123,97,255,0.06)}
    .progress .bar{height:12px;background:#eee;border-radius:8px;overflow:hidden}
    .progress .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));width:0%;transition:width .8s cubic-bezier(.22,.9,.2,1)}
    .progress .meta{display:flex;justify-content:space-between;font-size:13px;padding-top:8px;color:var(--muted)}

    /* filters and search */
    .tools{display:flex;gap:14px;align-items:center;margin-bottom:22px;flex-wrap:wrap}
    .filters{display:flex;gap:10px;flex-wrap:wrap}
    .chip{padding:8px 12px;border-radius:999px;border:1px solid rgba(123,97,255,0.12);background:#fff;font-weight:600;color:var(--muted);cursor:pointer}
    .chip.active{background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent;box-shadow:0 8px 22px rgba(123,97,255,0.12)}

    .search{
      margin-left:auto;display:flex;gap:8px;align-items:center;padding:8px 12px;border-radius:12px;background:#fff;box-shadow:var(--shadow);
      border:1px solid rgba(0,0,0,0.03)
    }
    .search input{border:0;outline:none;font-size:15px;padding:8px;background:transparent;width:240px}

    /* grid */
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
    .card{
      background:var(--card);border-radius:14px;padding:18px;box-shadow:var(--shadow);border:1px solid rgba(12,12,18,0.02);
      display:flex;flex-direction:column;gap:12px;min-height:140px;justify-content:space-between;
    }
    .card .head{display:flex;gap:12px;align-items:center}
    .icon{
      width:54px;height:54px;border-radius:10px;background:linear-gradient(180deg,rgba(0,0,0,0.03),rgba(0,0,0,0.01));
      display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--accent);
    }
    .card h3{margin:0;font-size:16px}
    .card .meta{font-size:13px;color:var(--muted)}
    .card .status{display:inline-block;padding:6px 9px;border-radius:8px;font-weight:700;font-size:12px}
    .card .status.completed{background:rgba(26,142,88,0.12);color:var(--success);border:1px solid rgba(26,142,88,0.12)}
    .card .status.soon{background:rgba(255,160,56,0.07);color:#a86b00;border:1px solid rgba(255,160,56,0.08)}
    .card .ctas{display:flex;gap:10px;align-items:center}
    .card a.link{color:var(--accent);font-weight:700;text-decoration:none;border-radius:8px;padding:7px 10px}
    .card small{color:var(--muted)}

    /* footer note */
    .note{margin-top:20px;color:var(--muted);font-size:14px;text-align:center}

    /* responsive */
    @media (max-width:720px){
      .search input{width:120px}
      header.main{flex-direction:column;align-items:flex-start;gap:12px}
    }

    /* dark mode */
    body.dark{
      --bg:#0f0b18;
      --card:#13111a;
      --muted:#bfb9d1;
      background:linear-gradient(180deg,#0b0610,#140b20);
      color:#fff;
    }
    body.dark .logo{color:#fff}
    body.dark .card{box-shadow:0 10px 30px rgba(0,0,0,0.5)}
    body.dark .search{background:#191224;border:1px solid rgba(255,255,255,0.03)}
    body.dark .chip{background:transparent;border:1px solid rgba(255,255,255,0.04);color:#d8d3ff}
    body.dark .chip.active{box-shadow:0 6px 20px rgba(155,120,255,0.14)}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="main">
      <div class="brand">
        <div class="logo">BB</div>
        <div>
          <h1>Grammar Index</h1>
          <p>📘 Lộ trình 12 thì & các chủ điểm Ngữ pháp — Binh Blog</p>
        </div>
      </div>

      <div class="controls">
        <button id="darkToggle" class="btn ghost">🌓 Dark Mode</button>
        <button id="refreshBtn" class="btn">🔄 Refresh</button>
      </div>
    </header>

    <div class="progress-wrap">
      <div class="progress">
        <div style="display:flex;align-items:center;gap:12px">
          <strong style="font-size:15px">Tiến độ học</strong>
        </div>

        <div class="bar" style="margin-top:12px">
          <div class="fill" id="progressFill" style="width:0%"></div>
        </div>

        <div class="meta"><span id="progressText">Đang tính...</span> <span id="counterText">0/0 bài</span></div>
      </div>
    </div>

    <div class="tools">
      <div class="filters" id="groupFilters">
        <div class="chip active" data-group="all">All</div>
        <div class="chip" data-group="present">Present</div>
        <div class="chip" data-group="past">Past</div>
        <div class="chip" data-group="future">Future</div>
      </div>

      <div class="filters" id="statusFilters" style="margin-left:12px">
        <div class="chip active" data-status="all">All</div>
        <div class="chip" data-status="completed">Completed</div>
        <div class="chip" data-status="soon">Coming Soon</div>
      </div>

      <div class="search" style="margin-left:auto">
        <svg width="18" height="18" viewBox="0 0 24 24" style="opacity:.6"><path fill="currentColor" d="M9.5 3A6.5 6.5 0 1 1 3 9.5 6.5 6.5 0 0 1 9.5 3m0-1A7.5 7.5 0 1 0 17 9.5 7.5 7.5 0 0 0 9.5 2zM21 21l-4.35-4.35"/></svg>
        <input id="searchBox" placeholder="Tìm bài viết..." />
      </div>
    </div>

    <main>
      <div id="grid" class="grid" aria-live="polite">
        <!-- cards rendered here -->
      </div>

      <div class="note" id="note">Tip: Bấm "Xem bài" để vào bài học. Nút refresh cập nhật trạng thái (Completed / Coming soon).</div>
    </main>
  </div>

<script>
(async function(){
  const grid = document.getElementById('grid');
  const search = document.getElementById('searchBox');
  const groupFilters = document.getElementById('groupFilters');
  const statusFilters = document.getElementById('statusFilters');
  const darkToggle = document.getElementById('darkToggle');
  const refreshBtn = document.getElementById('refreshBtn');
  const progressFill = document.getElementById('progressFill');
  const progressText = document.getElementById('progressText');
  const counterText = document.getElementById('counterText');

  // state
  let posts = [];
  let cards = [];
  let activeGroup = 'all';
  let activeStatus = 'all';

  // utility to create card DOM
  function makeCard(post){
    const card = document.createElement('article');
    card.className = 'card';
    card.dataset.file = post.file || '';
    card.dataset.title = post.title || '';
    card.dataset.group = (post.file && (post.file.startsWith('present-') ? 'present' : post.file.startsWith('past-') ? 'past' : 'future')) || 'other';
    card.dataset.status = 'soon';

    const iconText = post.title ? post.title.split(' ')[0][0] : 'G';
    card.innerHTML = `
      <div class="head">
        <div class="icon">${iconText}</div>
        <div style="flex:1">
          <h3>${post.title}</h3>
          <div class="meta">${post.date ? '📅 '+post.date : ''} <small style="display:block">${post.description||''}</small></div>
        </div>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <span class="status soon">⏳ Coming soon</span>
          <div style="margin-top:8px"><small>Category: ${post.category||'Tiếng Anh'}</small></div>
        </div>

        <div class="ctas">
          <a class="link" href="#">Xem bài</a>
        </div>
      </div>
    `;

    // attach click
    const link = card.querySelector('a.link');
    link.addEventListener('click', (e)=>{
      e.preventDefault();
      if (card.dataset.status === 'completed') {
        location.href = `post.html?file=${encodeURIComponent(post.file)}`;
      } else {
        // if not completed, still open the post if file exists? We'll try open anyway:
        location.href = `post.html?file=${encodeURIComponent(post.file)}`;
      }
    });

    return card;
  }

  // load posts.json
  async function loadPosts(){
    try{
      const res = await fetch('posts/posts.json');
      if (!res.ok) throw new Error('posts.json not found');
      const data = await res.json();
      posts = data.filter(p => p.category && p.category.toLowerCase().includes('tiếng') || true); // keep all but prefer tiếng anh
      renderCards();
      await checkStatusForAll();
      updateProgress();
    }catch(err){
      grid.innerHTML = `<div style="padding:30px;background:#fff;border-radius:12px;box-shadow:var(--shadow)">Không thể tải posts.json — ${err.message}</div>`;
      console.error(err);
    }
  }

  function renderCards(){
    grid.innerHTML = '';
    cards = posts.map(p => {
      const c = makeCard(p);
      grid.appendChild(c);
      return c;
    });
  }

  // check if the post file exists (to mark completed)
  async function checkStatusForAll(){
    const checks = posts.map(async (p, idx) => {
      try{
        // try HEAD first if server allows; fallback to GET
        const head = await fetch(`posts/${p.file}`, {method:'HEAD'});
        const ok = head.ok;
        return {idx, ok};
      }catch(e){
        try{
          const get = await fetch(`posts/${p.file}`);
          return {idx, ok: get.ok};
        }catch(e2){
          return {idx, ok:false};
        }
      }
    });

    const results = await Promise.all(checks);
    results.forEach(r => {
      const post = posts[r.idx];
      const card = cards[r.idx];
      if (!card) return;
      const statusSpan = card.querySelector('.status');
      if (r.ok) {
        card.dataset.status = 'completed';
        statusSpan.classList.remove('soon');
        statusSpan.classList.add('completed');
        statusSpan.innerHTML = '✔ Completed';
      } else {
        card.dataset.status = 'soon';
        statusSpan.classList.remove('completed');
        statusSpan.classList.add('soon');
        statusSpan.innerHTML = '⏳ Coming soon';
      }
    });
  }

  // filtering & searching
  function applyFilters(){
    const q = search.value.toLowerCase().trim();
    let shown = 0, total=cards.length, done=0;
    cards.forEach(card=>{
      const title = card.dataset.title.toLowerCase();
      const group = card.dataset.group;
      const status = card.dataset.status;

      let okGroup = (activeGroup==='all') || (group===activeGroup);
      let okStatus = (activeStatus==='all') || (status===activeStatus);

      let okSearch = !q || title.includes(q);

      if (okGroup && okStatus && okSearch){
        card.style.display = '';
        shown++;
      } else {
        card.style.display = 'none';
      }
      if (card.dataset.status === 'completed') done++;
    });

    progressText.textContent = `${Math.round((done/total||0)*100)}% hoàn thành`;
    counterText.textContent = `${done}/${total} bài`;
    const pct = Math.round((done/total||0)*100);
    progressFill.style.width = pct + '%';
  }

  // set up filter handlers
  function setupFilters(){
    groupFilters.addEventListener('click', (e)=>{
      const chip = e.target.closest('.chip');
      if(!chip) return;
      groupFilters.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      activeGroup = chip.dataset.group || 'all';
      applyFilters();
    });

    statusFilters.addEventListener('click', (e)=>{
      const chip = e.target.closest('.chip');
      if(!chip) return;
      statusFilters.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      activeStatus = chip.dataset.status || 'all';
      applyFilters();
    });

    search.addEventListener('input', ()=>{
      applyFilters();
    });

    refreshBtn.addEventListener('click', async ()=>{
      refreshBtn.disabled = true;
      refreshBtn.textContent = '⏳ Đang cập nhật...';
      await checkStatusForAll();
      applyFilters();
      setTimeout(()=>{ refreshBtn.disabled=false; refreshBtn.textContent='🔄 Refresh' },700);
    });

    darkToggle.addEventListener('click', ()=>{
      document.body.classList.toggle('dark');
      darkToggle.classList.toggle('active');
      darkToggle.textContent = document.body.classList.contains('dark') ? '☀ Light Mode' : '🌓 Dark Mode';
    });
  }

  // initial load
  await loadPosts();
  setupFilters();
  applyFilters();

})();
</script>
</body>
</html>
