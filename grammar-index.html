<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grammar Index | Binh Blog</title>

  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: "Be Vietnam Pro", sans-serif;
      background: #faf9ff;
      margin: 0;
      padding: 0;
      transition: 0.3s;
    }

    /* DARK MODE */
    body.dark {
      background: #17151f;
      color: #eee;
    }

    .container {
      max-width: 1100px;
      margin: 40px auto 80px;
      padding: 20px;
    }

    h1 {
      font-size: 34px;
      text-align: center;
      margin-bottom: 10px;
      color: #2a235a;
      font-weight: 800;
      transition: 0.3s;
    }

    body.dark h1 { color: #d6ccff; }

    .subtitle {
      text-align: center;
      color: #555;
      margin-bottom: 30px;
    }

    body.dark .subtitle { color: #bbb; }

    /* DARK MODE BUTTON */
    .toggle-box {
      text-align: right;
      margin-bottom: 10px;
    }

    .toggle-btn {
      background: #dcd2ff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    body.dark .toggle-btn {
      background: #3b335f;
      color: #eee;
    }

    /* FILTERS */
    .filters {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 25px;
      justify-content: center;
    }

    .filter-btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid #b6a5ff;
      background: white;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }

    .filter-btn:hover {
      background: #e9e1ff;
    }

    .filter-btn.active {
      background: #c7b6ff;
      border-color: #6f54ff;
      color: #000;
    }

    body.dark .filter-btn {
      background: #2a2636;
      border-color: #6f54ff;
      color: #eee;
    }

    body.dark .filter-btn.active {
      background: #6f54ff;
      color: #fff;
    }

    /* SEARCH */
    #search-box {
      width: 100%;
      padding: 14px;
      margin-bottom: 35px;
      border: 2px solid #b9aaff;
      border-radius: 10px;
      font-size: 18px;
      outline: none;
    }

    body.dark #search-box {
      background: #2a2636;
      color: #eee;
      border-color: #6f54ff;
    }

    /* CARD GRID */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    /* CARD STYLE */
    .card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      transition: 0.25s;
      border-left: 6px solid transparent;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    }

    body.dark .card {
      background: #2a2636;
      box-shadow: none;
    }

    .card-icon { font-size: 36px; }
    .card-title { font-size: 20px; font-weight: 700; }

    /* STATUS */
    .status {
      font-size: 15px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      display: inline-block;
      width: fit-content;
    }

    .completed { background: #e6f9ee; color: #0b7a3d; }
    body.dark .completed { background: #203427; color: #46f996; }

    .soon { background: #f0f0f0; color: #666; }
    body.dark .soon { background: #333; color: #aaa; }

    .btn-view {
      margin-top: auto;
      padding: 8px 14px;
      background: #dcd2ff;
      border-radius: 8px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      color: #333;
      transition: 0.3s;
    }

    .btn-view:hover { background: #c4b5ff; }
    body.dark .btn-view { background: #3b335f; color: #eee; }

.learned-tag {
  background: #fff8d1;
  color: #b08500;
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  width: fit-content;
}

body.dark .learned-tag {
  background: #5a4a00;
  color: #ffeb8a;
}
    
  </style>
</head>

<body>

<div class="container">

  <!-- Dark mode -->
  <div class="toggle-box">
    <button class="toggle-btn" id="darkToggle">🌙 Dark Mode</button>
  </div>

  <h1>📘 Grammar Index</h1>
  <p id="progress-text" class="subtitle" style="margin-top:-10px;">
  Đang tải tiến độ học...
  </p>

  <div id="progress-bar" style="
  width: 100%;
  height: 16px;
  background: #e9e4ff;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 25px;
">
  <div id="progress-fill" style="
    height: 100%;
    width: 0%;
    background: #7b61ff;
    transition: width 0.4s ease;
  "></div>
  </div>
  <p class="subtitle">Tự động cập nhật từ posts.json — hỗ trợ Dark Mode + Bộ lọc nâng cao</p>

  <!-- FILTER BAR -->
  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="present">Present</button>
    <button class="filter-btn" data-filter="past">Past</button>
    <button class="filter-btn" data-filter="future">Future</button>

    <button class="filter-btn active" data-status="all">All</button>
    <button class="filter-btn" data-status="completed">Completed</button>
    <button class="filter-btn" data-status="soon">Coming Soon</button>
    <button class="filter-btn" data-learn="learned">Đã học</button>
    <button class="filter-btn" data-learn="notlearned">Chưa học</button>
    
  </div>

  <!-- Search Box -->
  <input type="text" id="search-box" placeholder="🔍 Tìm kiếm...">

  <!-- Card Grid -->
  <div id="card-container" class="card-grid"></div>

</div>

<!-- SCRIPT -->
<script>
document.addEventListener("DOMContentLoaded", async () => {

  // LOAD POSTS
  const res = await fetch("posts/posts.json");
  let posts = await res.json();
  posts = posts.filter(p => p.category === "Tiếng Anh");

  const container = document.getElementById("card-container");

  // RENDER CARDS
  posts.forEach(post => {
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.file = post.file;

    // Group auto
    if (post.file.startsWith("present-")) card.dataset.group = "present";
    else if (post.file.startsWith("past-")) card.dataset.group = "past";
    else if (post.file.startsWith("future-") || post.file.startsWith("near-future"))
      card.dataset.group = "future";

    // Icon
    let icon = "📘";
    if (card.dataset.group === "past") icon = "📙";
    if (card.dataset.group === "future") icon = "📗";

    card.innerHTML = `
      <div class="card-icon">${icon}</div>
      <div class="card-title">${post.title}</div>
      <div class="status">Đang kiểm tra...</div>
      <a class="btn-view">Xem bài</a>
    `;

    // Check file exists
    fetch(`posts/${post.file}`).then(r => {
      const status = card.querySelector(".status");
      const btn = card.querySelector(".btn-view");

      if (r.ok) {
        card.dataset.status = "completed";
        status.textContent = "✔ Completed";
        btn.href = `post.html?file=${post.file}`;
      } else {
        card.dataset.status = "soon";
        status.textContent = "⏳ Coming soon";
        btn.remove();
      }
    });

    container.appendChild(card);
  });

  // FILTER FUNCTION
  const filterButtons = document.querySelectorAll(".filter-btn");
  const searchBox = document.getElementById("search-box");

  function applyFilters() {
    const cards = document.querySelectorAll(".card");
    const filterGroup = document.querySelector(".filter-btn[data-filter].active").dataset.filter;
    const filterStatus = document.querySelector(".filter-btn[data-status].active").dataset.status;
    const search = searchBox.value.toLowerCase();

    cards.forEach(card => {
      const matchesGroup = (filterGroup === "all" || card.dataset.group === filterGroup);
      const matchesStatus = (filterStatus === "all" || card.dataset.status === filterStatus);
      const matchesSearch = card.innerText.toLowerCase().includes(search);

      card.style.display = (matchesGroup && matchesStatus && matchesSearch) ? "flex" : "none";
    });
  }

  // CLICK FILTER
  filterButtons.forEach(btn => {
    btn.addEventListener("click", () => {
      // Toggle active within same category
      if (btn.dataset.filter) {
        document.querySelectorAll(".filter-btn[data-filter]").forEach(b => b.classList.remove("active"));
      }
      if (btn.dataset.status) {
        document.querySelectorAll(".filter-btn[data-status]").forEach(b => b.classList.remove("active"));
      }

      btn.classList.add("active");
      applyFilters();
    });
  });

  // SEARCH
  searchBox.addEventListener("input", applyFilters);

  // DARK MODE
  const toggle = document.getElementById("darkToggle");
  if (localStorage.getItem("darkmode") === "true") {
    document.body.classList.add("dark");
    toggle.textContent = "🌞 Light Mode";
  }
  toggle.addEventListener("click", () => {
    document.body.classList.toggle("dark");
    const isDark = document.body.classList.contains("dark");
    localStorage.setItem("darkmode", isDark);
    toggle.textContent = isDark ? "🌞 Light Mode" : "🌙 Dark Mode";
  });

});

// ⭐ LEARNING PROGRESS SYSTEM ⭐
let learned = JSON.parse(localStorage.getItem("learned") || "[]");

// Khi người dùng bấm xem bài → thêm vào danh sách đã học
document.addEventListener("click", (e) => {
  if (e.target.classList.contains("btn-view")) {
    const file = e.target.href.split("file=")[1];
    if (!learned.includes(file)) {
      learned.push(file);
      localStorage.setItem("learned", JSON.stringify(learned));
    }
  }
});

// Cập nhật tag "Đã học" trên từng card
function updateLearnedStatus() {
  document.querySelectorAll(".card").forEach(card => {
    const file = card.dataset.file;
    if (learned.includes(file)) {
      if (!card.querySelector(".learned-tag")) {
        const tag = document.createElement("div");
        tag.className = "learned-tag";
        tag.textContent = "✓ Đã học";
        card.insertBefore(tag, card.children[1]);
      }
      card.dataset.learn = "learned";
    } else {
      card.dataset.learn = "notlearned";
    }
  });
}

// ⭐ Tiến trình học
function updateProgress() {
  const total = document.querySelectorAll(".card").length;
  const done = learned.filter(file =>
    document.querySelector(`.card[data-file="${file}"]`)
  ).length;

  const percent = Math.round((done / total) * 100);

  document.getElementById("progress-text").textContent =
    `Tiến độ học: ${done}/${total} bài (${percent}%)`;

  document.getElementById("progress-fill").style.width = percent + "%";
}

// Gọi khi load trang
setTimeout(() => {
  updateLearnedStatus();
  updateProgress();
}, 800);

// ⭐ Filter đã học / chưa học
document.querySelectorAll('[data-learn]').forEach(btn => {
  btn.addEventListener("click", () => {
    const value = btn.dataset.learn;

    document.querySelectorAll(".filter-btn[data-learn]")
      .forEach(b => b.classList.remove("active"));
    btn.classList.add("active");

    document.querySelectorAll(".card").forEach(card => {
      if (value === "all") {
        card.style.display = "flex";
      } else {
        card.style.display = (card.dataset.learn === value) ? "flex" : "none";
      }
    });
  });
});
  
</script>

</body>
</html>
