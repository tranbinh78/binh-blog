<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>English Grammar Lessons | Binh Blog</title>

<style>
  body {
    font-family: "Be Vietnam Pro", sans-serif;
    background: #faf9f4;
    padding: 20px;
    color: #333;
    transition: 0.3s;
    max-width: 900px;
    margin: auto;
  }
  body.dark { background:#1b1b1b; color:#eee; }

  h1 {
    text-align: center;
    margin-bottom: 30px;
  }

  .module {
    background: white;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 25px;
    border: 1px solid #ddd;
  }
  body.dark .module { background:#2a2a2a; border-color:#555; }

  .module-title {
    font-size: 20px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    color: #4a3fa8;
  }
  body.dark .module-title { color:#cfc4ff; }

  .lesson-list a {
    display: block;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 6px;
    text-decoration: none;
    color: #333;
    transition: 0.2s;
  }
  body.dark .lesson-list a { color:#eee; }

  .lesson-list a:hover {
    background: #ede3ff;
  }
  body.dark .lesson-list a:hover {
    background:#5b4fa8;
  }

</style>
</head>

<body>

<h1>📘 English Grammar Lessons</h1>

<div id="modules-container">Đang tải...</div>

<script>
async function loadModules() {
  const res = await fetch("/binh-blog/grammar/grammar.json");
  const list = await res.json();

  // Chia module giống lesson.html
  const modules = {
    "Tenses": list.slice(0, 12),
    "Modal Verbs": list.slice(12, 16),
    "Passive Voice": list.slice(16, 21),
    "Conditionals": list.slice(21, 25),
    "Verb Forms": list.slice(25, 30),
    "Nouns / Articles": list.slice(30, 36)
  };

  const container = document.getElementById("modules-container");
  container.innerHTML = "";

  for (const moduleName in modules) {
    const lessons = modules[moduleName];

    const moduleDiv = document.createElement("div");
    moduleDiv.className = "module";

    moduleDiv.innerHTML = `
      <div class="module-title">📘 ${moduleName}</div>
      <div class="lesson-list"></div>
    `;

    const listDiv = moduleDiv.querySelector(".lesson-list");

    lessons.forEach(item => {
      const a = document.createElement("a");
      a.href = `/binh-blog/lesson.html?file=${item.file}`;
      a.innerText = item.title;
      listDiv.appendChild(a);
    });

    container.appendChild(moduleDiv);
  }
}

loadModules();
</script>

</body>
</html>
