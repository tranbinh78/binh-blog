<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Multiple-choice Quiz</title>
<style>
    body { font-family: Arial; max-width: 800px; margin: auto; padding: 20px; }
    .question { background: #f7f7f7; padding: 15px; border-radius: 6px; margin-top: 20px; }
    .option { padding: 8px; margin: 5px 0; border: 1px solid #ccc; cursor: pointer; border-radius: 4px; }
    .option:hover { background: #eee; }
    .correct { background: #b5ffbd !important; }
    .wrong { background: #ffb5b5 !important; }
    #result { font-size: 22px; margin-top: 25px; font-weight: bold; }
</style>
</head>
<body>

<h1>Grammar MCQ Quiz</h1>
<p>Chọn bài học:</p>

<select id="lessonSelector"></select>
<button onclick="loadQuiz()">Start Quiz</button>

<div id="quiz"></div>
<div id="result"></div>

<script>
// Load list of lessons
async function loadLessons() {
    const res = await fetch("grammar/grammar.json");
    const data = await res.json();

    let selector = document.getElementById("lessonSelector");
    data.forEach(item => {
        let opt = document.createElement("option");
        opt.value = item.file;
        opt.innerText = item.title;
        selector.appendChild(opt);
    });
}
loadLessons();


// Load quiz from selected file
async function loadQuiz() {
    const file = document.getElementById("lessonSelector").value;
    const res = await fetch("grammar/" + file);
    const md = await res.text();

    let questions = extractMCQ(md);
    renderQuiz(questions);
}


// Extract MCQ questions ONLY
function extractMCQ(md) {
    let lines = md.split("\n");

    let questions = [];
    let currentQ = null;
    let answerKey = {};

    // Parse Answer Key
    let keySection = false;
    for (let line of lines) {
        if (line.includes("→ Answer Key") || line.includes("Answer Key")) {
            keySection = true;
            continue;
        }
        if (keySection) {
            let match = line.trim().match(/^([0-9]+)\.\s*([a-d])/);
            if (match) {
                answerKey[match[1]] = match[2];
            }
        }
    }

    // Parse MCQ questions
    const questionRegex = /^([0-9]+)\.\s(.+)/;
    const optionRegex = /^\s*([a-d])\.\s(.+)/;

    for (let line of lines) {

        let qMatch = line.match(questionRegex);
        if (qMatch) {
            // Start new question
            currentQ = {
                number: qMatch[1],
                question: qMatch[2],
                options: [],
                answer: answerKey[qMatch[1]]
            };
            questions.push(currentQ);
        }

        let opMatch = line.match(optionRegex);
        if (opMatch && currentQ) {
            currentQ.options.push({
                key: opMatch[1],
                text: opMatch[2]
            });
        }
    }

    return questions;
}


// Render quiz
function renderQuiz(questions) {
    let quizDiv = document.getElementById("quiz");
    let resultDiv = document.getElementById("result");
    quizDiv.innerHTML = "";
    resultDiv.innerHTML = "";
    let score = 0;

    questions.forEach((q, i) => {
        let qBox = document.createElement("div");
        qBox.className = "question";

        qBox.innerHTML = `<b>${i + 1}. ${q.question}</b>`;

        q.options.forEach(opt => {
            let optDiv = document.createElement("div");
            optDiv.className = "option";
            optDiv.innerText = `${opt.key}. ${opt.text}`;

            optDiv.onclick = () => {
                if (opt.key === q.answer) {
                    optDiv.classList.add("correct");
                    score++;
                } else {
                    optDiv.classList.add("wrong");
                }
                updateScore();
            };

            qBox.appendChild(optDiv);
        });

        quizDiv.appendChild(qBox);
    });

    function updateScore() {
        resultDiv.innerText = `Score: ${score} / ${questions.length}`;
    }
}
</script>

</body>
</html>
