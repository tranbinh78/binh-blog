<!-- ===== Lightbox ===== -->
<div id="lightbox" class="lightbox">
  <span class="lightbox-close">&times;</span>
  <span class="lightbox-prev">&#10094;</span>
  <img class="lightbox-img" src="" alt="">
  <span class="lightbox-next">&#10095;</span>
  <p class="lightbox-caption"></p>
</div>

<!-- Dark mode script -->
<script>
  const toggle = document.getElementById("darkToggle");
  const label = document.getElementById("themeLabel");
  const root = document.documentElement;

  if (localStorage.getItem("theme") === "dark") {
    root.classList.add("dark");
    toggle.checked = true;
    label.textContent = "☀️ Light Mode";
  }

  toggle.addEventListener("change", () => {
    root.classList.toggle("dark", toggle.checked);
    label.textContent = toggle.checked ? "☀️ Light Mode" : "🌙 Dark Mode";
    localStorage.setItem("theme", toggle.checked ? "dark" : "light");
  });
</script>

<!-- Lightbox script -->
<script>
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.querySelector(".lightbox-img");
  const lightboxCaption = document.querySelector(".lightbox-caption");
  const closeBtn = document.querySelector(".lightbox-close");
  const prevBtn = document.querySelector(".lightbox-prev");
  const nextBtn = document.querySelector(".lightbox-next");

  const images = Array.from(document.querySelectorAll(".gallery-grid img"));
  let currentIndex = 0;

  function showImage(index) {
    const img = images[index];
    if (!img) return;

    lightboxImg.src = img.src;
    lightboxCaption.textContent =
      img.closest("figure")?.querySelector("figcaption")?.textContent ||
      img.alt ||
      "";

    currentIndex = index;
  }

  images.forEach((img, index) => {
    img.style.cursor = "zoom-in";
    img.addEventListener("click", () => {
      showImage(index);
      lightbox.classList.add("active");
    });
  });

  prevBtn.onclick = () =>
    showImage((currentIndex - 1 + images.length) % images.length);

  nextBtn.onclick = () =>
    showImage((currentIndex + 1) % images.length);

  closeBtn.onclick = () => lightbox.classList.remove("active");

  lightbox.onclick = e =>
    e.target === lightbox && lightbox.classList.remove("active");

  document.addEventListener("keydown", e => {
    if (!lightbox.classList.contains("active")) return;
    if (e.key === "Escape") lightbox.classList.remove("active");
    if (e.key === "ArrowLeft") prevBtn.onclick();
    if (e.key === "ArrowRight") nextBtn.onclick();
  });
</script>

</body>
</html>
