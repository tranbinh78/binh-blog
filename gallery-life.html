<!-- Nút chuyển Dark Mode -->
  <div class="theme-switch-wrapper">
      <label class="theme-switch" for="darkToggle">
          <input type="checkbox" id="darkToggle">
          <span class="slider"></span>
      </label>
      <span id="themeLabel">🌙 Dark Mode</span>
  </div>
      
    </aside>

    <!-- Main content -->
    <main class="main">
      <div class="header-row">
        <div>
          <h2 class="site-title">Gallery – Cuộc sống</h2>
          <p class="lead">Những khoảnh khắc đời thường.</p>
        </div>
      </div>

     <section class="article">

    <div class="gallery-grid">
        <figure class="gallery-item">
        <img src="assets/gallery/cuoc_song_01.jpg" alt="Buổi sáng ở Lâm Đồng">
        <figcaption>Buổi sáng ở Lâm Đồng</figcaption>
        </figure>

        <figure class="gallery-item">
        <img src="assets/gallery/cuoc_song_02.jpg" alt="Góc ban công nhỏ">
        <figcaption>Góc ban công nhỏ</figcaption>
        </figure>

        <figure class="gallery-item">
        <img src="assets/gallery/cuoc_song_03.jpg" alt="Góc làm việc">
        <figcaption>Góc làm việc</figcaption>
        </figure>
    </div>

      </section>

    </main>
  </div>

 <script>
  const toggle = document.getElementById("darkToggle");
  const label = document.getElementById("themeLabel");
  const root = document.documentElement;

  // Load trạng thái đã lưu
  if (localStorage.getItem("theme") === "dark") {
    root.classList.add("dark");
    toggle.checked = true;
    label.textContent = "☀️ Light Mode";
  }

  toggle.addEventListener("change", () => {
    if (toggle.checked) {
      root.classList.add("dark");
      label.textContent = "☀️ Light Mode";
      localStorage.setItem("theme", "dark");
    } else {
      root.classList.remove("dark");
      label.textContent = "🌙 Dark Mode";
      localStorage.setItem("theme", "light");
    }
  });
</script>

<script>
  const navLinks = document.querySelectorAll(".nav a");

  navLinks.forEach(link => {
    link.addEventListener("click", function(e) {
      const rect = this.getBoundingClientRect();
      const ripple = document.createElement("span");

      const size = Math.max(rect.width, rect.height);
      ripple.style.width = ripple.style.height = size + "px";

      ripple.style.left = (e.clientX - rect.left - size / 2) + "px";
      ripple.style.top = (e.clientY - rect.top - size / 2) + "px";

      ripple.classList.add("ripple");
      this.appendChild(ripple);

      setTimeout(() => {
        ripple.remove();
      }, 600);
    });
  });
</script>

<!-- ===== Lightbox ===== -->
<div id="lightbox" class="lightbox">
  <span class="lightbox-close">&times;</span>
  <img class="lightbox-img" src="" alt="">
  <p class="lightbox-caption"></p>
</div>
  
<script>
 
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.querySelector(".lightbox-img");
  const lightboxCaption = document.querySelector(".lightbox-caption");
  const closeBtn = document.querySelector(".lightbox-close");

  const images = document.querySelectorAll(".gallery-grid img");
  
  images.forEach(img => {
    img.style.cursor = "zoom-in";

    img.addEventListener("click", () => {
      console.log("Image clicked");

      lightboxImg.src = img.src;
      lightboxCaption.textContent =
        img.closest("figure")?.querySelector("figcaption")?.textContent ||
        img.alt ||
        "";

      lightbox.classList.add("active");
    });
  });

  closeBtn.onclick = () => lightbox.classList.remove("active");

  lightbox.onclick = e => {
    if (e.target === lightbox) lightbox.classList.remove("active");
  };

  document.onkeydown = e => {
    if (e.key === "Escape") lightbox.classList.remove("active");
  };
</script>
