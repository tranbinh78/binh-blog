<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Grammar Quiz</title>
  <link rel="stylesheet" href="../assets/css/style.css" />

  <style>
    body {
      background: #f5f7fb;
    }

    .quiz-container {
      max-width: 820px;
      margin: 40px auto;
    }

    .quiz-card {
      background: #fff;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,.06);
      margin-bottom: 24px;
    }

    .quiz-card label {
      display: block;
      padding: 10px 14px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      margin: 8px 0;
      cursor: pointer;
    }

    .quiz-card input {
      margin-right: 8px;
    }

    .correct {
      background: #dcfce7;
      border-color: #22c55e;
    }

    .wrong {
      background: #fee2e2;
      border-color: #ef4444;
    }

    .explain {
      margin-top: 12px;
      padding: 12px;
      background: #f1f5f9;
      border-left: 4px solid #6366f1;
      font-size: 15px;
    }

    #submit {
      background: #6366f1;
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="quiz-container">
  <h1 id="quiz-title">Grammar Quiz</h1>
  <div id="quiz"></div>

  <button id="submit">Nộp bài</button>
  <div id="result" style="margin-top:20px;font-weight:700"></div>

  <p style="margin-top:30px;">
    ← <a href="test-grammar.html">Quay lại Test Grammar</a>
  </p>
</div>

<script>
const params = new URLSearchParams(location.search);
const slug = params.get("quiz");

if (!slug) {
  document.getElementById("quiz").innerText = "Không có bài kiểm tra.";
} else {
  fetch(`../grammar/quiz/${slug}.json`)
    .then(res => res.json())
    .then(renderQuiz)
    .catch(() => {
      document.getElementById("quiz").innerText =
        "Không tìm thấy bài test.";
    });
}

function renderQuiz(data) {
  document.getElementById("quiz-title").innerText = data.title;
  const quiz = document.getElementById("quiz");

  data.questions.forEach((q, i) => {
    const card = document.createElement("div");
    card.className = "quiz-card";

    card.innerHTML = `
      <p><b>${i + 1}. ${q.question}</b></p>
      ${q.choices.map((c, idx) => `
        <label>
          <input type="radio" name="q${i}" value="${idx}">
          ${c}
        </label>
      `).join("")}
      <div class="explain" style="display:none">
        <b>Giải thích:</b> ${q.explain || ""}
      </div>
    `;

    quiz.appendChild(card);
  });

  document.getElementById("submit").onclick =
    () => checkAnswers(data);
}

function checkAnswers(data) {
  let score = 0;
  const cards = document.querySelectorAll(".quiz-card");

  data.questions.forEach((q, i) => {
    const selected =
      document.querySelector(`input[name="q${i}"]:checked`);
    const labels = cards[i].querySelectorAll("label");
    const explain = cards[i].querySelector(".explain");

    labels.forEach((label, idx) => {
      if (idx === q.answer) label.classList.add("correct");
      if (selected && idx == selected.value && idx !== q.answer)
        label.classList.add("wrong");
    });

    if (selected && Number(selected.value) === q.answer)
      score++;

    explain.style.display = "block";
  });

  document.getElementById("result").innerText =
    `✅ Bạn đúng ${score}/${data.questions.length} câu`;
}
</script>

</body>
</html>
