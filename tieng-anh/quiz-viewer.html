<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Grammar Quiz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f6f7fb;
      margin: 0;
      padding: 0;
    }

    .layout {
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 16px 60px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .quiz-question {
      background: #ffffff;
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.05);
    }

    .quiz-question p {
      margin: 0 0 12px;
      font-weight: 600;
    }

    .quiz-question label {
      display: block;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      border: 1px solid #e5e7eb;
      transition: background 0.2s, border 0.2s;
    }

    .quiz-question input {
      margin-right: 8px;
    }

    .quiz-question label:hover {
      background: #f3f4f6;
    }

    .correct {
      background: #dcfce7 !important;
      border-color: #22c55e !important;
    }

    .wrong {
      background: #fee2e2 !important;
      border-color: #ef4444 !important;
    }

    #submit {
      margin-top: 20px;
      background: #c9b3ff;
      border: none;
      padding: 14px 22px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    #submit:hover {
      opacity: 0.9;
    }

    #result {
      margin-top: 20px;
      font-size: 18px;
      font-weight: 700;
    }

    .back-link {
      margin-top: 30px;
      display: inline-block;
    }

 .quiz-question {
  background: #fff;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 22px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}

.choice {
  display: block;
  padding: 10px 14px;
  margin: 8px 0;
  border-radius: 8px;
  cursor: pointer;
}

.choice input {
  margin-right: 8px;
}

.explanation {
  background: #f8fafc;
  padding: 12px;
  border-left: 4px solid #6366f1;
  border-radius: 6px;
}
  </style>
</head>
<body>

<div class="layout">

  <h1 id="quiz-title">Grammar Quiz</h1>
  <div id="quiz">Đang tải bài kiểm tra…</div>

  <button id="submit">Nộp bài</button>
  <div id="result"></div>

  <p class="back-link">
    ← <a href="test-grammar.html">Quay lại Test Grammar</a>
  </p>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const quizSlug = params.get("quiz"); // present-simple

let quizData = null;

if (!quizSlug) {
  document.getElementById("quiz").innerText = "Không có bài kiểm tra.";
} else {
  fetch(`../grammar/quiz/${quizSlug}.json`)
    .then(res => {
      if (!res.ok) throw new Error("Quiz not found");
      return res.json();
    })
    .then(data => {
      quizData = data;
      renderQuiz(data);
    })
    .catch(() => {
      document.getElementById("quiz").innerText =
        "❌ Không tìm thấy bài test.";
    });
}

function renderQuiz(data) {
  document.getElementById("quiz-title").innerText = data.title;

  const quizEl = document.getElementById("quiz");
  quizEl.innerHTML = "";

  data.questions.forEach((q, i) => {
    const div = document.createElement("div");
    div.className = "quiz-question";
    div.dataset.index = i;

    div.innerHTML = `
      <p><b>${i + 1}. ${q.question}</b></p>

      ${q.choices.map((c, idx) => `
        <label class="choice">
          <input type="radio" name="q${i}" value="${idx}">
          ${c}
        </label>
      `).join("")}

      <div class="explanation" style="display:none; margin-top:10px;">
        <b>Giải thích:</b> ${q.explanation}
      </div>
    `;

    quizEl.appendChild(div);
  });

  document.getElementById("submit").onclick = () => checkAnswers(data);
}

function checkAnswers(data) {
  let score = 0;

  data.questions.forEach((q, i) => {
    const wrapper = document.querySelector(
      `.quiz-question[data-index="${i}"]`
    );

    const selected = wrapper.querySelector(
      `input[name="q${i}"]:checked`
    );

    const choices = wrapper.querySelectorAll(".choice");
    const explainBox = wrapper.querySelector(".explanation");

    choices.forEach((label, idx) => {
      label.style.border = "1px solid #e5e7eb";
      label.style.background = "#fff";

      if (idx === q.answer) {
        label.style.background = "#dcfce7";
        label.style.border = "1px solid #22c55e";
      }

      if (selected && idx === Number(selected.value) && idx !== q.answer) {
        label.style.background = "#fee2e2";
        label.style.border = "1px solid #ef4444";
      }
    });

    if (selected && Number(selected.value) === q.answer) {
      score++;
    }

    explainBox.style.display = "block";
  });

  document.getElementById("result").innerHTML = `
    <div style="margin-top:20px;font-size:18px;font-weight:700">
      ✅ Bạn đúng ${score}/${data.questions.length} câu
    </div>
  `;
}
</script>

</body>
</html>
