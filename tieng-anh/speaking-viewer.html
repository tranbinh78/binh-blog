<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Speaking — Trần Bình</title>

  <link rel="stylesheet" href="../css/styles.css" />

  <!-- Markdown renderer -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
<div class="wrapper">

  <!-- Sidebar: copy y hệt vocabulary-viewer.html -->
  <!-- (dán sidebar giống Vocabulary Viewer) -->
<!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <img src="../assets/avatar.jpg" />
      <div>
        <h1>Tran Binh</h1>
        <div style="color:var(--muted);font-size:13px">Personal website</div>
      </div>
    </div>

    <ul class="nav">
      <li><a href="../index.html">🏠 Home</a></li>
      <li><a class="active" href="../tieng-anh.html">📘 Tiếng Anh</a></li>
      <li><a href="../cuoc-song.html">📝 Cuộc sống</a></li>
      <li><a href="../gallery.html">📷 Gallery</a></li>
      <li><a href="../about.html">👤 About me</a></li>
      <li><a href="../contact.html">✉️ Contact</a></li>
    </ul>

    <!-- Dark mode -->
    <div class="theme-switch-wrapper">
      <label class="theme-switch" for="darkToggle">
        <input type="checkbox" id="darkToggle">
        <span class="slider"></span>
      </label>
      <span id="themeLabel">🌙 Dark Mode</span>
    </div>
  </aside>
  
  <main class="main">
    <article class="article">
      <div id="content" class="md-content">
        Đang tải nội dung...
      </div>

      <footer class="post-footer">
        ← <a href="speaking.html">Quay lại Speaking</a>
      </footer>
    </article>
  </main>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const file = params.get("file");

  if (file) {
   fetch(`speaking/${file}`)
      .then(res => res.text())
      .then(md => {
        document.getElementById("content").innerHTML = marked.parse(md);
      })
      .catch(() => {
        document.getElementById("content").innerHTML =
          "<p>Không tải được nội dung.</p>";
      });
  } else {
    document.getElementById("content").innerHTML =
      "<p>Không có bài nào được chọn.</p>";
  }
</script>

<!-- Dark mode script -->
<script>
  const toggle = document.getElementById("darkToggle");
  const label = document.getElementById("themeLabel");
  const root = document.documentElement;

  if (localStorage.getItem("theme") === "dark") {
    root.classList.add("dark");
    toggle.checked = true;
    label.textContent = "☀️ Light Mode";
  }

  toggle.addEventListener("change", () => {
    root.classList.toggle("dark", toggle.checked);
    label.textContent = toggle.checked ? "☀️ Light Mode" : "🌙 Dark Mode";
    localStorage.setItem("theme", toggle.checked ? "dark" : "light");
  });
</script> 
</body>
</html>
