<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Tiến độ Grammar — Trần Bình</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="../css/styles.css">

  <style>
    .progress-bar {
      width: 100%;
      height: 14px;
      background: #e5e7eb;
      border-radius: 8px;
      overflow: hidden;
      margin: 10px 0 6px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg,#7c7cff,#c084fc);
      width: 0%;
      transition: width .4s;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 24px;
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      font-size: 15px;
    }
    th {
      background: #f8fafc;
      font-weight: 700;
    }
  </style>
</head>

<body>
<div class="wrapper">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <img src="../assets/avatar.jpg">
      <div>
        <h1>Tran Binh</h1>
        <div style="font-size:13px;color:var(--muted)">Personal website</div>
      </div>
    </div>

    <ul class="nav">
      <li><a href="../index.html">🏠 Home</a></li>
      <li><a class="active" href="../tieng-anh.html">📘 Tiếng Anh</a></li>
      <li><a href="../cuoc-song.html">📝 Cuộc sống</a></li>
      <li><a href="../gallery.html">📷 Gallery</a></li>
      <li><a href="../about.html">👤 About me</a></li>
      <li><a href="../contact.html">✉️ Contact</a></li>
    </ul>
  </aside>

  <!-- Main -->
  <main class="main">
    <article class="post">

      <header class="post-header">
        <h1>📊 Tiến độ Grammar</h1>
        <div class="post-meta">Theo dõi toàn bộ bài kiểm tra đã làm</div>
      </header>

      <!-- Tổng tiến độ -->
      <section>
        <h3>Tiến độ tổng</h3>
        <div class="progress-bar">
          <div class="progress-fill" id="totalBar"></div>
        </div>
        <div id="totalText" style="font-size:14px;color:#555"></div>
      </section>

      <!-- Bảng -->
      <table>
        <thead>
          <tr>
            <th>Thì</th>
            <th>Số lần</th>
            <th>Điểm cao nhất</th>
            <th>Gần nhất</th>
            <th>Đánh giá</th>
          </tr>
        </thead>
        <tbody id="progressBody">
          <tr><td colspan="5">Đang tải dữ liệu...</td></tr>
        </tbody>
      </table>

      <p style="margin-top:24px">
        ← <a href="grammar.html">Quay lại Grammar</a>
      </p>

    </article>
  </main>
</div>

<script>
(function () {

  const body = document.getElementById("progressBody");
  const bar  = document.getElementById("totalBar");
  const text = document.getElementById("totalText");

  const rows = [];
  let done = 0;

  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (!key.startsWith("quiz-progress-")) continue;

    const slug = key.replace("quiz-progress-", "");
    const data = JSON.parse(localStorage.getItem(key));

    done++;

    const percent = Math.round((data.best / data.total) * 100);
    let rating = "🟡 Trung bình";
    if (percent >= 80) rating = "🟢 Tốt";
    if (percent < 50) rating = "🔴 Yếu";

    rows.push(`
      <tr>
        <td>${slug.replace(/-/g," ").toUpperCase()}</td>
        <td>${data.attempts}</td>
        <td>${data.best}/${data.total}</td>
        <td>${data.last}/${data.total}</td>
        <td>${rating}</td>
      </tr>
    `);
  }

  if (rows.length === 0) {
    body.innerHTML = `<tr><td colspan="5">Chưa có dữ liệu làm bài.</td></tr>`;
    bar.style.width = "0%";
    text.innerText = "Chưa làm bài nào";
    return;
  }

  body.innerHTML = rows.join("");
  bar.style.width = Math.round(done / 13 * 100) + "%";
  text.innerText = `Đã hoàn thành ${done}/13 thì`;

})();
</script>

</body>
</html>
