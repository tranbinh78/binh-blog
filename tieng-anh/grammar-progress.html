<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tiến độ Grammar — Trần Bình</title>

  <link rel="stylesheet" href="../css/styles.css" />

  <style>
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      font-size: 15px;
    }

    th {
      background: #f8fafc;
      font-weight: 700;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      display: inline-block;
    }

    .good { background: #dcfce7; color: #166534; }
    .avg  { background: #fef9c3; color: #854d0e; }
    .bad  { background: #fee2e2; color: #991b1b; }

    .progress-wrap {
      margin: 24px 0;
    }

    .progress-bar {
      height: 14px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg,#6366f1,#8b5cf6);
      width: 0%;
      transition: width .5s ease;
    }
  </style>
</head>

<body>
<div class="wrapper">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <img src="../assets/avatar.jpg" alt="Avatar Tran Binh" />
      <div>
        <h1>Tran Binh</h1>
        <div style="color:var(--muted);font-size:13px">Personal website</div>
      </div>
    </div>

    <ul class="nav">
      <li><a href="../index.html">🏠 Home</a></li>
      <li><a class="active" href="../tieng-anh.html">📘 Tiếng Anh</a></li>
      <li><a href="../cuoc-song.html">📝 Cuộc sống</a></li>
      <li><a href="../gallery.html">📷 Gallery</a></li>
      <li><a href="../about.html">👤 About me</a></li>
      <li><a href="../contact.html">✉️ Contact</a></li>
    </ul>
  </aside>

  <!-- Main -->
  <main class="main">
    <article class="post">
      <header class="post-header">
        <h1 class="post-title">📊 Tiến độ Grammar</h1>
        <div class="post-meta">Theo dõi toàn bộ bài đã làm</div>
      </header>

      <!-- Tổng tiến độ -->
      <div class="progress-wrap">
        <b>Tiến độ tổng</b>
        <div class="progress-bar">
          <div class="progress-fill" id="totalProgress"></div>
        </div>
        <div id="progressText" style="margin-top:6px;font-size:14px"></div>
      </div>

      <!-- Table -->
      <table>
        <thead>
          <tr>
            <th>Thì</th>
            <th>Số lần làm</th>
            <th>Điểm cao nhất</th>
            <th>Gần nhất</th>
            <th>Đánh giá</th>
            <th>Hành động</th>
          </tr>
        </thead>
        <tbody id="progressTable">
          <tr>
            <td colspan="6">Đang tải dữ liệu...</td>
          </tr>
        </tbody>
      </table>

      <p style="margin-top:24px">
        ← <a href="grammar.html">Quay lại Grammar</a>
      </p>
    </article>
  </main>
</div>

<script>
(function () {

  const tbody = document.getElementById("progressTable");
  const progressFill = document.getElementById("totalProgress");
  const progressText = document.getElementById("progressText");

  const keys = Object.keys(localStorage)
    .filter(k => k.startsWith("quiz-progress-"));

  if (keys.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6">Chưa có dữ liệu làm bài.</td></tr>`;
    progressText.innerText = "Chưa làm bài nào";
    return;
  }

  let rows = "";
  let completed = 0;

  keys.forEach(key => {
    const slug = key.replace("quiz-progress-", "");
    const data = JSON.parse(localStorage.getItem(key));

    if (data.best > 0) completed++;

    let rating = "bad";
    let label = "Yếu";

    if (data.best >= 80) { rating = "good"; label = "Tốt"; }
    else if (data.best >= 50) { rating = "avg"; label = "Khá"; }

    rows += `
      <tr>
        <td>${slug.replace(/-/g," ").toUpperCase()}</td>
        <td>${data.attempts}</td>
        <td>${data.best}</td>
        <td>${data.last}</td>
        <td><span class="badge ${rating}">${label}</span></td>
        <td>
          <a href="quiz-viewer.html?quiz=${slug}">Làm lại</a>
        </td>
      </tr>
    `;
  });

  tbody.innerHTML = rows;

  const percent = Math.round((completed / keys.length) * 100);
  progressFill.style.width = percent + "%";
  progressText.innerText =
    `Hoàn thành ${completed}/${keys.length} bài (${percent}%)`;

})();
</script>

</body>
</html>
