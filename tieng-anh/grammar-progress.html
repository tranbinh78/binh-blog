<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>Tiến độ Grammar — Trần Bình</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <link rel="stylesheet" href="../css/styles.css" />

  <style>
    .progress-box {
      margin: 24px 0;
      padding: 16px;
      background: #f1f5ff;
      border-radius: 10px;
    }

    .bar {
      height: 12px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      margin: 10px 0;
    }

    .bar-fill {
      height: 100%;
      background: #7c6cff;
      width: 0%;
      transition: width 0.4s;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      font-size: 15px;
    }

    th, td {
      border-bottom: 1px solid #e5e7eb;
      padding: 10px;
      text-align: left;
    }

    th {
      background: #f8fafc;
    }
  </style>
</head>

<body>
<div class="wrapper">

  <!-- Sidebar giữ nguyên -->
  <aside class="sidebar">
    <div class="brand">
      <img src="../assets/avatar.jpg" alt="Avatar">
      <div>
        <h1>Tran Binh</h1>
        <div style="font-size:13px;color:#666">Personal website</div>
      </div>
    </div>

    <ul class="nav">
      <li><a href="../index.html">🏠 Home</a></li>
      <li><a class="active" href="../tieng-anh.html">📘 Tiếng Anh</a></li>
    </ul>
  </aside>

  <main class="main">
    <article class="post">

      <h1>📊 Tiến độ Grammar</h1>
      <p>Theo dõi toàn bộ bài kiểm tra đã làm</p>

      <div class="progress-box">
        <b>Tiến độ tổng</b>
        <div class="bar">
          <div class="bar-fill" id="total-bar"></div>
        </div>
        <div id="total-text">Chưa làm bài nào</div>
      </div>

      <table id="progress-table">
        <thead>
          <tr>
            <th>Thì</th>
            <th>Số lần làm</th>
            <th>Điểm cao nhất</th>
            <th>Gần nhất</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <p style="margin-top:30px;">
        ← <a href="grammar.html">Quay lại Grammar</a>
      </p>

    </article>
  </main>
</div>

<script>
const data = JSON.parse(localStorage.getItem("grammarProgress") || "{}");
const tbody = document.querySelector("#progress-table tbody");
const totalBar = document.getElementById("total-bar");
const totalText = document.getElementById("total-text");

const slugs = Object.keys(data);

if (slugs.length === 0) {
  tbody.innerHTML = `<tr><td colspan="4">Chưa có dữ liệu làm bài.</td></tr>`;
} else {
  let completed = 0;

  slugs.forEach(slug => {
    const p = data[slug];
    if (p.bestScore > 0) completed++;

    tbody.innerHTML += `
      <tr>
        <td>${slug.replace(/-/g," ").toUpperCase()}</td>
        <td>${p.attempts}</td>
        <td>${p.bestScore}</td>
        <td>${p.lastScore}</td>
      </tr>
    `;
  });

  const percent = Math.round((completed / slugs.length) * 100);
  totalBar.style.width = percent + "%";
  totalText.innerText =
    `Đã hoàn thành ${completed}/${slugs.length} bài (${percent}%)`;
}
</script>

</body>
</html>
