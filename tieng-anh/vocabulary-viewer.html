<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Vocabulary — Trần Bình</title>

  <!-- Main styles -->
  <link rel="stylesheet" href="../css/styles.css" />

  <!-- Markdown renderer -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
  /* ===== Vocabulary Markdown Styling ===== */

.md-content h1 {
  font-size: 30px;
  margin-top: 24px;
}

.md-content h2 {
  font-size: 24px;
  margin-top: 36px;
  border-bottom: 2px solid #e5e7eb;
  padding-bottom: 6px;
}

.md-content h3 {
  font-size: 20px;
  margin-top: 28px;
}

.md-content p {
  font-size: 17px;
  line-height: 1.75;
  margin: 14px 0;
}

.md-content ul {
  margin: 12px 0 20px 22px;
}

.md-content li {
  margin-bottom: 6px;
}

/* ===== TABLE (Vocabulary) ===== */
.md-content table {
  width: 100%;
  border-collapse: collapse;
  margin: 18px 0 26px;
  font-size: 16px;
}

.md-content th {
  background: #eef2ff;
  padding: 10px;
  text-align: left;
  border-bottom: 2px solid #c7d2fe;
}

.md-content td {
  padding: 10px;
  border-bottom: 1px solid #e5e7eb;
  vertical-align: top;
}

.md-content tr:hover {
  background: #f9fafb;
}

/* ===== SECTION DIVIDER ===== */
.md-content hr {
  margin: 36px 0;
  border: none;
  border-top: 1px solid #e5e7eb;
}

/* ===== QUIZ BUTTON ===== */
.vocab-quiz-btn {
  display: inline-block;
  margin: 48px auto 16px;
  padding: 14px 28px;
  background: #c9b3ff;
  color: #000;
  font-weight: 700;
  font-size: 16px;
  border-radius: 12px;
  text-decoration: none;
  text-align: center;
}

.vocab-quiz-btn:hover {
  opacity: 0.9;
}
       
  </style>
</head>

<body>
  <div class="wrapper">

    <!-- Sidebar (MENU THỐNG NHẤT) -->
    <aside class="sidebar">
      <div class="brand">
        <img src="../assets/avatar.jpg" alt="Avatar Tran Binh" />
        <div>
          <h1>Tran Binh</h1>
          <div style="color:var(--muted);font-size:13px">Personal website</div>
        </div>
      </div>

      <ul class="nav">
        <li><a href="../index.html">🏠 Home</a></li>
        <li><a class="active" href="../tieng-anh.html">📘 Tiếng Anh</a></li>
        <li><a href="../cuoc-song.html">📝 Cuộc sống</a></li>
        <li><a href="../gallery.html">📷 Gallery</a></li>
        <li><a href="../about.html">👤 About me</a></li>
        <li><a href="../contact.html">✉️ Contact</a></li>
      </ul>
    </aside>

    <!-- Main content -->
    <main class="main">
      <article class="post">

        <!-- Markdown content -->
        <div class="post-content md-content" id="content">
          Đang tải nội dung...
        </div>

        <!-- Back -->
        <footer class="post-footer">
          <p class="post-back">
            ← <a href="tieng-anh/vocabulary.html">Quay lại Vocabulary</a>
          </p>
        </footer>

      </article>
    </main>

  </div>

<!-- Script -->
<script>
  const params = new URLSearchParams(window.location.search);
const file = params.get("file");

function getSlug() {
  if (!file) return "";
  return file.split("/").pop().replace(".md", "");
}

if (!file) {
  document.getElementById("content").innerText =
    "Không có file được chỉ định.";
} else {
  fetch("../" + file)
    .then(res => {
      if (!res.ok) throw new Error("Not found");
      return res.text();
    })
    .then(md => {
      const content = document.getElementById("content");

      // Render Markdown
      content.innerHTML = marked.parse(md);

      // Quiz button
      injectVocabularyQuiz();

      // Progress box (nếu có)
      injectProgressInfo();

      // Title
      const slug = getSlug();
      document.getElementById("page-title").innerText =
        slug.replace(/-/g, " ").toUpperCase();
    })
    .catch(() => {
      document.getElementById("content").innerText =
        "Không thể tải nội dung Markdown.";
    });
}

function injectVocabularyQuiz() {
  const slug = getSlug();
  if (!slug) return;

  const btn = document.createElement("div");
  btn.style.textAlign = "center";

  btn.innerHTML = `
    <a class="vocab-quiz-btn"
       href="../quiz-viewer.html?quiz=vocab-${slug}">
      🧠 Làm bài kiểm tra Vocabulary
    </a>
  `;

  document.getElementById("content").appendChild(btn);
}

function injectProgressInfo() {
  const slug = getSlug();
  const raw = localStorage.getItem(`vocab-progress-${slug}`);
  if (!raw) return;

  const data = JSON.parse(raw);

  const box = document.createElement("div");
  box.style = `
    margin:32px 0;
    padding:16px 18px;
    background:#f1f5ff;
    border-left:4px solid #7c7cff;
    border-radius:8px;
    font-size:15px;
  `;

  box.innerHTML = `
    <b>📊 Tiến độ bài này</b><br>
    • Số lần làm: <b>${data.attempts}</b><br>
    • Điểm cao nhất: <b>${data.best}</b><br>
    • Điểm gần nhất: <b>${data.last}</b>
  `;

  document.getElementById("content").appendChild(box);
}
  
</script>

</body>
</html>
