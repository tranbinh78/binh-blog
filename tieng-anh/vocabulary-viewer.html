<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Vocabulary — Trần Bình</title>

  <!-- Main styles -->
  <link rel="stylesheet" href="css/styles.css" />

  <!-- Markdown renderer -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    /* Markdown content styling */
    .md-content h1, 
    .md-content h2, 
    .md-content h3 {
      margin-top: 28px;
    }

    .md-content p {
      font-size: 18px;
      line-height: 1.8;
      margin: 16px 0;
    }

    .md-content ul {
      margin-left: 20px;
      margin-bottom: 16px;
    }

    .md-content li {
      margin-bottom: 6px;
    }

    .md-content pre {
      background: #0f172a;
      color: #e5e7eb;
      padding: 16px;
      border-radius: 8px;
      overflow-x: auto;
    }

    .md-content code {
      background: rgba(0,0,0,0.08);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 90%;
    }

    .dark .md-content code {
      background: rgba(255,255,255,0.1);
    }
  </style>
</head>

<body>
  <div class="wrapper">

    <!-- Sidebar (MENU THỐNG NHẤT) -->
    <aside class="sidebar">
      <div class="brand">
        <img src="assets/avatar.jpg" alt="Avatar Tran Binh" />
        <div>
          <h1>Tran Binh</h1>
          <div style="color:var(--muted);font-size:13px">Personal website</div>
        </div>
      </div>

      <ul class="nav">
        <li><a href="index.html">🏠 Home</a></li>
        <li><a class="active" href="tieng-anh.html">📘 Tiếng Anh</a></li>
        <li><a href="cuoc-song.html">📝 Cuộc sống</a></li>
        <li><a href="gallery.html">📷 Gallery</a></li>
        <li><a href="about.html">👤 About me</a></li>
        <li><a href="contact.html">✉️ Contact</a></li>
      </ul>
    </aside>

    <!-- Main content -->
    <main class="main">
      <article class="post">

        <!-- Header -->
        <header class="post-header">
          <h1 class="post-title" id="page-title">Vocabulary</h1>
          <div class="post-meta">
          Vocabulary - Từ vựng
          </div>
        </header>

        <!-- Markdown content -->
        <div class="post-content md-content" id="content">
          Đang tải nội dung...
        </div>

        <!-- Back -->
        <footer class="post-footer">
          <p class="post-back">
            ← <a href="tieng-anh/Vocabulary.html">Quay lại Vocabulary</a>
          </p>
        </footer>

      </article>
    </main>

  </div>

  <!-- Script -->
<script>
  const params = new URLSearchParams(window.location.search);
  const file = params.get("file");

  function getSlug() {
    if (!file) return null;
    return file.split("/").pop().replace(".md", "");
  }

  function injectVocabQuizButton() {
  const slug = getSlug();
  if (!slug) return;

  const content = document.getElementById("content");

  const wrapper = document.createElement("div");
  wrapper.style = "margin:48px 0;text-align:center";

  wrapper.innerHTML = `
    <a href="quiz-viewer.html?quiz=vocab-${slug}"
       style="
         background:#c9b3ff;
         padding:14px 26px;
         border-radius:10px;
         font-size:16px;
         font-weight:700;
         text-decoration:none;
         display:inline-block;
         color:#000;">
      📝 Làm bài kiểm tra Vocabulary
    </a>
  `;

  content.appendChild(wrapper);
}

  if (!file) {
    document.getElementById("content").innerText =
      "Không có file được chỉ định.";
  } else {
    fetch(file)
      .then(res => {
        if (!res.ok) throw new Error("Not found");
        return res.text();
      })
      .then(md => {
      const content = document.getElementById("content");

      // 1. Render Markdown
        content.innerHTML = marked.parse(md);

      // 2. Gắn nút làm bài kiểm tra
       injectVocabQuizButton();

      // 3. Gắn thông tin tiến độ (nếu có)
        injectProgressInfo();

      // 4. Đặt lại tiêu đề trang
        const name = getSlug();
        document.getElementById("page-title").innerText =
        name.replace(/-/g, " ").toUpperCase();
        })
      .catch(() => {
        document.getElementById("content").innerText =
          "Không thể tải nội dung Markdown.";
      });
  }

 function injectProgressInfo() {
    const slug = getSlug();
    if (!slug) return;

    const key = `vocab-progress-${slug}`;
    const raw = localStorage.getItem(key);
    if (!raw) return;

    const data = JSON.parse(raw);

    const box = document.createElement("div");
    box.style = `
      margin:32px 0;
      padding:16px 18px;
      background:#f1f5ff;
      border-left:4px solid #7c7cff;
      border-radius:8px;
      font-size:15px;
    `;

    box.innerHTML = `
      <b>📊 Tiến độ bài này</b><br>
      • Số lần làm: <b>${data.attempts}</b><br>
      • Điểm cao nhất: <b>${data.best}</b><br>
      • Điểm gần nhất: <b>${data.last}</b>
    `;

    document.getElementById("content").appendChild(box);
  }
  
</script>

</body>
</html>
