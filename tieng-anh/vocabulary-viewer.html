<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vocabulary — Trần Bình</title>

  <link rel="stylesheet" href="../css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    .md-content h1 { font-size:30px; margin-top:24px }
    .md-content h2 { font-size:24px; margin-top:36px; border-bottom:2px solid #e5e7eb }
    .md-content h3 { font-size:20px; margin-top:28px }
    .md-content p  { font-size:17px; line-height:1.75 }
    .md-content table { width:100%; border-collapse:collapse; margin:20px 0 }
    .md-content th, .md-content td { padding:10px; border-bottom:1px solid #e5e7eb }
    .vocab-quiz-btn {
      display:inline-block;
      margin:40px auto;
      padding:14px 28px;
      background:#c9b3ff;
      color:#000;
      font-weight:700;
      border-radius:12px;
      text-decoration:none;
    }
    .vocab-quiz-btn:hover {
      background: #b39cff;
  }
  </style>
</head>

<body>
<div class="wrapper">

  <aside class="sidebar">
    <div class="brand">
      <img src="../assets/avatar.jpg" />
      <div>
        <h1>Tran Binh</h1>
        <div style="color:var(--muted);font-size:13px">Personal website</div>
      </div>
    </div>

    <ul class="nav">
      <li><a href="../index.html">🏠 Home</a></li>
      <li><a class="active" href="../tieng-anh.html">📘 Tiếng Anh</a></li>
      <li><a href="../cuoc-song.html">📝 Cuộc sống</a></li>
      <li><a href="../gallery.html">📷 Gallery</a></li>
      <li><a href="../about.html">👤 About me</a></li>
      <li><a href="../contact.html">✉️ Contact</a></li>
    </ul>
  </aside>

  <main class="main">
    <article class="post">

      <!-- QUAN TRỌNG: element này PHẢI TỒN TẠI -->
      <header class="post-header">
        <h1 id="page-title">Vocabulary</h1>
      </header>

      <div id="content" class="post-content md-content">
        Đang tải nội dung...
      </div>

      <footer class="post-footer">
      ← <a href="../tieng-anh/vocabulary.html">Quay lại Vocabulary</a>
      </footer>
      
     </article>
  </main>

</div>

<script>
  const params = new URLSearchParams(window.location.search);
const file = params.get("file");

if (!file) {
  document.getElementById("content").innerText =
    "Không có file được chỉ định.";
} else {
  fetch(`./${file}`)
    .then(res => {
      if (!res.ok) throw new Error("404");
      return res.text();
    })
    .then(md => {
      const content = document.getElementById("content");
      content.innerHTML = marked.parse(md);

      const slug = file.split("/").pop().replace(".md", "");
      document.getElementById("page-title").innerText =
        slug.replace(/-/g, " ").toUpperCase();

      if (!document.querySelector(".vocab-quiz-btn")) {
        content.insertAdjacentHTML("beforeend", `
          <div style="text-align:center; margin-top:40px">
            <a class="vocab-quiz-btn"
               href="vocab-quiz.html?topic=${slug}">
              🧠 Làm bài kiểm tra Vocabulary
            </a>
          </div>
        `);
      }
    })
    .catch(err => {
      console.error(err);
      document.getElementById("content").innerText =
        "Không thể tải nội dung Markdown.";
    });
}
</script>

</body>
</html>
