<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>English Lesson | Trần Bình</title>

  <!-- CSS dùng chung -->
  <link rel="stylesheet" href="../css/styles.css" />

  <!-- Markdown renderer -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
<div class="wrapper">

  <!-- Sidebar (GIỮ GIỐNG speaking-viewer.html) -->
  <aside class="sidebar">
    <div class="brand">
      <img src="../assets/avatar.jpg" alt="Avatar Tran Binh" />
      <div>
        <h1>Tran Binh</h1>
        <div style="color:var(--muted);font-size:13px">Personal website</div>
      </div>
    </div>

    <ul class="nav">
      <li><a href="../index.html">🏠 Home</a></li>
      <li><a class="active" href="../tieng-anh.html">📘 Tiếng Anh</a></li>
      <li><a href="../cuoc-song.html">📝 Cuộc sống</a></li>
      <li><a href="../gallery.html">📷 Gallery</a></li>
      <li><a href="../about.html">👤 About me</a></li>
      <li><a href="../contact.html">✉️ Contact</a></li>
    </ul>

    <!-- Dark mode -->
    <div class="theme-switch-wrapper">
      <label class="theme-switch" for="darkToggle">
        <input type="checkbox" id="darkToggle">
        <span class="slider"></span>
      </label>
      <span id="themeLabel">🌙 Dark Mode</span>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">

    <!-- Header -->
    <div class="header-row">
      <div>
        <h2 class="site-title" id="lesson-title">English Lesson</h2>
        <p class="lead" id="lesson-desc">
          Bài học tiếng Anh theo lộ trình A1.
        </p>
      </div>
    </div>

    <!-- Lesson content -->
    <section class="article">
      <div id="lesson-content" class="md-content">
        <!-- Markdown sẽ được render ở đây -->
      </div>
    </section>

    <div class="lesson-nav">
        <a id="prevLesson" class="lesson-nav-btn">← Bài trước</a>

        <span id="lessonCounter" class="lesson-counter">
          Bài -- / --
        </span
          
        <a id="nextLesson" class="lesson-nav-btn">Bài tiếp theo →</a>
    </div>
    <!-- Footer navigation -->
    <div style="margin-top:32px; display:flex; gap:12px;">
      <a href="english-lessons.html" class="btn-secondary">← Quay lại lộ trình</a>
    </div>

  </main>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const lesson = params.get("file");

  const contentEl = document.getElementById("lesson-content");
  const titleEl = document.getElementById("lesson-title");

  function setupLessonNavA1(lesson) {
  const prevBtn = document.getElementById("prevLesson");
  const nextBtn = document.getElementById("nextLesson");
  const counter = document.getElementById("lessonCounter");

  if (!prevBtn || !nextBtn || !counter) return;

  const match = lesson.match(/^A1\.(\d+)$/);
  if (!match) return;

  const current = parseInt(match[1], 10);
  const min = 1;
  const max = 40;

  counter.textContent = `Bài ${current} / ${max}`;

  if (current > min) {
    prevBtn.href = `english-lesson-viewer.html?file=A1.${current - 1}`;
  } else {
    prevBtn.classList.add("disabled");
  }

  if (current < max) {
    nextBtn.href = `english-lesson-viewer.html?file=A1.${current + 1}`;
  } else {
    nextBtn.classList.add("disabled");
  }
}
  
  if (!lesson) {
    contentEl.innerHTML = "<p>Không tìm thấy bài học.</p>";
  } else {
    const filePath = `lessons/${lesson}.md`;

    fetch(filePath)
      .then(res => {
        if (!res.ok) throw new Error("File not found");
        return res.text();
      })
      .then(md => {
        document.getElementById("lesson-content").innerHTML =
        marked.parse(md);

        setupLessonNavA1(lesson);

        // Lấy H1 làm tiêu đề
        const h1 = contentEl.querySelector("h1");
        if (h1) titleEl.textContent = h1.textContent;

        // ===== SAVE PROGRESS (CHỈ KHI LOAD THÀNH CÔNG) =====
        const progress = JSON.parse(localStorage.getItem("lessonProgress") || "{}");
        progress[lesson] = true;
        localStorage.setItem("lessonProgress", JSON.stringify(progress));
      })
      .catch(() => {
        contentEl.innerHTML = "<p>Không tải được nội dung bài học.</p>";
      });
  }
</script>
  
<!-- Dark mode script -->
<script>
  const toggle = document.getElementById("darkToggle");
  const label = document.getElementById("themeLabel");
  const root = document.documentElement;

  if (localStorage.getItem("theme") === "dark") {
    root.classList.add("dark");
    toggle.checked = true;
    label.textContent = "☀️ Light Mode";
  }

  toggle.addEventListener("change", () => {
    root.classList.toggle("dark", toggle.checked);
    label.textContent = toggle.checked ? "☀️ Light Mode" : "🌙 Dark Mode";
    localStorage.setItem("theme", toggle.checked ? "dark" : "light");
  });
</script>
</body>
</html>
