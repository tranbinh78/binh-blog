<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Grammar Test | Binh Blog</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background:#faf9f4;
  margin:0;
  padding:20px;
}

.wrapper{
  max-width:900px;
  margin:auto;
  background:#fff;
  padding:24px;
  border-radius:12px;
  box-shadow:0 8px 20px rgba(0,0,0,.08);
}

h1{ margin-top:0; }

.controls{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:20px;
}

select, button{
  padding:10px 14px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:15px;
}

button{
  cursor:pointer;
  font-weight:600;
  background:#d9c6ff;
}

button.secondary{
  background:#eee;
}

button.success{
  background:#b9ffb4;
}

.question{
  margin-bottom:20px;
  padding:16px;
  border-radius:10px;
  border:1px solid #eee;
  background:#fafafa;
}

.choice{
  display:block;
  padding:8px 10px;
  border-radius:6px;
  margin-top:6px;
  border:1px solid #ddd;
  cursor:pointer;
}

.correct{ background:#d4ffd9; }
.wrong{ background:#ffd9d9; }

.explain{
  display:none;
  margin-top:10px;
  padding:10px;
  background:#f4f4f4;
  border-radius:6px;
}

#result{
  margin-top:20px;
  font-size:18px;
  font-weight:700;
}
</style>
</head>

<body>

  
  
<div class="wrapper">
<!-- Dark mode -->
    <div class="theme-switch-wrapper">
      <label class="theme-switch" for="darkToggle">
        <input type="checkbox" id="darkToggle">
        <span class="slider"></span>
      </label>
      <span id="themeLabel">🌙 Dark Mode</span>
    </div>
<h1>📝 Grammar Test</h1>
<p>Chọn nhóm ngữ pháp và bắt đầu làm bài kiểm tra.</p>

<div class="controls">
  <select id="group">
    <option value="">-- Chọn nhóm --</option>
    <option value="present">Present Tenses</option>
    <option value="past">Past Tenses</option>
    <option value="future">Future Tenses</option>
    <option value="conditionals">Conditionals</option>
    <option value="modal">Modal Verbs</option>
    <option value="verbs">Verb Forms</option>
    <option value="all-grammar">All Grammar</option>
  </select>

  <select id="limit">
    <option value="10">10 câu</option>
    <option value="20" selected>20 câu</option>
    <option value="40">40 câu</option>
    <option value="60">60 câu</option>
  </select>

  <button id="start">Bắt đầu</button>
  <button id="submit" class="success" style="display:none">Nộp bài</button>
  <button id="retry" class="secondary" style="display:none">Làm lại</button>
</div>

<div id="questions"></div>
<div id="result"></div>

<p style="margin-top:30px">
  ← <a href="/binh-blog/tieng-anh.html">Quay lại Tiếng Anh</a>
</p>

</div>

<script>
const startBtn  = document.getElementById("start");
const submitBtn = document.getElementById("submit");
const retryBtn  = document.getElementById("retry");
const questionsDiv = document.getElementById("questions");
const resultDiv = document.getElementById("result");

let questions = [];

/* =============================
   LOAD QUESTIONS BY GROUP
============================= */
async function loadGroup(group, limit){
  const res = await fetch("/binh-blog/grammar/quiz/test-groups.json");
  const groups = await res.json();

  if(!groups[group]) throw "Nhóm không tồn tại";

  let pool = [];

  for(const slug of groups[group]){
    const r = await fetch(`/binh-blog/grammar/quiz/${slug}.json`);
    if(!r.ok) continue;
    const data = await r.json();

    data.questions.forEach(q=>{
      pool.push(q);
    });
  }

  pool.sort(()=>Math.random()-0.5);
  return pool.slice(0, limit);
}

/* =============================
   RENDER
============================= */
function render(){
  questionsDiv.innerHTML = "";
  resultDiv.innerHTML = "";

  questions.forEach((q,i)=>{
    const div = document.createElement("div");
    div.className = "question";
    div.dataset.index = i;

    div.innerHTML = `
      <b>${i+1}. ${q.question}</b>
      ${q.choices.map((c,ci)=>`
        <label class="choice">
          <input type="radio" name="q${i}" value="${ci}">
          ${String.fromCharCode(65+ci)}. ${c}
        </label>
      `).join("")}
      <div class="explain"><b>Giải thích:</b> ${q.explanation}</div>
    `;

    questionsDiv.appendChild(div);
  });

  submitBtn.style.display = "inline-block";
}

/* =============================
   START
============================= */
startBtn.onclick = async ()=>{
  const group = document.getElementById("group").value;
  if(!group){ alert("Hãy chọn nhóm"); return; }

  const limit = parseInt(document.getElementById("limit").value,10);

  questions = await loadGroup(group, limit);
  render();
};

/* =============================
   SUBMIT
============================= */
submitBtn.onclick = ()=>{
  let correct = 0;

  questions.forEach((q,i)=>{
    const box = document.querySelector(`[data-index="${i}"]`);
    const radios = box.querySelectorAll("input");
    const labels = box.querySelectorAll(".choice");
    const exp = box.querySelector(".explain");

    let picked = -1;
    radios.forEach(r=>{ if(r.checked) picked = +r.value; });

    labels.forEach(l=>l.classList.remove("correct","wrong"));

    labels[q.answer].classList.add("correct");
    if(picked !== q.answer && picked !== -1){
      labels[picked].classList.add("wrong");
    }

    if(picked === q.answer) correct++;
    exp.style.display = "block";
  });

  const score = Math.round(correct / questions.length * 100);
  resultDiv.innerHTML = `✅ ${correct}/${questions.length} câu đúng — ${score}%`;

  submitBtn.style.display = "none";
  retryBtn.style.display = "inline-block";
};

/* =============================
   RETRY
============================= */
retryBtn.onclick = ()=>{
  startBtn.click();
};
</script>

<!-- Dark mode script -->
<script>
  const toggle = document.getElementById("darkToggle");
  const label = document.getElementById("themeLabel");
  const root = document.documentElement;

  if (localStorage.getItem("theme") === "dark") {
    root.classList.add("dark");
    toggle.checked = true;
    label.textContent = "☀️ Light Mode";
  }

  toggle.addEventListener("change", () => {
    root.classList.toggle("dark", toggle.checked);
    label.textContent = toggle.checked ? "☀️ Light Mode" : "🌙 Dark Mode";
    localStorage.setItem("theme", toggle.checked ? "dark" : "light");
  });
</script>
  
</body>
</html>
