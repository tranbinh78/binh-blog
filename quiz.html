<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quiz | Binh Blog</title>

  <style>
    body {
      font-family: "Be Vietnam Pro", sans-serif;
      background:#fafafa;
      padding:20px;
      max-width:900px;
      margin:auto;
      line-height:1.7;
    }

    h1 {
      margin-bottom:5px;
    }

    .question-box {
      background:#fff;
      padding:20px;
      margin-bottom:25px;
      border-radius:12px;
      border:1px solid #ddd;
    }

    .answers button {
      display:block;
      width:100%;
      text-align:left;
      padding:12px 14px;
      margin-top:8px;
      border-radius:8px;
      border:1px solid #ccc;
      background:#f7f7f7;
      cursor:pointer;
      transition:0.2s;
      font-size:16px;
    }

    .answers button:hover {
      background:#f0f0ff;
    }

    .correct {
      background:#d4ffd4 !important;
      border-color:#4caf50 !important;
    }

    .wrong {
      background:#ffd4d4 !important;
      border-color:#ff0000 !important;
    }

    #result-box {
      padding:20px;
      background:#fff3c4;
      border-left:6px solid #ffc400;
      border-radius:8px;
      margin-top:20px;
      display:none;
    }

    #restart-btn {
      margin-top:20px;
      padding:12px 18px;
      border-radius:8px;
      background:#d9d1ff;
      border:1px solid #bcb0ff;
      cursor:pointer;
      font-size:16px;
      font-weight:bold;
      display:none;
    }
  </style>
</head>
<body>

<h1 id="quiz-title">Bài tập trắc nghiệm</h1>
<p id="quiz-desc"></p>

<div id="quiz-container"></div>

<div id="result-box"></div>
<button id="restart-btn">Làm lại</button>

<!-- Load dữ liệu 12 thì -->
<script src="/binh-blog/quiz-data.js"></script>

<script>
/* ============================================
   1. LẤY TYPE (thì) TỪ URL
============================================ */

const params = new URLSearchParams(window.location.search);
const type = params.get("type");

/* QUIZ_DATABASE được load từ quiz-data.js */
const rawData = QUIZ_DATABASE[type];

let quizObject = null;

// Nếu người dùng nhập type sai → thông báo lỗi
if (!rawData) {
  document.getElementById("quiz-title").innerText = "Không tìm thấy bài tập!";
  document.getElementById("quiz-desc").innerText =
    "Bài '" + type + "' chưa được tạo trong quiz-data.js.";
} else {

  /* ============================================
     2. CHUẨN HÓA DỮ LIỆU TỰ ĐỘNG
     rawData = mảng 20 câu
     hoặc rawData = object {title, desc, questions}
  ============================================= */

  if (Array.isArray(rawData)) {
    // Trường hợp bạn tạo dữ liệu bằng cách gán array (20 câu / thì)
    quizObject = {
      title: "Bài tập – " + type.replace(/-/g, " ").toUpperCase(),
      desc: "Chọn đáp án đúng cho bài tập.",
      questions: rawData
    };
  } else {
    quizObject = rawData;
  }

  // Hiển thị tiêu đề
  document.getElementById("quiz-title").innerText = quizObject.title;
  document.getElementById("quiz-desc").innerText = quizObject.desc;

  // Render quiz
  loadQuiz(quizObject.questions);
}

let score = 0;
let currentQuestions = [];

/* ============================================
   3. HIỂN THỊ CÂU HỎI
============================================ */

function loadQuiz(questions) {
  score = 0;
  currentQuestions = questions;

  const container = document.getElementById("quiz-container");
  container.innerHTML = "";

  questions.forEach((q, index) => {
    const box = document.createElement("div");
    box.className = "question-box";

    let html = `<p><strong>${q.question}</strong></p><div class="answers">`;

    q.options.forEach((ans, i) => {
      html += `<button onclick="checkAnswer(${index}, ${i}, this)">${ans}</button>`;
    });

    html += `</div><p id="explain-${index}" style="display:none; margin-top:10px; color:#333;"></p>`;

    box.innerHTML = html;
    container.appendChild(box);
  });
}

/* ============================================
   4. KIỂM TRA ĐÁP ÁN
============================================ */

function checkAnswer(qIndex, ansIndex, btn) {
  const correct = currentQuestions[qIndex].answer;

  const buttons = btn.parentNode.querySelectorAll("button");
  buttons.forEach(b => b.disabled = true);

  if (ansIndex === correct) {
    btn.classList.add("correct");
    score++;
  } else {
    btn.classList.add("wrong");
    buttons[correct].classList.add("correct");
  }

  document.getElementById("explain-" + qIndex).innerHTML =
    "➡ " + currentQuestions[qIndex].explain;
  document.getElementById("explain-" + qIndex).style.display = "block";

  if (qIndex === currentQuestions.length - 1) finishQuiz();
}

/* ============================================
   5. HIỂN THỊ KẾT QUẢ
============================================ */

function finishQuiz() {
  const box = document.getElementById("result-box");
  box.style.display = "block";

  box.innerHTML =
    `<h3>Kết quả: ${score}/${currentQuestions.length}</h3>
     <p>Chúc bạn học tốt! ❤️</p>`;

  document.getElementById("restart-btn").style.display = "block";
}

document.getElementById("restart-btn").onclick = () => {
  loadQuiz(currentQuestions);
  document.getElementById("result-box").style.display = "none";
  document.getElementById("restart-btn").style.display = "none";
};
</script>

</body>
</html>
