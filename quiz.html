<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Quiz | Binh Blog</title>

  <style>
    body {
      font-family: "Be Vietnam Pro", sans-serif;
      background:#fafafa;
      padding:20px;
      max-width:900px;
      margin:auto;
      line-height:1.7;
    }
    .question-box {
      background:#fff;
      padding:20px;
      margin-bottom:25px;
      border-radius:12px;
      border:1px solid #ddd;
    }
    .answers button {
      display:block;
      width:100%;
      text-align:left;
      padding:12px 14px;
      margin-top:8px;
      border-radius:8px;
      border:1px solid #ccc;
      background:#f7f7f7;
      cursor:pointer;
      transition:0.2s;
      font-size:16px;
    }
    .answers button:hover { background:#f0f0ff; }
    .correct { background:#d4ffd4 !important; border-color:#4caf50 !important; }
    .wrong { background:#ffd4d4 !important; border-color:#ff0000 !important; }

    #result-box {
      padding:20px;
      background:#fff3c4;
      border-left:6px solid #ffc400;
      border-radius:8px;
      margin-top:20px;
      display:none;
    }
    #restart-btn {
      margin-top:20px;
      padding:12px 18px;
      border-radius:8px;
      background:#d9d1ff;
      border:1px solid #bcb0ff;
      cursor:pointer;
      font-size:16px;
      font-weight:bold;
      display:none;
    }
  </style>
</head>

<body>

<h1 id="quiz-title">Bài tập</h1>
<p id="quiz-desc"></p>

<div id="quiz-container"></div>

<div id="result-box"></div>
<button id="restart-btn">Làm lại</button>

<!-- Load dữ liệu quiz -->
<script src="/binh-blog/quiz-data.js"></script>

<script>
/* ======================
   1. LẤY LOẠI QUIZ
====================== */
const params = new URLSearchParams(window.location.search);
const type = params.get("type");

/* ======================
   2. LẤY DỮ LIỆU THEO TYPE
====================== */
const quiz = window.quizData?.[type];
let score = 0;

if (!quiz) {
  document.getElementById("quiz-title").innerText = "Chưa có bài tập cho phần này!";
  document.getElementById("quiz-desc").innerText = "Vui lòng kiểm tra lại URL.";
} else {
  document.getElementById("quiz-title").innerText = quiz.title;
  document.getElementById("quiz-desc").innerText = quiz.desc;
  loadQuiz(quiz.questions);
}

/* ======================
   3. HIỂN THỊ CÂU HỎI
====================== */
function loadQuiz(questions) {
  score = 0;
  const container = document.getElementById("quiz-container");
  container.innerHTML = "";
  window.currentQuestions = questions;

  questions.forEach((q, index) => {

    // ====== SHUFFLE OPTIONS ======
    const opts = q.options.map((opt, i) => ({
        text: opt,
        isCorrect: i === q.answer
    }));

    // Fisher-Yates shuffle
    for (let i = opts.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [opts[i], opts[j]] = [opts[j], opts[i]];
    }

    // SAVE back shuffled options + new correct index
    const shuffledOptions = opts.map(o => o.text);
    const newCorrectIndex = opts.findIndex(o => o.isCorrect);

    // ====== RENDERING ======
    const box = document.createElement("div");
    box.className = "question-box";

    let html = `<p><strong>${index+1}. ${q.question}</strong></p><div class="answers">`;

    shuffledOptions.forEach((ans, i) => {
      html += `<button onclick="checkAnswer(${index}, ${i}, this)">${ans}</button>`;
    });

    html += `</div><p id="explain-${index}" style="display:none; margin-top:10px; color:#444;"></p>`;

    // Lưu lại index đúng mới
    if (!window.correctMap) window.correctMap = {};
    window.correctMap[index] = newCorrectIndex;

    box.innerHTML = html;
    container.appendChild(box);
});
}

/* ======================
   4. KIỂM TRA ĐÁP ÁN
====================== */
function checkAnswer(qIndex, ansIndex, btn) {
  const correct = window.correctMap[qIndex];

  const buttons = btn.parentNode.querySelectorAll("button");
  buttons.forEach(b => b.disabled = true);

  if (ansIndex === correct) {
    btn.classList.add("correct");
    score++;
  } else {
    btn.classList.add("wrong");
    buttons[correct].classList.add("correct");
  }

  const exp = document.getElementById("explain-" + qIndex);
  exp.innerHTML = "➡ " + currentQuestions[qIndex].explain;
  exp.style.display = "block";

  if (qIndex === currentQuestions.length - 1) finishQuiz();
}

/* ======================
   5. HIỆN KẾT QUẢ
====================== */
function finishQuiz() {
  const box = document.getElementById("result-box");
  box.innerHTML = `<h3>Kết quả: ${score}/${currentQuestions.length}</h3>
                   <p>Bạn đã hoàn thành bài kiểm tra!</p>`;
  box.style.display = "block";

  document.getElementById("restart-btn").style.display = "block";
}

document.getElementById("restart-btn").onclick = () => {
  loadQuiz(currentQuestions);
  document.getElementById("result-box").style.display = "none";
  document.getElementById("restart-btn").style.display = "none";
};
</script>

</body>
</html>
