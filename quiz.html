<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quiz | Binh Blog</title>
  <style>
    body {
      font-family: "Be Vietnam Pro", sans-serif;
      background:#fafafa;
      padding:20px;
      max-width:900px;
      margin:auto;
      line-height:1.7;
    }

    .question-box {
      background:#fff;
      padding:20px;
      margin-bottom:25px;
      border-radius:12px;
      border:1px solid #ddd;
    }

    .answers button {
      display:block;
      width:100%;
      text-align:left;
      padding:12px 14px;
      margin-top:8px;
      border-radius:8px;
      border:1px solid #ccc;
      background:#f7f7f7;
      cursor:pointer;
      transition:0.2s;
      font-size:16px;
    }

    .answers button:hover {
      background:#f0f0ff;
    }

    .correct {
      background:#d4ffd4 !important;
      border-color:#4caf50 !important;
    }

    .wrong {
      background:#ffd4d4 !important;
      border-color:#ff0000 !important;
    }

    #result-box {
      padding:20px;
      background:#fff3c4;
      border-left:6px solid #ffc400;
      border-radius:8px;
      margin-top:20px;
      display:none;
    }

    #restart-btn {
      margin-top:20px;
      padding:12px 18px;
      border-radius:8px;
      background:#d9d1ff;
      border:1px solid #bcb0ff;
      cursor:pointer;
      font-size:16px;
      font-weight:bold;
    }
  </style>
</head>
<body>

<h1>Bài tập trắc nghiệm</h1>
<p>Chọn đáp án đúng cho từng câu.</p>

<div id="quiz-container"></div>

<div id="result-box"></div>
<button id="restart-btn" style="display:none;">Làm lại</button>

<script>
const quizData = [
  {
    question: "1. The sun ______ in the east.",
    answers: ["rise", "rises", "is rising", "rose"],
    correct: 1,
    explain: "Sự thật hiển nhiên → dùng Present Simple: rises."
  },
  {
    question: "2. She ______ usually go to school by bus.",
    answers: ["don't", "doesn't", "isn't", "not"],
    correct: 1,
    explain: "Chủ ngữ She → phủ định: doesn't."
  },
  {
    question: "3. Look! The boy ______ to fall.",
    answers: ["is going", "is going to", "will", "goes"],
    correct: 1,
    explain: "'Look!' → dấu hiệu → dùng 'be going to'."
  },
  {
    question: "4. He ______ to Da Nang next week. (plan)",
    answers: ["will go", "is going", "is going to go", "goes"],
    correct: 2,
    explain: "Đã có kế hoạch → dùng 'be going to'."
  },
  {
    question: "5. They ______ English for 5 years.",
    answers: ["study", "are studying", "have studied", "studied"],
    correct: 2,
    explain: "Hành động đã kéo dài trong quá khứ đến hiện tại → Present Perfect."
  }
];

let score = 0;

function loadQuiz() {
  const container = document.getElementById("quiz-container");
  container.innerHTML = "";

  quizData.forEach((q, index) => {
    const box = document.createElement("div");
    box.className = "question-box";

    let html = `<p><strong>${q.question}</strong></p><div class="answers">`;

    q.answers.forEach((ans, i) => {
      html += `<button onclick="checkAnswer(${index}, ${i}, this)">${ans}</button>`;
    });

    html += `</div><p id="explain-${index}" style="display:none; margin-top:10px; color:#444;"></p>`;
    box.innerHTML = html;

    container.appendChild(box);
  });
}

function checkAnswer(qIndex, ansIndex, btn) {
  const correct = quizData[qIndex].correct;

  // ngăn chọn lại
  const buttons = btn.parentNode.querySelectorAll("button");
  buttons.forEach(b => b.disabled = true);

  if (ansIndex === correct) {
    btn.classList.add("correct");
    score++;
  } else {
    btn.classList.add("wrong");
    buttons[correct].classList.add("correct");
  }

  document.getElementById("explain-" + qIndex).innerHTML =
    "➡ " + quizData[qIndex].explain;
  document.getElementById("explain-" + qIndex).style.display = "block";

  if (qIndex === quizData.length - 1) finishQuiz();
}

function finishQuiz() {
  const box = document.getElementById("result-box");
  box.style.display = "block";
  box.innerHTML = `<h3>Kết quả: ${score}/${quizData.length}</h3>
                   <p>Bạn đã hoàn thành bài kiểm tra!</p>`;

  document.getElementById("restart-btn").style.display = "block";
}

document.getElementById("restart-btn").onclick = () => {
  score = 0;
  loadQuiz();
  document.getElementById("result-box").style.display = "none";
  document.getElementById("restart-btn").style.display = "none";
};

loadQuiz();
</script>

</body>
</html>
