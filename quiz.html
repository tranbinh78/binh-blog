<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quiz | Binh Blog</title>
  <style>
    body {
      font-family: "Be Vietnam Pro", sans-serif;
      background:#fafafa;
      padding:20px;
      max-width:900px;
      margin:auto;
      line-height:1.7;
    }

    .question-box {
      background:#fff;
      padding:20px;
      margin-bottom:25px;
      border-radius:12px;
      border:1px solid #ddd;
    }

    .answers button {
      display:block;
      width:100%;
      text-align:left;
      padding:12px 14px;
      margin-top:8px;
      border-radius:8px;
      border:1px solid #ccc;
      background:#f7f7f7;
      cursor:pointer;
      transition:0.2s;
      font-size:16px;
    }

    .answers button:hover {
      background:#f0f0ff;
    }

    .correct {
      background:#d4ffd4 !important;
      border-color:#4caf50 !important;
    }

    .wrong {
      background:#ffd4d4 !important;
      border-color:#ff0000 !important;
    }

    #result-box {
      padding:20px;
      background:#fff3c4;
      border-left:6px solid #ffc400;
      border-radius:8px;
      margin-top:20px;
      display:none;
    }

    #restart-btn {
      margin-top:20px;
      padding:12px 18px;
      border-radius:8px;
      background:#d9d1ff;
      border:1px solid #bcb0ff;
      cursor:pointer;
      font-size:16px;
      font-weight:bold;
      display:none;
    }
  </style>
</head>
<body>

<h1 id="quiz-title">Bài tập</h1>
<p id="quiz-desc"></p>

<div id="quiz-container"></div>

<div id="result-box"></div>
<button id="restart-btn">Làm lại</button>

<!-- Nạp toàn bộ dữ liệu bài tập -->
<script src="/binh-blog/quiz-data.js"></script>

<script>
/* ==========================
   1. LẤY LOẠI BÀI TỪ URL
==========================*/
const params = new URLSearchParams(window.location.search);
const type = params.get("type");

// Lấy dữ liệu từ quiz-data.js (đã khai báo là window.quizData)
const data = window.quizData ? window.quizData[type] : undefined;

/* ==========================
   2. NẾU KHÔNG CÓ BÀI TẬP
==========================*/
if (!data) {
  document.getElementById("quiz-title").innerText = "Chưa có bài tập cho phần này!";
  document.getElementById("quiz-desc").innerText =
    "Vui lòng quay lại sau hoặc kiểm tra đường dẫn quiz.";
  console.warn("Không tìm thấy dữ liệu quiz cho:", type);
} else {
  document.getElementById("quiz-title").innerText = data.title;
  document.getElementById("quiz-desc").innerText = data.desc;
  loadQuiz(data.questions);
}

let score = 0;
let currentQuestions = [];

/* ==========================
   3. HIỂN THỊ CÂU HỎI
==========================*/
function loadQuiz(questions) {
  score = 0;
  currentQuestions = questions;

  const container = document.getElementById("quiz-container");
  container.innerHTML = "";

  questions.forEach((q, index) => {
    const box = document.createElement("div");
    box.className = "question-box";

    let html = `<p><strong>${q.question}</strong></p><div class="answers">`;

    q.options.forEach((ans, i) => {
      html += `<button onclick="checkAnswer(${index}, ${i}, this)">${ans}</button>`;
    });

    html += `</div><p id="explain-${index}" style="display:none; margin-top:10px; color:#444;"></p>`;

    box.innerHTML = html;
    container.appendChild(box);
  });
}

/* ==========================
   4. KIỂM TRA ĐÁP ÁN
==========================*/
function checkAnswer(qIndex, ansIndex, btn) {
  const correct = currentQuestions[qIndex].answer;

  const buttons = btn.parentNode.querySelectorAll("button");
  buttons.forEach(b => b.disabled = true);

  if (ansIndex === correct) {
    btn.classList.add("correct");
    score++;
  } else {
    btn.classList.add("wrong");
    buttons[correct].classList.add("correct");
  }

  document.getElementById("explain-" + qIndex).innerHTML =
    "➡ " + currentQuestions[qIndex].explain;
  document.getElementById("explain-" + qIndex).style.display = "block";

  if (qIndex === currentQuestions.length - 1) finishQuiz();
}

/* ==========================
   5. KẾT QUẢ CUỐI
==========================*/
function finishQuiz() {
  const box = document.getElementById("result-box");
  box.style.display = "block";
  box.innerHTML = `
    <h3>Kết quả: ${score}/${currentQuestions.length}</h3>
    <p>Bạn đã hoàn thành bài kiểm tra!</p>
  `;
  document.getElementById("restart-btn").style.display = "block";
}

document.getElementById("restart-btn").onclick = () => {
  loadQuiz(currentQuestions);
  document.getElementById("result-box").style.display = "none";
  document.getElementById("restart-btn").style.display = "none";
};
</script>

</body>
</html>
