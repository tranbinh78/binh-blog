<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quiz | Binh Blog</title>
  <style>
    body {
      font-family: "Be Vietnam Pro", sans-serif;
      background:#fafafa;
      padding:20px;
      max-width:900px;
      margin:auto;
      line-height:1.7;
    }

    h1 {
      text-align:center;
      margin-bottom:10px;
    }

    #quiz-desc {
      text-align:center;
      margin-bottom:25px;
      color:#333;
    }

    .question-box {
      background:#fff;
      padding:20px;
      margin-bottom:25px;
      border-radius:12px;
      border:1px solid #ddd;
    }

    .answers button {
      display:block;
      width:100%;
      text-align:left;
      padding:12px 14px;
      margin-top:8px;
      border-radius:8px;
      border:1px solid #ccc;
      background:#f7f7f7;
      cursor:pointer;
      transition:0.2s;
      font-size:16px;
    }

    .answers button:hover {
      background:#f0f0ff;
    }

    .correct {
      background:#d4ffd4 !important;
      border-color:#4caf50 !important;
    }

    .wrong {
      background:#ffd4d4 !important;
      border-color:#ff0000 !important;
    }

    #result-box {
      padding:20px;
      background:#fff3c4;
      border-left:6px solid #ffc400;
      border-radius:8px;
      margin-top:20px;
      display:none;
      font-size:18px;
    }

    #restart-btn {
      margin-top:20px;
      padding:12px 18px;
      border-radius:8px;
      background:#d9d1ff;
      border:1px solid #bcb0ff;
      cursor:pointer;
      font-size:16px;
      font-weight:bold;
      display:none;
    }
  </style>
</head>
<body>

<h1 id="quiz-title">Bài tập</h1>
<p id="quiz-desc"></p>

<div id="quiz-container"></div>

<div id="result-box"></div>
<button id="restart-btn">Làm lại</button>

<!-- Load dữ liệu 12 thì -->
<script src="/binh-blog/quiz-data.js"></script>

<script>
/* ==========================
   LẤY LOẠI BÀI TỪ URL
==========================*/

const params = new URLSearchParams(window.location.search);
const type = params.get("type");

// đọc database từ quiz-data.js
const data = window.quizData[type] || null;

// điểm số
window._score = 0;

if (!data) {
  document.getElementById("quiz-title").innerText = "Chưa có bài tập cho phần này!";
  document.getElementById("quiz-desc").innerText =
    "Vui lòng quay lại sau hoặc kiểm tra đường dẫn quiz.";
} else {
  document.getElementById("quiz-title").innerText = data.title;
  document.getElementById("quiz-desc").innerText = data.desc;
  loadQuiz(data.questions);
}

/* ==========================
   HIỂN THỊ CÂU HỎI
==========================*/

function loadQuiz(questions) {
  window._score = 0;
  window.currentQuestions = questions;

  const container = document.getElementById("quiz-container");
  container.innerHTML = "";

  questions.forEach((q, index) => {
    const box = document.createElement("div");
    box.className = "question-box";

    let html = `<p><strong>${index + 1}. ${q.question}</strong></p><div class="answers">`;

    q.options.forEach((ans, i) => {
      html += `<button onclick="checkAnswer(${index}, ${i}, this)">${ans}</button>`;
    });

    html += `</div><p id="explain-${index}" style="display:none; margin-top:10px; color:#444;"></p>`;

    box.innerHTML = html;
    container.appendChild(box);
  });
}

/* ==========================
   KIỂM TRA ĐÁP ÁN
==========================*/

function checkAnswer(qIndex, ansIndex, btn) {
  const q = window.currentQuestions[qIndex];
  const correct = q.answer;

  // khóa các nút
  const buttons = btn.parentNode.querySelectorAll("button");
  buttons.forEach(b => b.disabled = true);

  // chấm điểm
  if (ansIndex === correct) {
    btn.classList.add("correct");
    window._score++;
  } else {
    btn.classList.add("wrong");
    buttons[correct].classList.add("correct");
  }

  // giải thích
  const explainEl = document.getElementById("explain-" + qIndex);
  if (q.explain) {
    explainEl.innerHTML = "➡ " + q.explain;
    explainEl.style.display = "block";
  }

  // câu cuối → tính điểm
  if (qIndex === window.currentQuestions.length - 1) {
    finishQuiz();
  }
}

/* ==========================
   HIỂN THỊ KẾT QUẢ
==========================*/

function finishQuiz() {
  const box = document.getElementById("result-box");
  box.style.display = "block";
  box.innerHTML =
    `<h3>Kết quả: ${window._score}/${window.currentQuestions.length}</h3>
     <p>Bạn đã hoàn thành bài kiểm tra!</p>`;

  document.getElementById("restart-btn").style.display = "block";
}

document.getElementById("restart-btn").onclick = () => {
  loadQuiz(window.currentQuestions);
  document.getElementById("result-box").style.display = "none";
  document.getElementById("restart-btn").style.display = "none";
};
</script>

</body>
</html>
