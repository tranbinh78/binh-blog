<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quiz | Binh Blog</title>
  <style>
    body { font-family: "Be Vietnam Pro", sans-serif; background:#fafafa; padding:20px; max-width:900px; margin:auto; line-height:1.7;}
    h1 { font-size:40px; margin-bottom:10px; }
    .question-box { background:#fff; padding:20px; margin-bottom:25px; border-radius:12px; border:1px solid #ddd; }
    .answers button { display:block; width:100%; text-align:left; padding:12px 14px; margin-top:8px; border-radius:8px; border:1px solid #ccc; background:#f7f7f7; cursor:pointer; transition:0.15s; font-size:16px; }
    .answers button:hover { background:#f0f0ff; }
    .correct { background:#d4ffd4 !important; border-color:#4caf50 !important; }
    .wrong { background:#ffd4d4 !important; border-color:#ff0000 !important; }
    #result-box { padding:20px; background:#fff3c4; border-left:6px solid #ffc400; border-radius:8px; margin-top:20px; display:none; }
    #restart-btn { margin-top:20px; padding:12px 18px; border-radius:8px; background:#d9d1ff; border:1px solid #bcb0ff; cursor:pointer; font-size:16px; font-weight:bold; display:none; }
    .small-muted { color:#666; margin-top:6px; }
  </style>
</head>
<body>

  <h1 id="quiz-title">Bài tập</h1>
  <p id="quiz-desc" class="small-muted"></p>

  <div id="quiz-container"></div>

  <div id="result-box"></div>
  <button id="restart-btn">Làm lại</button>

  <!-- === Dữ liệu quiz (bắt buộc) ===
       Quiz-data phải gán vào window.quizData (ví dụ window.quizData['present-simple'] = {...})
       Ví dụ file: /binh-blog/quiz-data.js
  -->
 <script src="quiz-data.js"></script>

  <script>
  // --- đảm bảo DOM đã load
  document.addEventListener("DOMContentLoaded", () => {

    // --- an toàn: nếu quiz-data chưa load hoặc chưa có window.quizData
    if (!window.quizData || typeof window.quizData !== "object") {
      document.getElementById("quiz-title").innerText = "Quiz chưa sẵn sàng";
      document.getElementById("quiz-desc").innerText = "Không tìm thấy dữ liệu quiz. Vui lòng kiểm tra quiz-data.js";
      return;
    }

    // Lấy type từ URL
    const params = new URLSearchParams(window.location.search);
    const type = params.get("type");

    // Lấy object quiz cho type
    const data = window.quizData[type];

    // global để các hàm khác dùng
    let currentQuestions = [];
    let score = 0;

    // Nếu không có dữ liệu cho type
    if (!data) {
      document.getElementById("quiz-title").innerText = "Chưa có bài tập cho phần này!";
      document.getElementById("quiz-desc").innerText = "Vui lòng quay lại sau hoặc kiểm tra đường dẫn quiz.";
      return;
    }

    // Hiển thị tiêu đề/ mô tả
    document.getElementById("quiz-title").innerText = data.title || "Bài tập";
    document.getElementById("quiz-desc").innerText = data.desc || "";

    // Load quiz
    function loadQuiz(questions) {
      score = 0;
      currentQuestions = Array.isArray(questions) ? questions : [];
      const container = document.getElementById("quiz-container");
      container.innerHTML = "";

      if (!currentQuestions.length) {
        container.innerHTML = "<p>Không có câu hỏi.</p>";
        return;
      }

      currentQuestions.forEach((q, index) => {
        const box = document.createElement("div");
        box.className = "question-box";

        // câu hỏi
        let html = `<p><strong>${index+1}. ${escapeHtml(q.question||"")}</strong></p>`;
        html += `<div class="answers">`;
        const options = Array.isArray(q.options) ? q.options : [];
        options.forEach((opt, i) => {
          // mỗi nút gọi checkAnswer với chỉ số
          html += `<button type="button" data-q="${index}" data-a="${i}">${escapeHtml(opt)}</button>`;
        });
        html += `</div>`;
        html += `<p id="explain-${index}" style="display:none; margin-top:10px; color:#444;"></p>`;
        box.innerHTML = html;
        container.appendChild(box);
      });

      // add event delegation để không tạo nhiều inline onclick
      container.querySelectorAll(".answers button").forEach(btn => {
        btn.addEventListener("click", (ev) => {
          const qIndex = Number(btn.getAttribute("data-q"));
          const ansIndex = Number(btn.getAttribute("data-a"));
          checkAnswer(qIndex, ansIndex, btn);
        });
      });

      // ẩn result/restart
      document.getElementById("result-box").style.display = "none";
      document.getElementById("restart-btn").style.display = "none";
    }

    // Kiểm tra đáp án
    function checkAnswer(qIndex, ansIndex, btn) {
      const q = currentQuestions[qIndex];
      if (!q) return;
      const correct = Number(q.answer);

      // khóa toàn bộ đáp án của câu đó
      const buttons = btn.parentNode.querySelectorAll("button");
      buttons.forEach(b => b.disabled = true);

      if (ansIndex === correct) {
        btn.classList.add("correct");
        score++;
      } else {
        btn.classList.add("wrong");
        if (buttons[correct]) buttons[correct].classList.add("correct");
      }

      const explainEl = document.getElementById("explain-" + qIndex);
      if (explainEl) {
        explainEl.innerHTML = "➡ " + (q.explain || "");
        explainEl.style.display = "block";
      }

      // nếu là câu cuối -> finish
      if (qIndex === currentQuestions.length - 1) {
        finishQuiz();
      }
    }

    // Kết quả
    function finishQuiz() {
      const box = document.getElementById("result-box");
      box.style.display = "block";
      box.innerHTML = `<h3>Kết quả: ${score}/${currentQuestions.length}</h3>
                       <p>Bạn đã hoàn thành bài kiểm tra!</p>`;
      document.getElementById("restart-btn").style.display = "inline-block";
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    }

    document.getElementById("restart-btn").addEventListener("click", () => {
      loadQuiz(currentQuestions);
    });

    // bảo vệ: escape HTML text
    function escapeHtml(str) {
      if (typeof str !== "string") return str;
      return str.replace(/[&<>"']/g, function(m) {
        return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]);
      });
    }

    // KHỞI CHẠY
    loadQuiz(data.questions || []);

  }); // DOMContentLoaded
  </script>
</body>
</html>
