<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Quiz | Binh Blog</title>

<style>
  body {
    font-family: "Be Vietnam Pro", sans-serif;
    background:#fafafa;
    padding:20px;
    max-width:900px;
    margin:auto;
    line-height:1.7;
  }
  .question-box {
    background:#fff;
    padding:20px;
    margin-bottom:25px;
    border-radius:12px;
    border:1px solid #ddd;
  }
  .answers button {
    display:block;
    width:100%;
    text-align:left;
    padding:12px 14px;
    margin-top:8px;
    border-radius:8px;
    border:1px solid #ccc;
    background:#f7f7f7;
    cursor:pointer;
    transition:0.2s;
    font-size:16px;
  }
  .answers button:hover { background:#f0f0ff; }
  .correct { background:#d4ffd4 !important; border-color:#4caf50 !important; }
  .wrong { background:#ffd4d4 !important; border-color:#ff0000 !important; }

  #result-box {
    padding:20px;
    background:#fff3c4;
    border-left:6px solid #ffc400;
    border-radius:8px;
    margin-top:20px;
    display:none;
  }
  #restart-btn {
    margin-top:20px;
    padding:12px 18px;
    border-radius:8px;
    background:#d9d1ff;
    border:1px solid #bcb0ff;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    display:none;
  }
</style>
</head>

<body>

<h1 id="quiz-title">Bài tập</h1>
<p id="quiz-desc"></p>

<div id="quiz-container"></div>

<div id="result-box"></div>
<button id="restart-btn">Làm lại</button>

<!-- Load quiz-data -->
<script src="/binh-blog/quiz-data.js"></script>

<script>
let score = 0;
let currentQuestions = [];

// shuffle options but return new index of correct answer
function shuffleOptions(arr, correctIndex) {
  let indexed = arr.map((v, i) => ({ v, i }));
  for (let i = indexed.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [indexed[i], indexed[j]] = [indexed[j], indexed[i]];
  }
  return {
    options: indexed.map(x => x.v),
    newAnswer: indexed.findIndex(x => x.i === correctIndex)
  };
}

function loadQuiz() {
  const params = new URLSearchParams(location.search);
  const type = params.get("type");

  if (!type || !quizData[type]) {
    document.getElementById("quiz-title").innerText = "Bài tập";
    document.getElementById("quiz-desc").innerText = "Không có dữ liệu.";
    return;
  }

  document.getElementById("quiz-title").innerText = quizData[type].title;
  document.getElementById("quiz-desc").innerText = quizData[type].desc;

  score = 0;
  const qList = quizData[type].questions;
  currentQuestions = JSON.parse(JSON.stringify(qList));

  const container = document.getElementById("quiz-container");
  container.innerHTML = "";

  currentQuestions.forEach((q, idx) => {
    const { options, newAnswer } = shuffleOptions(q.options, q.answer);
    q.options = options;
    q.answer = newAnswer;

    const box = document.createElement("div");
    box.className = "question-box";

    let html = `<p><strong>${idx + 1}. ${q.question}</strong></p><div class="answers">`;

    q.options.forEach((op, i) => {
      html += `<button data-q="${idx}" data-a="${i}">${op}</button>`;
    });

    html += `</div><p id="explain-${idx}" style="display:none;margin-top:10px;color:#444;">
              ➜ ${q.explain || "Không có giải thích."}
             </p>`;

    box.innerHTML = html;
    container.appendChild(box);
  });

  container.querySelectorAll(".answers button").forEach(btn => {
    btn.addEventListener("click", checkAnswer);
  });
}

function checkAnswer(e) {
  const btn = e.target;
  const qIndex = Number(btn.dataset.q);
  const aIndex = Number(btn.dataset.a);
  const q = currentQuestions[qIndex];

  const allBtns = btn.parentNode.querySelectorAll("button");
  allBtns.forEach(b => b.disabled = true);

  if (aIndex === q.answer) {
    btn.classList.add("correct");
    score++;
  } else {
    btn.classList.add("wrong");
    const correctBtn = btn.parentNode.querySelector(`button[data-a="${q.answer}"]`);
    if (correctBtn) correctBtn.classList.add("correct");
  }

  document.getElementById("explain-" + qIndex).style.display = "block";

  const allDone = [...document.querySelectorAll(".answers button")].every(b => b.disabled);
  if (allDone) finishQuiz();
}

function finishQuiz() {
  const box = document.getElementById("result-box");
  box.style.display = "block";
  box.innerHTML = `<h3>Kết quả: ${score}/${currentQuestions.length}</h3>`;
  document.getElementById("restart-btn").style.display = "block";
}

document.getElementById("restart-btn").onclick = () => {
  loadQuiz();
  document.getElementById("result-box").style.display = "none";
  document.getElementById("restart-btn").style.display = "none";
};

loadQuiz();
</script>

</body>
</html>
