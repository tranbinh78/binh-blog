<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Quiz | Binh Blog</title>

  <style>
    body {
      font-family: "Be Vietnam Pro", sans-serif;
      background:#fafafa;
      padding:20px;
      max-width:900px;
      margin:auto;
      line-height:1.7;
    }
    .question-box {
      background:#fff;
      padding:20px;
      margin-bottom:25px;
      border-radius:12px;
      border:1px solid #ddd;
    }
    .answers button {
      display:block;
      width:100%;
      text-align:left;
      padding:12px 14px;
      margin-top:8px;
      border-radius:8px;
      border:1px solid #ccc;
      background:#f7f7f7;
      cursor:pointer;
      transition:0.2s;
      font-size:16px;
    }
    .answers button:hover { background:#f0f0ff; }
    .correct { background:#d4ffd4 !important; border-color:#4caf50 !important; }
    .wrong { background:#ffd4d4 !important; border-color:#ff0000 !important; }

    #result-box {
      padding:20px;
      background:#fff3c4;
      border-left:6px solid #ffc400;
      border-radius:8px;
      margin-top:20px;
      display:none;
    }
    #restart-btn {
      margin-top:20px;
      padding:12px 18px;
      border-radius:8px;
      background:#d9d1ff;
      border:1px solid #bcb0ff;
      cursor:pointer;
      font-size:16px;
      font-weight:bold;
      display:none;
    }
  </style>
</head>

<body>

<h1 id="quiz-title">Bài tập</h1>
<p id="quiz-desc"></p>

<div id="quiz-container"></div>

<div id="result-box"></div>
<button id="restart-btn">Làm lại</button>

<!-- Load dữ liệu quiz -->
<script src="/binh-blog/quiz-data.js"></script>

<script>
/* --- Assumes:
   - quizData[type] trả về array câu hỏi với {question, options, answer, explain}
   - 'answer' ban đầu là index (0..)
   - biến global `score` được khai báo bên trên (nếu chưa, khai báo ở đây)
*/

let score = 0;               // đảm bảo có khai báo
window.currentQuestions = []; // lưu phiên bản đã shuffle

// helper: shuffle mảng và trả về mảng mới + chỉ số mới của phần tử ban đầu (oldIndex)
function shuffleWithNewIndex(arr, oldIndex) {
  // copy
  const items = arr.map((v, i) => ({v, i}));
  // Fisher-Yates shuffle
  for (let i = items.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [items[i], items[j]] = [items[j], items[i]];
  }
  // build shuffled values
  const shuffled = items.map(x => x.v);
  // find new index where original oldIndex ended up
  const newIndex = items.findIndex(x => x.i === oldIndex);
  return {shuffled, newIndex};
}

// loadQuiz: tạo bản copy của questions, shuffle option cho từng câu (và cập nhật answer)
function loadQuiz(questions) {
  score = 0;
  const container = document.getElementById("quiz-container");
  container.innerHTML = "";

  // deep-copy questions để không thay đổi dữ liệu gốc
  const copied = questions.map(q => ({
    question: q.question,
    options: Array.isArray(q.options) ? q.options.slice() : [],
    answer: q.answer,
    explain: q.explain || ""
  }));

  // shuffle options per question -> set new answer index
  copied.forEach((q, idx) => {
    if (!Array.isArray(q.options)) q.options = [];
    // nếu answer undefined hoặc không phải số thì giữ nguyên
    const oldAns = (typeof q.answer === "number") ? q.answer : 0;
    const {shuffled, newIndex} = shuffleWithNewIndex(q.options, oldAns);
    q.options = shuffled;
    q.answer = newIndex; // cập nhật chỉ số đúng sau khi shuffle
  });

  // optionally: shuffle order of questions too (uncomment if wanted)
  // copied.sort(() => Math.random() - 0.5);

  // lưu vào global để checkAnswer truy cập
  window.currentQuestions = copied;

  // render
  copied.forEach((q, index) => {
    const box = document.createElement("div");
    box.className = "question-box";

    let html = `<p><strong>${index + 1}. ${q.question}</strong></p><div class="answers">`;

    q.options.forEach((ans, i) => {
      // dùng data- attributes thay vì inline onclick để an toàn hơn
      html += `<button data-q="${index}" data-a="${i}">${ans}</button>`;
    });

    html += `</div><p id="explain-${index}" style="display:none; margin-top:10px;">${q.explain ? "➡ " + q.explain : ""}</p>`;
    box.innerHTML = html;
    container.appendChild(box);
  });

  // gắn event listener cho tất cả các nút (delegation)
  container.querySelectorAll(".answers button").forEach(btn => {
    btn.addEventListener("click", function () {
      const qIndex = Number(this.dataset.q);
      const aIndex = Number(this.dataset.a);
      checkAnswer(qIndex, aIndex, this);
    });
  });
}

// checkAnswer sử dụng window.currentQuestions (đã có answer = newIndex)
function checkAnswer(qIndex, ansIndex, btn) {
  const current = window.currentQuestions && window.currentQuestions[qIndex];
  if (!current) return;

  const correct = current.answer; // index sau khi shuffle

  // disable tất cả nút trong group
  const buttons = btn.parentNode.querySelectorAll("button");
  buttons.forEach(b => b.disabled = true);

  if (ansIndex === correct) {
    btn.classList.add("correct");
    score++;
  } else {
    btn.classList.add("wrong");
    // tô đáp án đúng (nếu vẫn còn nút đúng hiển thị)
    const correctBtn = btn.parentNode.querySelector(`button[data-a="${correct}"]`);
    if (correctBtn) correctBtn.classList.add("correct");
  }

  // hiện giải thích (nếu có)
  const explainEl = document.getElementById("explain-" + qIndex);
  if (explainEl) {
    explainEl.style.display = "block";
    // ensure text already set in render; if you want to set dynamically:
    // explainEl.innerText = "➡ " + (current.explain || "Không có giải thích.");
  }

  // nếu đây là câu cuối cùng (all buttons disabled?) — kiểm tra:
  const allDisabled = Array.from(document.querySelectorAll(".answers button")).every(b => b.disabled);
  if (allDisabled) finishQuiz();
}

function finishQuiz() {
  const box = document.getElementById("result-box");
  box.style.display = "block";
  const total = window.currentQuestions ? window.currentQuestions.length : 0;
  box.innerHTML =
    `<h3>Kết quả: ${score}/${total}</h3><p>Bạn đã hoàn thành bài kiểm tra!</p>`;
  document.getElementById("restart-btn").style.display = "block";
}

document.getElementById("restart-btn").onclick = () => {
  loadQuiz(window.currentQuestions || []);
  document.getElementById("result-box").style.display = "none";
  document.getElementById("restart-btn").style.display = "none";
};
</script>

</body>
</html>
