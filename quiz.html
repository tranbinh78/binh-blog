<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Quiz | Binh Blog</title>

  <style>
    body {
      font-family: "Be Vietnam Pro", sans-serif;
      background:#fafafa;
      padding:20px;
      max-width:900px;
      margin:auto;
      line-height:1.7;
    }
    .question-box {
      background:#fff;
      padding:20px;
      margin-bottom:25px;
      border-radius:12px;
      border:1px solid #ddd;
    }
    .answers button {
      display:block;
      width:100%;
      text-align:left;
      padding:12px 14px;
      margin-top:8px;
      border-radius:8px;
      border:1px solid #ccc;
      background:#f7f7f7;
      cursor:pointer;
      transition:0.2s;
      font-size:16px;
    }
    .answers button:hover { background:#f0f0ff; }
    .correct { background:#d4ffd4 !important; border-color:#4caf50 !important; }
    .wrong { background:#ffd4d4 !important; border-color:#ff0000 !important; }

    #result-box {
      padding:20px;
      background:#fff3c4;
      border-left:6px solid #ffc400;
      border-radius:8px;
      margin-top:20px;
      display:none;
    }
    #restart-btn {
      margin-top:20px;
      padding:12px 18px;
      border-radius:8px;
      background:#d9d1ff;
      border:1px solid #bcb0ff;
      cursor:pointer;
      font-size:16px;
      font-weight:bold;
      display:none;
    }
  </style>
</head>

<body>

<h1 id="quiz-title">Bài tập</h1>
<p id="quiz-desc"></p>

<div id="quiz-container"></div>

<div id="result-box"></div>
<button id="restart-btn">Làm lại</button>

<!-- Load dữ liệu quiz -->
<script src="/binh-blog/quiz-data.js"></script>

<script>
// ======== LẤY TYPE TỪ URL + FALLBACK AN TOÀN ========
const params = new URLSearchParams(window.location.search);
let type = params.get("type");

// ⭐ Nếu URL không có type hoặc type không tồn tại → fallback
if (!type || !quizData[type]) {
    type = "present-simple";
}

let score = 0;
window.currentQuestions = [];

// ======== SHUFFLE ========
function shuffleWithNewIndex(arr, oldIndex) {
  const items = arr.map((v, i) => ({v, i}));

  for (let i = items.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [items[i], items[j]] = [items[j], items[i]];
  }

  const shuffled = items.map(x => x.v);
  const newIndex = items.findIndex(x => x.i === oldIndex);
  return {shuffled, newIndex};
}

// ======== LOAD QUIZ ========
function loadQuiz(questions) {
  score = 0;
  const container = document.getElementById("quiz-container");
  container.innerHTML = "";

  const copied = questions.map(q => ({
    question: q.question,
    options: q.options.slice(),
    answer: q.answer,
    explain: q.explain || ""
  }));

  copied.forEach(q => {
    const oldAns = typeof q.answer === "number" ? q.answer : 0;
    const {shuffled, newIndex} = shuffleWithNewIndex(q.options, oldAns);
    q.options = shuffled;
    q.answer = newIndex;
  });

  window.currentQuestions = copied;

  copied.forEach((q, index) => {
    const box = document.createElement("div");
    box.className = "question-box";

    let html = `<p><strong>${index + 1}. ${q.question}</strong></p>
                <div class="answers">`;

    q.options.forEach((ans, i) => {
      html += `<button data-q="${index}" data-a="${i}">${ans}</button>`;
    });

    html += `</div>
             <p id="explain-${index}" style="display:none;margin-top:10px;">
               ${q.explain ? "➡ " + q.explain : ""}
             </p>`;

    box.innerHTML = html;
    container.appendChild(box);
  });

  // Gắn click cho tất cả nút
  container.querySelectorAll(".answers button").forEach(btn => {
    btn.addEventListener("click", function () {
      const qIndex = Number(this.dataset.q);
      const aIndex = Number(this.dataset.a);
      checkAnswer(qIndex, aIndex, this);
    });
  });

  // Cập nhật tiêu đề
  document.getElementById("quiz-title").innerText =
    "Bài tập – " + type.replace(/-/g, " ").toUpperCase();

  document.getElementById("quiz-desc").innerText =
    "Chọn đáp án đúng cho thì " + type.replace(/-/g, " ") + ".";
}

// ======== CHECK ANSWER ========
function checkAnswer(qIndex, ansIndex, btn) {
  const current = window.currentQuestions[qIndex];
  if (!current) return;

  const correct = current.answer;
  const buttons = btn.parentNode.querySelectorAll("button");
  buttons.forEach(b => b.disabled = true);

  if (ansIndex === correct) {
    btn.classList.add("correct");
    score++;
  } else {
    btn.classList.add("wrong");
    const correctBtn = btn.parentNode.querySelector(`button[data-a="${correct}"]`);
    if (correctBtn) correctBtn.classList.add("correct");
  }

  const explainEl = document.getElementById("explain-" + qIndex);
  if (explainEl) explainEl.style.display = "block";

  // Khi trả lời xong tất cả → hiện kết quả
  const allDisabled = Array.from(document.querySelectorAll(".answers button"))
    .every(b => b.disabled);

  if (allDisabled) finishQuiz();
}

function finishQuiz() {
  const box = document.getElementById("result-box");
  const total = window.currentQuestions.length;
  box.style.display = "block";
  box.innerHTML =
    `<h3>Kết quả: ${score}/${total}</h3><p>Bạn đã hoàn thành bài kiểm tra!</p>`;
  document.getElementById("restart-btn").style.display = "block";
}

document.getElementById("restart-btn").onclick = () => {
  loadQuiz(window.currentQuestions);
  document.getElementById("result-box").style.display = "none";
  document.getElementById("restart-btn").style.display = "none";
};

// ======== KHỞI ĐỘNG ========
loadQuiz(quizData[type]);
</script>

</body>
</html>
