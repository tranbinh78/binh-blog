<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quiz | Binh Blog</title>
  <style>
    body {
      font-family: "Be Vietnam Pro", sans-serif;
      background:#fafafa;
      padding:20px;
      max-width:900px;
      margin:auto;
      line-height:1.7;
    }

    .question-box {
      background:#fff;
      padding:20px;
      margin-bottom:25px;
      border-radius:12px;
      border:1px solid #ddd;
    }

    .answers button {
      display:block;
      width:100%;
      text-align:left;
      padding:12px 14px;
      margin-top:8px;
      border-radius:8px;
      border:1px solid #ccc;
      background:#f7f7f7;
      cursor:pointer;
      transition:0.2s;
      font-size:16px;
    }

    .answers button:hover {
      background:#f0f0ff;
    }

    .correct {
      background:#d4ffd4 !important;
      border-color:#4caf50 !important;
    }

    .wrong {
      background:#ffd4d4 !important;
      border-color:#ff0000 !important;
    }

    #result-box {
      padding:20px;
      background:#fff3c4;
      border-left:6px solid #ffc400;
      border-radius:8px;
      margin-top:20px;
      display:none;
    }

    #restart-btn {
      margin-top:20px;
      padding:12px 18px;
      border-radius:8px;
      background:#d9d1ff;
      border:1px solid #bcb0ff;
      cursor:pointer;
      font-size:16px;
      font-weight:bold;
      display:none;
    }
  </style>
</head>
<body>

<h1 id="quiz-title">Bài tập trắc nghiệm</h1>
<p id="quiz-desc"></p>

<div id="quiz-container"></div>

<div id="result-box"></div>
<button id="restart-btn">Làm lại</button>

<script>
/* ==========================
   1. DỮ LIỆU QUIZ THEO BÀI
   ==========================*/

const QUIZ_DATABASE = {
  "present-simple": {
    title: "Bài tập – Present Simple",
    desc: "Chọn đáp án đúng cho thì Hiện tại đơn.",
    questions: [
      {
        question: "He ______ to school every day.",
        answers: ["go", "goes", "is going", "went"],
        correct: 1,
        explain: "He → thêm -es → goes."
      },
      {
        question: "They ______ football on Sunday.",
        answers: ["don't play", "doesn't play", "not play", "aren't play"],
        correct: 0,
        explain: "They → don't + V nguyên thể."
      }
    ]
  },

  "present-continuous": {
    title: "Bài tập – Present Continuous",
    desc: "Chọn đáp án đúng cho thì Hiện tại tiếp diễn.",
    questions: [
      {
        question: "They ______ TV now.",
        answers: ["watch", "are watching", "watched", "watching"],
        correct: 1,
        explain: "Dấu hiệu now → Present Continuous."
      },
      {
        question: "She ______ coffee at the moment.",
        answers: ["drinks", "is drinking", "drink", "are drinking"],
        correct: 1,
        explain: "At the moment → đang diễn ra."
      }
    ]
  },

  "past-simple": {
    title: "Bài tập – Past Simple",
    desc: "Chọn đáp án đúng cho thì Quá khứ đơn.",
    questions: [
      {
        question: "They ______ to the beach yesterday.",
        answers: ["go", "goes", "went", "are going"],
        correct: 2,
        explain: "Yesterday → went."
      }
    ]
  }
};

/* ==========================
   2. LẤY LOẠI BÀI TỪ URL
   ==========================*/

const params = new URLSearchParams(window.location.search);
const type = params.get("type");

const quizData = QUIZ_DATABASE[type];
let score = 0;

/* ==========================
   3. HIỂN THỊ QUIZ
   ==========================*/

if (!quizData) {
  document.getElementById("quiz-title").innerText = "Quiz không tồn tại";
} else {
  document.getElementById("quiz-title").innerText = quizData.title;
  document.getElementById("quiz-desc").innerText = quizData.desc;
  loadQuiz();
}

function loadQuiz() {
  score = 0;
  const container = document.getElementById("quiz-container");
  container.innerHTML = "";

  quizData.questions.forEach((q, index) => {
    const box = document.createElement("div");
    box.className = "question-box";

    let html = `<p><strong>${q.question}</strong></p><div class="answers">`;

    q.answers.forEach((ans, i) => {
      html += `<button onclick="checkAnswer(${index}, ${i}, this)">${ans}</button>`;
    });

    html += `</div><p id="explain-${index}" style="display:none; margin-top:10px; color:#444;"></p>`;
    box.innerHTML = html;
    container.appendChild(box);
  });
}

/* ==========================
   4. KIỂM TRA ĐÁP ÁN
   ==========================*/

function checkAnswer(qIndex, ansIndex, btn) {
  const correct = quizData.questions[qIndex].correct;

  // khóa toàn bộ đáp án
  const buttons = btn.parentNode.querySelectorAll("button");
  buttons.forEach(b => b.disabled = true);

  if (ansIndex === correct) {
    btn.classList.add("correct");
    score++;
  } else {
    btn.classList.add("wrong");
    buttons[correct].classList.add("correct");
  }

  document.getElementById("explain-" + qIndex).innerHTML =
    "➡ " + quizData.questions[qIndex].explain;
  document.getElementById("explain-" + qIndex).style.display = "block";

  if (qIndex === quizData.questions.length - 1) finishQuiz();
}

/* ==========================
   5. KẾT QUẢ
   ==========================*/

function finishQuiz() {
  const box = document.getElementById("result-box");
  box.style.display = "block";
  box.innerHTML = `<h3>Kết quả: ${score}/${quizData.questions.length}</h3>
                   <p>Bạn đã hoàn thành bài kiểm tra!</p>`;
  document.getElementById("restart-btn").style.display = "block";
}

document.getElementById("restart-btn").onclick = () => {
  loadQuiz();
  document.getElementById("result-box").style.display = "none";
  document.getElementById("restart-btn").style.display = "none";
};
</script>

<script src="/binh-blog/quiz-data.js"></script>
<script src="/binh-blog/quiz.js"></script>   <!-- file xử lý logic quiz -->
  
</body>
</html>
