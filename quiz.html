<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quiz | Binh Blog</title>
  <style>
    body {
      font-family: "Be Vietnam Pro", sans-serif;
      background:#fafafa;
      padding:20px;
      max-width:900px;
      margin:auto;
      line-height:1.7;
    }

    h1 {
      text-align:center;
      margin-bottom:10px;
    }

    #quiz-desc {
      text-align:center;
      margin-bottom:25px;
      color:#333;
    }

    .question-box {
      background:#fff;
      padding:20px;
      margin-bottom:25px;
      border-radius:12px;
      border:1px solid #ddd;
    }

    .answers button {
      display:block;
      width:100%;
      text-align:left;
      padding:12px 14px;
      margin-top:8px;
      border-radius:8px;
      border:1px solid #ccc;
      background:#f7f7f7;
      cursor:pointer;
      transition:0.2s;
      font-size:16px;
    }

    .answers button:hover {
      background:#f0f0ff;
    }

    .correct {
      background:#d4ffd4 !important;
      border-color:#4caf50 !important;
    }

    .wrong {
      background:#ffd4d4 !important;
      border-color:#ff0000 !important;
    }

    #result-box {
      padding:20px;
      background:#fff3c4;
      border-left:6px solid #ffc400;
      border-radius:8px;
      margin-top:20px;
      display:none;
      font-size:18px;
    }

    #restart-btn {
      margin-top:20px;
      padding:12px 18px;
      border-radius:8px;
      background:#d9d1ff;
      border:1px solid #bcb0ff;
      cursor:pointer;
      font-size:16px;
      font-weight:bold;
      display:none;
    }
  </style>
</head>
<body>

<h1 id="quiz-title">Bài tập</h1>
<p id="quiz-desc"></p>

<div id="quiz-container"></div>

<div id="result-box"></div>
<button id="restart-btn">Làm lại</button>

<!-- Load dữ liệu 12 thì -->
<script src="/binh-blog/quiz-data.js"></script>

<script>
/* ==========================
   LẤY LOẠI BÀI TỪ URL
==========================*/

const params = new URLSearchParams(window.location.search);
const type = params.get("type");

// đọc database từ quiz-data.js
const data = window.quizData[type] || null;

// điểm số
window._score = 0;

if (!data) {
  document.getElementById("quiz-title").innerText = "Chưa có bài tập cho phần này!";
  document.getElementById("quiz-desc").innerText =
    "Vui lòng quay lại sau hoặc kiểm tra đường dẫn quiz.";
} else {
  document.getElementById("quiz-title").innerText = data.title;
  document.getElementById("quiz-desc").innerText = data.desc;
  loadQuiz(data.questions);
}

/* ==========================
   3. HIỂN THỊ QUIZ – PRO MODE
==========================*/

let timerInterval;
let timeLeft = 300; // 300s = 5 phút

function startTimer() {
  const box = document.getElementById("result-box");
  box.style.display = "block";
  box.innerHTML = `<b>⏱ Thời gian: <span id="timer">${timeLeft}</span> giây</b>`;

  timerInterval = setInterval(() => {
    timeLeft--;
    document.getElementById("timer").textContent = timeLeft;

    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      finishQuiz(true);  // auto nộp bài
    }
  }, 1000);
}

function shuffleArray(arr) {
  return arr.sort(() => Math.random() - 0.5);
}

function loadQuiz(questions) {
  score = 0;
  timeLeft = 300; // reset 5 phút
  clearInterval(timerInterval);

  // ⭐ Random hoá thứ tự câu hỏi
  window.currentQuestions = shuffleArray([...questions]);

  const container = document.getElementById("quiz-container");
  container.innerHTML = "";

  currentQuestions.forEach((q, index) => {
    // ⭐ Random hoá thứ tự đáp án
    const optionOrder = shuffleArray([0, 1, 2, 3]);

    const box = document.createElement("div");
    box.className = "question-box";

    let html = `<p><strong>${q.question}</strong></p><div class="answers">`;

    optionOrder.forEach(orderIndex => {
      html += `<button onclick="checkAnswer(${index}, ${orderIndex}, this)">
                  ${q.options[orderIndex]}
               </button>`;
    });

    html += `</div><p id="explain-${index}" style="display:none; margin-top:10px;"></p>`;
    box.innerHTML = html;
    container.appendChild(box);
  });

  // ⭐ Bắt đầu đếm giờ
  startTimer();
}

/* ==========================
   4. KIỂM TRA ĐÁP ÁN – PRO MODE
==========================*/

function checkAnswer(qIndex, chosenIndex, btn) {
  const question = currentQuestions[qIndex];

  // Lấy đáp án thật (vị trí gốc)
  const correctIndex = question.answer;

  // Lấy toàn bộ nút đáp án
  const buttons = btn.parentNode.querySelectorAll("button");
  buttons.forEach(b => b.disabled = true);

  // Xác định đúng sai
  if (chosenIndex === correctIndex) {
    btn.classList.add("correct");
    score++;
  } else {
    btn.classList.add("wrong");

    // tô màu đáp án đúng
    buttons.forEach(b => {
      if (b.textContent.trim() === question.options[correctIndex])
        b.classList.add("correct");
    });
  }

  document.getElementById("explain-" + qIndex).innerHTML =
    "➡ " + question.explain;
  document.getElementById("explain-" + qIndex).style.display = "block";

  // Nếu là câu cuối → nộp bài
  if (qIndex === currentQuestions.length - 1) finishQuiz(false);
}

/* ==========================
   5. KẾT QUẢ – PRO MODE
==========================*/

function finishQuiz(autoSubmit) {
  clearInterval(timerInterval);

  const box = document.getElementById("result-box");
  box.style.display = "block";

  if (autoSubmit) {
    box.innerHTML = `
      <h3>⏱ Hết giờ!</h3>
      <p>Bạn đạt: ${score}/${currentQuestions.length}</p>
    `;
  } else {
    box.innerHTML = `
      <h3>Kết quả: ${score}/${currentQuestions.length}</h3>
      <p>Bạn đã hoàn thành bài kiểm tra!</p>
    `;
  }

  // hiện nút làm lại
  document.getElementById("restart-btn").style.display = "block";
}

document.getElementById("restart-btn").onclick = () => {
  loadQuiz(window.currentQuestions);
  document.getElementById("result-box").style.display = "none";
  document.getElementById("restart-btn").style.display = "none";
};
</script>

</body>
</html>
