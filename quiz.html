<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Bài tập | Binh Blog</title>

  <style>
    body {
      font-family: "Be Vietnam Pro", sans-serif;
      background:#fafafa;
      padding:20px;
      max-width:900px;
      margin:auto;
      line-height:1.7;
    }
    .question-box {
      background:#fff;
      padding:20px;
      margin-bottom:25px;
      border-radius:12px;
      border:1px solid #ddd;
    }
    .answers button {
      display:block;
      width:100%;
      text-align:left;
      padding:12px 14px;
      margin-top:8px;
      border-radius:8px;
      border:1px solid #ccc;
      background:#f7f7f7;
      cursor:pointer;
      transition:0.25s;
      font-size:16px;
    }
    .answers button:hover { background:#f0f0ff; }
    .correct { background:#d4ffd4 !important; border-color:#4caf50 !important; }
    .wrong { background:#ffd4d4 !important; border-color:#ff0000 !important; }

    #result-box {
      padding:20px;
      background:#fff3c4;
      border-left:6px solid #ffc400;
      border-radius:8px;
      margin-top:20px;
      display:none;
    }
    #restart-btn {
      margin-top:20px;
      padding:12px 18px;
      border-radius:8px;
      background:#d9d1ff;
      border:1px solid #bcb0ff;
      cursor:pointer;
      font-size:16px;
      font-weight:bold;
      display:none;
    }
  </style>
</head>

<body>

<h1 id="quiz-title">Bài tập</h1>
<p id="quiz-desc"></p>

<div id="quiz-container"></div>

<div id="result-box"></div>
<button id="restart-btn">Làm lại</button>


<script>
/* ------------------------------
   Hỗ trợ shuffle
-----------------------------------*/
function shuffleWithNewIndex(arr, oldIndex) {
  const items = arr.map((v, i) => ({v, i}));
  for (let i = items.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [items[i], items[j]] = [items[j], items[i]];
  }
  return {
    shuffled: items.map(x => x.v),
    newIndex: items.findIndex(x => x.i === oldIndex)
  };
}

let score = 0;
window.currentQuestions = [];

/* ------------------------------
   Load quiz từ JSON file
-----------------------------------*/
async function loadQuizFile(name) {
  try {
    const url = `/binh-blog/grammar/quiz/${name}.json`;
    const res = await fetch(url);

    if (!res.ok) throw new Error("Không load được " + url);

    const data = await res.json();
    loadQuiz(data);
  } catch (err) {
    document.getElementById("quiz-container").innerHTML =
      `<p style="color:red;">Không tải được file bài tập: ${name}.json</p>`;
  }
}

/* ------------------------------
   Hiển thị bài quiz
-----------------------------------*/
function loadQuiz(data) {
  score = 0;

  const container = document.getElementById("quiz-container");
  container.innerHTML = "";

  const copied = data.map(q => ({
    question: q.question,
    options: [q.a, q.b, q.c, q.d],
    answer: "abcd".indexOf(q.answer),
    explain: q.explain || ""
  }));

  // Shuffle đáp án
  copied.forEach(q => {
    const {shuffled, newIndex} = shuffleWithNewIndex(q.options, q.answer);
    q.options = shuffled;
    q.answer = newIndex;
  });

  window.currentQuestions = copied;

  copied.forEach((q, index) => {
    const box = document.createElement("div");
    box.className = "question-box";

    let html = `<p><strong>${index + 1}. ${q.question}</strong></p>
                <div class="answers">`;

    q.options.forEach((op, i) => {
      html += `<button data-q="${index}" data-a="${i}">${op}</button>`;
    });

    html += `</div>
             <p id="explain-${index}" style="display:none; margin-top:10px;"></p>`;

    box.innerHTML = html;
    container.appendChild(box);
  });

  container.querySelectorAll(".answers button").forEach(btn => {
    btn.addEventListener("click", () => {
      const q = Number(btn.dataset.q);
      const a = Number(btn.dataset.a);
      checkAnswer(q, a, btn);
    });
  });
}

/* ------------------------------
   Kiểm tra đáp án
-----------------------------------*/
function checkAnswer(qIndex, ansIndex, btn) {
  const current = window.currentQuestions[qIndex];
  const correct = current.answer;

  const buttons = btn.parentNode.querySelectorAll("button");
  buttons.forEach(b => b.disabled = true);

  if (ansIndex === correct) {
    btn.classList.add("correct");
    score++;
  } else {
    btn.classList.add("wrong");
    const correctBtn = btn.parentNode.querySelector(
      `button[data-a="${correct}"]`
    );
    if (correctBtn) correctBtn.classList.add("correct");
  }

  const explainEl = document.getElementById("explain-" + qIndex);
  explainEl.style.display = "block";
  explainEl.innerHTML = "➡ " + (current.explain || "");

  if ([...document.querySelectorAll(".answers")].every(g =>
    [...g.querySelectorAll("button")].some(b => b.disabled)
  )) {
    finishQuiz();
  }
}

/* ------------------------------
   Kết quả
-----------------------------------*/
function finishQuiz() {
  const box = document.getElementById("result-box");
  const total = window.currentQuestions.length;

  box.innerHTML = `<h3>Kết quả: ${score}/${total}</h3>
                   <p>Bạn đã hoàn thành bài luyện tập!</p>`;

  box.style.display = "block";
  document.getElementById("restart-btn").style.display = "block";
}

/* ------------------------------
   Restart
-----------------------------------*/
document.getElementById("restart-btn").onclick = () => {
  loadQuiz(window.currentQuestions);
  document.getElementById("result-box").style.display = "none";
  document.getElementById("restart-btn").style.display = "none";
};

/* ------------------------------
   Lấy tên bài tập từ URL
-----------------------------------*/
const params = new URLSearchParams(window.location.search);
const file = params.get("file"); // ví dụ "present-simple"

if (!file) {
  document.getElementById("quiz-container").innerHTML =
    "<p>Không tìm thấy bài tập.</p>";
} else {
  loadQuizFile(file);
}
</script>

</body>
</html>
