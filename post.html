<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bài viết | Binh Blog</title>

  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Highlight.js -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <style>
    body {
      font-family: "Be Vietnam Pro", sans-serif;
      background: #fafafa;
      margin: 0;
      padding: 0;
      line-height: 1.8;
    }
    .post-layout {
      max-width: 1150px;
      margin: 30px auto;
      padding: 0 20px;
      display: flex;
      gap: 40px;
    }
    #sidebar {
      flex: 1;
      background: #f8f1ff;
      border: 1px solid #e7dbff;
      border-radius: 12px;
      padding: 20px;
      position: sticky;
      height: fit-content;
      top: 20px;
      text-align: center;
    }
    #post-article {
      flex: 3;
    }
    img.thumb {
      width: 100%;
      border-radius: 14px;
      margin: 20px 0;
    }
    #post-content h2 {
      border-left: 4px solid #7a64ff;
      padding-left: 10px;
      margin-top: 35px;
    }
    #post-content .answer-text {
      background: #f2edff;
      padding: 10px 12px;
      border-left: 4px solid #8c74ff;
      border-radius: 6px;
      margin: 8px 0 18px;
    }
    button.toggle-answer-btn {
      background: #d9d1ff;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      margin: 10px 0;
    }
  </style>
</head>

<body>

<div class="post-layout">

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <img src="https://i.imgur.com/6VBx3io.png" alt="Avatar" width="80" style="border-radius:50%">
    <h3>Xin chào, mình là Bình 👋</h3>
    <p>Chia sẻ tiếng Anh, lập trình và cuộc sống mỗi ngày.</p>
    <p>
      <a href="https://facebook.com/binh.tran.599839" target="_blank">Facebook</a> ·
      <a href="https://github.com/tranbin78" target="_blank">GitHub</a>
    </p>
  </aside>


  <!-- MAIN ARTICLE -->
  <main id="post-article">

    <h1 id="post-title"></h1>
    <p class="meta">
      <span id="post-date"></span> • 
      <span id="post-category"></span>
    </p>

    <img id="post-thumb" class="thumb" src="" alt="Thumbnail">

    <div id="post-content">Đang tải nội dung...</div>

    <div id="related-posts" class="related-box" style="margin-top: 40px; background:#f7f3ff; padding:18px; border-radius:12px;">
      <h3>Bài viết liên quan</h3>
      <div id="related-list"></div>
    </div>

    <div id="post-nav" style="margin-top:40px; display:flex; justify-content:space-between;">
      <span id="prev-post"></span>
      <span id="next-post"></span>
    </div>

    <div id="share-box" style="margin-top:25px;">
      <button onclick="shareFB()">📘 Chia sẻ Facebook</button>
      <button onclick="shareZalo()">💬 Chia sẻ Zalo</button>
      <button onclick="copyLink()">🔗 Copy link</button>
    </div>

  </main>

</div>


<script>
const params = new URLSearchParams(window.location.search);
const file = params.get("file");

if (!file) {
  document.getElementById("post-content").innerHTML = "<p>Lỗi: không tìm thấy bài viết.</p>";
}

/* Load bài */
fetch("posts/posts.json")
  .then(res => res.json())
  .then(posts => {
    const post = posts.find(p => p.file === file);
    if (!post) return;

    document.getElementById("post-title").textContent = post.title;
    document.getElementById("post-date").textContent = "📅 " + post.date;
    document.getElementById("post-category").textContent = "📂 " + post.category;
    document.getElementById("post-thumb").src = post.thumbnail;

    fetch("posts/" + post.file)
      .then(res => res.text())
      .then(html => {
        document.getElementById("post-content").innerHTML = html;
        activateAnswerToggle();
        activateQuizButton(post.file);
        loadRelated(posts, post);
        loadPrevNext(posts, post);
      });
  });


/* === Toggle Answer (Fix chính) === */
function activateAnswerToggle() {
  const btn = document.querySelector("#toggle-answer, .toggle-answer-btn");
  const answers = document.querySelectorAll(".answer-text");

  if (!btn || answers.length === 0) return;

  btn.addEventListener("click", () => {
    const hiding = answers[0].style.display === "none" || answers[0].style.display === "";
    answers.forEach(a => a.style.display = hiding ? "block" : "none");
    btn.textContent = hiding ? "🙈 Ẩn đáp án" : "👉 Hiện đáp án";
  });
}


/* === Tự động thêm nút Quiz cho từng bài === */
function activateQuizButton(file) {
  const quizMap = {
    "nouns.html": "nouns",
    "adjectives.html": "adjectives",
    "adverbs.html": "adverbs",
    "pronouns.html": "pronouns",
    "articles.html": "articles",
    "conjunctions.html": "conjunctions",
    "quantifiers.html": "quantifiers",
    "prepositions.html": "prepositions",
    "modal-verbs.html": "modal-verbs",

    "present-simple.html": "present-simple",
    "present-continuous.html": "present-continuous",
    "present-perfect.html": "present-perfect",
    "present-perfect-continuous.html": "present-perfect-continuous",
    "past-simple.html": "past-simple",
    "past-continuous.html": "past-continuous",
    "past-perfect.html": "past-perfect",
    "future-simple.html": "future-simple",
    "future-continuous.html": "future-continuous",
    "near-future.html": "near-future",
    "will-vs-going-to.html": "will-vs-going-to"
  };

  if (quizMap[file]) {
    document.getElementById("post-content").innerHTML += `
      <div style="margin-top:25px;">
        <a href="/binh-blog/quiz.html?type=${quizMap[file]}"
           style="background:#d9d1ff;padding:12px 20px;
           border-radius:10px;font-weight:700;display:inline-block;">
           👉 Làm bài Quiz: ${quizMap[file].toUpperCase()}
        </a>
      </div>`;
  }
}


/* === Related posts === */
function loadRelated(posts, post) {
  const related = posts
    .filter(p => p.category === post.category && p.file !== post.file)
    .slice(0, 3);

  if (related.length === 0)
    document.getElementById("related-posts").style.display = "none";

  const box = document.getElementById("related-list");
  related.forEach(r => {
    box.innerHTML += `<div><a href="/binh-blog/post.html?file=${r.file}">${r.title}</a></div>`;
  });
}

/* === Prev / Next === */
function loadPrevNext(posts, post) {
  const index = posts.findIndex(p => p.file === post.file);
  if (index > 0)
    prev-post.innerHTML = `⬅ <a href="/binh-blog/post.html?file=${posts[index-1].file}">${posts[index-1].title}</a>`;
  if (index < posts.length - 1)
    next-post.innerHTML = `<a href="/binh-blog/post.html?file=${posts[index+1].file}">${posts[index+1].title}</a> ➡`;
}

/* SHARE */
function shareFB() {
  window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(location.href)}`, "_blank");
}
function shareZalo() {
  window.open(`https://zalo.me/share?url=${encodeURIComponent(location.href)}`, "_blank");
}
function copyLink() {
  navigator.clipboard.writeText(window.location.href);
  alert("Đã copy link bài viết!");
}

</script>
</body>
</html>
