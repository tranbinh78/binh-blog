<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bài viết | Binh Blog</title>

  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Highlight.js -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script>hljs.highlightAll();</script>

  <style>
    body {
      font-family: "Be Vietnam Pro", sans-serif;
      background: #fafafa;
      margin: 0; padding: 0;
      line-height: 1.85;
      color: #222;
    }

    .post-layout {
      max-width: 1150px;
      margin: 40px auto;
      padding: 0 20px;
      display: flex;
      gap: 40px;
    }

    #sidebar {
      flex: 1;
      background: #f4ecff;
      border: 1px solid #e5d9ff;
      border-radius: 12px;
      padding: 20px;
      height: fit-content;
      text-align: center;
      position: sticky;
      top: 20px;
    }

    #sidebar img {
      width: 80px;
      border-radius: 50%;
      margin-bottom: 10px;
    }

    #post-article {
      flex: 3;
    }

    #post-title {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .thumb {
      width: 100%;
      border-radius: 15px;
      margin: 18px 0 25px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }

    #post-content h2 {
      border-left: 4px solid #7c67ff;
      padding-left: 10px;
      margin-top: 35px;
    }

    #post-content .formula {
      padding: 10px 14px;
      background: #efe8ff;
      border-left: 4px solid #7b5dff;
      border-radius: 8px;
      font-weight: 700;
      font-size: 20px;
      display: inline-block;
      margin: 12px 0;
    }

    #post-content .example {
      background: #e7f7ff;
      border-left: 4px solid #27a8e0;
      padding: 12px 16px;
      border-radius: 8px;
    }

    .related-box {
      background: #f7f3ff;
      border: 1px solid #e3d8ff;
      padding: 18px;
      border-radius: 12px;
      margin-top: 40px;
    }

    #prev-post, #next-post a {
      font-weight: 600;
    }
  </style>
</head>

<body>
<div class="post-layout">

  <!-- Sidebar -->
  <aside id="sidebar">
    <img src="https://i.imgur.com/6VBx3io.png" alt="Avatar" />
    <h3>Xin chào, mình là Bình 👋</h3>
    <p>Chia sẻ tiếng Anh, lập trình và cuộc sống mỗi ngày.</p>
    <p>
      <a href="https://facebook.com/binh.tran.599839" target="_blank">Facebook</a> ·
      <a href="https://github.com/tranbin78" target="_blank">GitHub</a>
    </p>
  </aside>

  <!-- Main Content -->
  <main id="post-article">
    <h1 id="post-title"></h1>
    <p class="meta">
      <span id="post-date"></span> •
      <span id="post-category"></span>
    </p>

    <img id="post-thumb" class="thumb" alt="Thumbnail">

    <div id="post-content">Đang tải nội dung...</div>

    <div class="related-box">
      <h3>Bài viết liên quan</h3>
      <div id="related-list"></div>
    </div>

    <div id="post-nav" style="display:flex;justify-content:space-between;margin-top:30px;">
      <span id="prev-post"></span>
      <span id="next-post"></span>
    </div>

    <div id="share-box" style="margin-top:35px;">
      <button onclick="shareFB()">📘 Chia sẻ Facebook</button>
      <button onclick="shareZalo()">💬 Chia sẻ Zalo</button>
      <button onclick="copyLink()">🔗 Copy link</button>
    </div>

  </main>

</div>

<script>

  /* =====================================================
   LẤY FILE TỪ URL
===================================================== */
const params = new URLSearchParams(window.location.search);
const file = params.get("file");

if (!file) {
  document.getElementById("post-content").innerHTML =
    "<p>Lỗi: không tìm thấy bài viết.</p>";
}

/* =====================================================
   LOAD DANH SÁCH POSTS
===================================================== */
fetch("posts/posts.json")
  .then(res => res.json())
  .then(posts => {
    const post = posts.find(p => p.file === file);

    if (!post) {
      document.getElementById("post-content").innerHTML =
        "<p>Không tìm thấy nội dung bài viết.</p>";
      return;
    }

    // Set metadata
    document.getElementById("post-title").textContent = post.title;
    document.getElementById("post-date").textContent = "📅 " + post.date;
    document.getElementById("post-category").textContent = "📂 " + post.category;
    document.getElementById("post-thumb").src = post.thumbnail;

    /* =====================================================
       LOAD HTML NỘI DUNG BÀI
    ===================================================== */
    fetch("posts/" + post.file)
      .then(r => r.text())
      .then(html => {
        document.getElementById("post-content").innerHTML = html;

        // Sau khi chèn HTML — chạy lại toggle đáp án
        setupAnswerToggle();

        // Sinh nút quiz tự động
        autoAddQuizButton(post.file);

        // Gợi ý bài liên quan
        loadRelated(posts, post);

        // Điều hướng prev / next
        loadNavigation(posts, post);
      });
  });

/* =====================================================
   AUTO QUIZ BUTTON — TỰ THÊM NÚT "Làm bài Quiz"
===================================================== */
function autoAddQuizButton(file) {
  const quizMap = {
    "nouns.html": "nouns",
    "adjectives.html": "adjectives",
    "adverbs.html": "adverbs",
    "pronouns.html": "pronouns",
    "articles.html": "articles",
    "conjunctions.html": "conjunctions",
    "quantifiers.html": "quantifiers",
    "prepositions.html": "prepositions",
    "modal-verbs.html": "modal-verbs",
    "determiners.html": "determiners",
    "gerunds-infinitives.html": "gerunds-infinitives",
    "comparatives-superlatives.html": "comparatives-superlatives",

    // 12 thì
    "present-simple.html": "present-simple",
    "present-continuous.html": "present-continuous",
    "present-perfect.html": "present-perfect",
    "present-perfect-continuous.html": "present-perfect-continuous",

    "past-simple.html": "past-simple",
    "past-continuous.html": "past-continuous",
    "past-perfect.html": "past-perfect",

    "future-simple.html": "future-simple",
    "future-continuous.html": "future-continuous",
    "future-perfect.html": "future-perfect",
    "near-future.html": "near-future",

    "will-vs-going-to.html": "will-vs-going-to"
  };

  if (!quizMap[file]) return;

  const code = `
    <div style="margin-top:25px;">
      <a href="/binh-blog/quiz.html?type=${quizMap[file]}"
         style="background:#d9d1ff; padding:12px 22px; border-radius:10px;
                font-weight:700; display:inline-block; margin-top:10px;">
        👉 Làm bài tập: ${quizMap[file].toUpperCase()}
      </a>
    </div>
  `;

  document.getElementById("post-content").innerHTML += code;
}

/* =====================================================
   LIÊN QUAN
===================================================== */
function loadRelated(posts, current) {
  const related = posts
    .filter(p => p.category === current.category && p.file !== current.file)
    .slice(0, 3);

  const box = document.getElementById("related-list");

  if (related.length === 0) {
    box.innerHTML = "<p>Không có bài liên quan.</p>";
    return;
  }

  related.forEach(p => {
    box.innerHTML += `
      <p><a href="/binh-blog/post.html?file=${p.file}">${p.title}</a></p>
    `;
  });
}

/* =====================================================
   PREVIOUS / NEXT
===================================================== */
function loadNavigation(posts, post) {
  const index = posts.findIndex(p => p.file === post.file);

  const prevBox = document.getElementById("prev-post");
  const nextBox = document.getElementById("next-post");

  if (index > 0) {
    const prev = posts[index - 1];
    prevBox.innerHTML = `⬅ <a href="/binh-blog/post.html?file=${prev.file}">${prev.title}</a>`;
  }

  if (index < posts.length - 1) {
    const next = posts[index + 1];
    nextBox.innerHTML = `<a href="/binh-blog/post.html?file=${next.file}">${next.title}</a> ➡`;
  }
}

/* =====================================================
   SHARE BUTTONS
===================================================== */
function shareFB() {
  window.open(
    "https://www.facebook.com/sharer/sharer.php?u=" +
      encodeURIComponent(location.href),
    "_blank"
  );
}

function shareZalo() {
  window.open(
    "https://zalo.me/share?url=" + encodeURIComponent(location.href),
    "_blank"
  );
}

function copyLink() {
  navigator.clipboard.writeText(window.location.href);
  alert("Đã copy link!");
}

/* =====================================================
   TOGGLE ĐÁP ÁN — HỖ TRỢ CHO TẤT CẢ BÀI
===================================================== */
function setupAnswerToggle() {
  const answers = document.querySelectorAll(".answer-text");
  const btn = document.getElementById("toggle-answer");

  if (!btn || answers.length === 0) return;

  btn.addEventListener("click", () => {
    const hidden = answers[0].style.display === "none" || answers[0].style.display === "";

    answers.forEach(a => {
      a.style.display = hidden ? "block" : "none";
    });

    btn.innerText = hidden ? "🙈 Ẩn đáp án" : "👉 Hiện đáp án";
  });
}
</script>

<script>
(function () {
  // Hàm toggle: bật/tắt tất cả phần .answer-text
  function toggleAnswers() {
    const answers = document.querySelectorAll('.answer-text');
    if (!answers || answers.length === 0) {
      console.warn('Không tìm thấy phần tử .answer-text để hiển thị/ẩn đáp án.');
      return;
    }

    // Dùng computed style để biết hiện/ẩn thực tế
    const currentlyHidden = window.getComputedStyle(answers[0]).display === 'none';

    answers.forEach(a => {
      // nếu phần tử có inline style display, ta override; nếu không có thì set/block
      a.style.display = currentlyHidden ? 'block' : 'none';
    });

    // cập nhật text của nút (nếu tồn tại)
    const btn = document.getElementById('toggle-answer');
    if (btn) btn.innerText = currentlyHidden ? '🙈 Ẩn đáp án' : '👉 Hiện đáp án';
  }

  // Gắn event bắt mọi click; dùng closest để hỗ trợ click vào icon bên trong nút
  document.addEventListener('click', function (ev) {
    const btn = ev.target.closest && ev.target.closest('#toggle-answer');
    if (btn) {
      ev.preventDefault();
      toggleAnswers();
    }
  });

  // Option: nếu trang load nội dung động bằng fetch và bạn muốn mặc định ẩn hết
  // khi nội dung vừa được chèn, có thể gọi lần đầu sau 200ms để ẩn nếu cần:
  setTimeout(() => {
    const answers = document.querySelectorAll('.answer-text');
    if (answers.length) {
      answers.forEach(a => a.style.display = 'none');
      const btn = document.getElementById('toggle-answer');
      if (btn) btn.innerText = '👉 Hiện đáp án';
    }
  }, 250);

})();
</script>

<script>
/*
  Universal answer-toggle for blog posts
  - Works with buttons:
      id="toggle-answer"
      OR data-toggle="answers"
      OR class="toggle-answers"
  - Looks only inside the current post content container (#post-content)
  - Toggles elements with class "answer-text"
*/

(function () {
  // helper: finds the closest ancestor that is the article container
  function findPostContainer(el) {
    // prefer #post-content
    var pc = document.getElementById('post-content');
    if (pc) return pc;
    // fallback: try to find ancestor with id "post-article" or role=main
    var a = el.closest('#post-article') || el.closest('main') || document.body;
    return a;
  }

  function toggleAnswersIn(container) {
    if (!container) return;
    var answers = Array.from(container.querySelectorAll('.answer-text'));
    if (!answers.length) {
      console.warn('Không tìm thấy phần tử .answer-text để hiển thị/ẩn đáp án.');
      return false;
    }
    // determine new state: if at least one hidden -> show all, else hide all
    var anyHidden = answers.some(a => {
      // computed style fallback (handles inline style or stylesheet)
      var s = window.getComputedStyle(a);
      return s.display === 'none' || s.visibility === 'hidden' || a.dataset.hidden === "true";
    });

    answers.forEach(a => {
      if (anyHidden) {
        a.style.display = '';           // remove inline hiding
        a.dataset.hidden = "false";
      } else {
        a.style.display = 'none';
        a.dataset.hidden = "true";
      }
    });

    return anyHidden; // true if we were showing (there was hidden -> now shown)
  }

  // event delegation: one click listener for whole document
  document.addEventListener('click', function (e) {
    var target = e.target;

    // support click on child nodes inside the button (e.g., icon <span> inside)
    var toggleButton = target.closest('[data-toggle="answers"], #toggle-answer, .toggle-answers');

    if (!toggleButton) return;

    e.preventDefault();

    var postContainer = findPostContainer(toggleButton);

    var shownBefore = toggleAnswersIn(postContainer);

    // update button text if possible
    try {
      var btnTextShow = '👉 Hiện đáp án';
      var btnTextHide = '🙈 Ẩn đáp án';

      // if answers were hidden before (so we showed them), set label to Hide
      var isNowShown = shownBefore; // shownBefore true means we just showed them
      if (isNowShown) {
        if (toggleButton.tagName.toLowerCase() === 'button' || toggleButton.tagName.toLowerCase() === 'a') {
          toggleButton.textContent = btnTextHide;
        } else {
          // try to find inner label
          var lbl = toggleButton.querySelector('.label') || toggleButton;
          if (lbl) lbl.textContent = btnTextHide;
        }
      } else {
        if (toggleButton.tagName.toLowerCase() === 'button' || toggleButton.tagName.toLowerCase() === 'a') {
          toggleButton.textContent = btnTextShow;
        } else {
          var lbl2 = toggleButton.querySelector('.label') || toggleButton;
          if (lbl2) lbl2.textContent = btnTextShow;
        }
      }
    } catch (err) {
      // ignore any errors updating text
      console.error(err);
    }
  });

  // Optional: when page loads, ensure all .answer-text are hidden by default
  document.addEventListener('DOMContentLoaded', function () {
    var post = document.getElementById('post-content') || document.body;
    Array.from(post.querySelectorAll('.answer-text')).forEach(a => {
      // if inline style not explicitly set, ensure hidden
      var cs = window.getComputedStyle(a);
      if (cs.display !== 'none') {
        a.style.display = 'none';
        a.dataset.hidden = "true";
      }
    });
  });
})();
</script>
 <script>
// TỰ ĐỘNG KÍCH HOẠT SAU KHI NỘI DUNG BÀI ĐƯỢC LOAD
const observer = new MutationObserver(() => {
    const btn = document.getElementById("toggle-answer");
    const answers = document.querySelectorAll(".answer-text");

    if (btn && answers.length > 0) {
        btn.onclick = function () {
            const isHidden =
                answers[0].style.display === "none" || answers[0].style.display === "";

            answers.forEach(a => {
                a.style.display = isHidden ? "block" : "none";
            });

            btn.textContent = isHidden ? "🙈 Ẩn đáp án" : "👉 Hiện đáp án";
        };

        observer.disconnect(); // tránh chạy nhiều lần
    }
});

// Quan sát nội dung tải vào post-content
observer.observe(document.getElementById("post-content"), { childList: true, subtree: true });
</script> 
</body>
</html>
