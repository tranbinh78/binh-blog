<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

  <title>Bài viết | Binh Blog</title>

  <style>
/* ===== GENERAL ===== */
body {
  font-family: "Be Vietnam Pro", sans-serif;
  max-width: 760px;
  margin: auto;
  padding: 30px 20px;
  line-height: 1.8;
  color: #222;
  background: #fafafa;
}

/* Title */
h1 {
  font-size: 32px;
  font-weight: 700;
  margin-bottom: 8px;
}

.meta {
  color: #777;
  font-size: 15px;
  margin-bottom: 25px;
}

/* Thumbnail */
img.thumb {
  width: 100%;
  border-radius: 12px;
  margin: 20px 0;
}

/* ===== POST CONTENT ===== */
#post-content {
  margin-top: 25px;
  font-size: 18px;
}

#post-content h1,
#post-content h2,
#post-content h3 {
  margin-top: 28px;
  margin-bottom: 10px;
  font-weight: 700;
}

#post-content h2 {
  font-size: 24px;
  border-left: 4px solid #7a64ff;
  padding-left: 10px;
}

#post-content h3 {
  font-size: 20px;
  color: #333;
}

#post-content p {
  margin: 14px 0;
}

#post-content ul,
#post-content ol {
  margin: 14px 0 14px 25px;
}

#post-content li {
  margin: 6px 0;
}

#post-content img {
  width: 100%;
  border-radius: 10px;
  margin: 18px 0;
  display: block;
}

/* Blockquote */
#post-content blockquote {
  border-left: 4px solid #c0b4ff;
  padding: 10px 15px;
  margin: 20px 0;
  background: #f5f2ff;
  border-radius: 6px;
  font-style: italic;
}

/* Code block */
#post-content pre {
  background: #1e1e1e;
  color: #f0f0f0;
  padding: 14px;
  border-radius: 8px;
  overflow-x: auto;
  margin: 18px 0;
}

#post-content code {
  background: #eee;
  padding: 3px 5px;
  border-radius: 4px;
  font-size: 15px;
}

/* ===== TOC ===== */
#toc-container {
  background: #f8f5ff;
  padding: 18px;
  border-radius: 12px;
  border: 1px solid #e0d8ff;
  margin: 25px 0;
}

#toc-container h3 {
  margin-bottom: 10px;
}

#toc-list li {
  margin: 6px 0;
  cursor: pointer;
  color: #4635d4;
  list-style: none;
}

#toc-list li:hover {
  text-decoration: underline;
}

.toc-level-1 { margin-left: 0; }
.toc-level-2 { margin-left: 15px; }
.toc-level-3 { margin-left: 30px; }

/* ===== BACK BUTTON ===== */
a.back {
  display: inline-block;
  margin-top: 35px;
  padding: 10px 18px;
  background: #d9d1ff;
  text-decoration: none;
  border-radius: 8px;
  font-weight: 600;
  color: #333;
}

a.back:hover {
  background: #c8bef8;
}

#post-content li {
  margin: 6px 0;
}

/* Images */
#post-content img {
  width: 100%;
  border-radius: 10px;
  margin: 18px 0;
  display: block;
}

/* Blockquote */
#post-content blockquote {
  border-left: 4px solid #c0b4ff;
  padding: 10px 15px;

}

/* Code block */
#post-content pre {
  background: #1e1e1e;

  padding: 14px;

  overflow-x: auto;
  margin: 18px 0;
}

#post-content code {
  background: #eee;
  padding: 3px 5px;

  font-size: 15px;
}

/* ===== TOC BOX ===== */

#toc-container {
  background: #f8f5ff;

  border: 1px solid #e0d8ff;
  margin: 25px 0;
}

#toc-container h3 {
  margin-bottom: 10px;
}

#toc-list li {
  margin: 6px 0;
  cursor: pointer;
  color: #4635d4;
  list-style: none;
}

#toc-list li:hover {
  text-decoration: underline;
}

.toc-level-1 { margin-left: 0; }
.toc-level-2 { margin-left: 15px; }
.toc-level-3 { margin-left: 30px; }

/* ===== BACK BUTTON ===== */

a.back {
  display: inline-block;
  margin-top: 35px;
  padding: 10px 18px;
  background: #d9d1ff;
  text-decoration: none;
  border-radius: 8px;
  font-weight: 600;

a.back:hover {

}
    
    body {
      font-family: "Be Vietnam Pro", sans-serif;
      max-width: 800px;
      margin: auto;
      padding: 20px;
      line-height: 1.8;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .meta {
      color: #777;
      margin-bottom: 20px;
    }

    img.thumb {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    a.back {
      display: inline-block;
      margin-top: 30px;
      padding: 10px 16px;
      background: #d7caff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
    }

    /* TOC */
    #toc-list li {
      margin: 6px 0;
      cursor: pointer;
      color: #3b35c3;
    }

  </style>
</head>

<body>

  <h1 id="post-title"></h1>
  <p class="meta">
    <span id="post-date"></span> • 
    <span id="post-category"></span>
  </p>

  <!-- ⭐ TOC -->
  <div id="toc-container" style="
      background:#f8f5ff;
      padding:15px;
      border-radius:10px;
      border:1px solid #ddd;
      margin:20px 0;">
    <h3>Mục lục</h3>
    <ul id="toc-list" style="margin-top:10px;"></ul>
  </div>

  <img id="post-thumb" class="thumb" src="" alt="Thumbnail">

  <div id="post-content">Đang tải nội dung...</div>

  <a href="index.html" class="back">← Quay lại trang chủ</a>

<script>
  const params = new URLSearchParams(window.location.search);
  const file = params.get("file");

  if (!file) {
    document.getElementById("post-content").innerHTML = "<p>Lỗi: không tìm thấy bài viết.</p>";
  } else {

    fetch("/binh-blog/posts/posts.json")
      .then(res => res.json())
      .then(posts => {

        const post = posts.find(p => p.file === file);

        if (!post) return;

        document.getElementById("post-title").textContent = post.title;
        document.getElementById("post-date").textContent = "📅 " + post.date;
        document.getElementById("post-category").textContent = "📂 " + post.category;
        document.getElementById("post-thumb").src = post.thumbnail;

        fetch("/binh-blog/posts/" + post.file)
          .then(res => res.text())
          .then(html => {
            document.getElementById("post-content").innerHTML = html;

            // ⭐ gọi TOC tại đúng vị trí
            generateTOC();
          });
      });
  }

  function generateTOC() {
    const content = document.getElementById("post-content");
    const tocList = document.getElementById("toc-list");

    if (!content || !tocList) return;

    tocList.innerHTML = "";
    const headings = content.querySelectorAll("h1, h2, h3");

    headings.forEach((h, index) => {
      if (!h.id) h.id = "heading-" + index;

      const li = document.createElement("li");

      let level = h.tagName === "H1" ? 1 :
                  h.tagName === "H2" ? 2 : 3;

      li.classList.add("toc-level-" + level);
      li.textContent = h.textContent;

      li.addEventListener("click", () => {
        document.getElementById(h.id).scrollIntoView({
          behavior: "smooth"
        });
      });

      tocList.appendChild(li);
    });

    if (headings.length === 0) {
      document.getElementById("toc-container").style.display = "none";
    }
  }
</script>

</body>
</html>
