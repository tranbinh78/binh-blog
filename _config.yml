title: "Binh Blog"
tagline: "Learning. Sharing. Growing."
description: "Blog cá nhân của Trần Bình – chia sẻ quá trình học tiếng Anh, ghi chú và cuộc sống."
url: "https://tranbinh78.github.io"
baseurl: "/binh-blog"
lang: en
timezone: Asia/Ho_Chi_Minh

# Use local layouts (we provide _layouts/_includes)
# plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-archives

paginate: 10

# build settings
markdown: kramdown

# avatar
author:
  name: "Trần Bình"
  url: "https://tranbinh78.github.io/binh-blog"

avatar: /assets/img/avatar-binh.png.jpg

collections:
  posts:
    output: true

# Permalinks
permalink: /:categories/:title/

# giscus (optional placeholders)
comments:
  provider: "giscus"
  giscus:
    repo: "tranbinh78/binh-blog"
    mapping: "pathname"
    reactions_enabled: "1"
    theme: "light"
