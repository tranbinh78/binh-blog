<script>
function getSlugFromFile() {
  const params = new URLSearchParams(window.location.search);
  const file = params.get("file"); // grammar/present-continuous.md
  if (!file) return null;

  return file
    .split("/")
    .pop()
    .replace(".md", ""); // present-continuous
}

function injectQuizButton() {
  const slug = getSlugFromFile();
  if (!slug) return;

  const content = document.getElementById("content");
  if (!content) return;

  const wrap = document.createElement("div");
  wrap.style = "margin:40px 0;text-align:center";

  wrap.innerHTML = `
    <a href="tieng-anh/quiz-viewer.html?quiz=${slug}"
       style="
         display:inline-block;
         padding:14px 22px;
         border-radius:12px;
         background:#c9b3ff;
         color:#000;
         font-weight:700;
         text-decoration:none;
       ">
      📝 Làm bài kiểm tra ${slug.replace(/-/g," ").toUpperCase()}
    </a>
  `;

  content.appendChild(wrap);
}
</script>
