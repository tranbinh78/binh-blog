<script>
/* ========= LẤY FILE ========= */
const params = new URLSearchParams(window.location.search);
const file = params.get("file");

if (!file) {
  document.getElementById("content").innerText = "Không có file được chỉ định.";
} else {
  fetch(file)
    .then(res => {
      if (!res.ok) throw new Error("File not found");
      return res.text();
    })
    .then(md => {
      document.getElementById("content").innerHTML = marked.parse(md);
      injectQuizButton();
      setTitleFromFile(file);
    })
    .catch(() => {
      document.getElementById("content").innerText =
        "Không thể tải nội dung bài học.";
    });
}

/* ========= SLUG CHUẨN ========= */
function getSlugFromFile() {
  if (!file) return null;
  return file
    .split("/")
    .pop()
    .replace(".md", "")
    .replace(".html", "")
    .toLowerCase();
}

/* ========= TIÊU ĐỀ ========= */
function setTitleFromFile(file) {
  const name = getSlugFromFile();
  document.getElementById("page-title").innerText =
    name.replace(/-/g, " ").toUpperCase();
}

/* ========= NÚT QUIZ ========= */
function injectQuizButton() {
  const slug = getSlugFromFile();
  if (!slug) return;

  const wrapper = document.createElement("div");
  wrapper.style = "margin:50px 0;text-align:center";

  wrapper.innerHTML = `
    <a href="tieng-anh/quiz-viewer.html?quiz=${slug}"
       class="btn-primary">
       📝 Làm bài kiểm tra ${slug.replace(/-/g," ").toUpperCase()}
    </a>
  `;

  document.getElementById("content").appendChild(wrapper);
}
</script>
