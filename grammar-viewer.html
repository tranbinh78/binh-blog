<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Grammar — Trần Bình</title>

  <link rel="stylesheet" href="assets/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    .md-content h1, .md-content h2, .md-content h3 {
      margin-top: 28px;
    }
    .md-content p {
      font-size: 18px;
      line-height: 1.8;
      margin: 16px 0;
    }
    .quiz-btn {
      margin: 48px 0;
      text-align: center;
    }
    .quiz-btn a {
      display: inline-block;
      background: #c9b3ff;
      padding: 14px 24px;
      border-radius: 12px;
      font-weight: 700;
      text-decoration: none;
      color: #111;
    }
  </style>
</head>

<body>
<div class="wrapper">

  <aside class="sidebar">
    <div class="brand">
      <img src="assets/avatar.jpg" />
      <h1>Tran Binh</h1>
    </div>
    <ul class="nav">
      <li><a href="index.html">🏠 Home</a></li>
      <li><a class="active" href="tieng-anh.html">📘 Tiếng Anh</a></li>
      <li><a href="cuoc-song.html">📝 Cuộc sống</a></li>
      <li><a href="gallery.html">📷 Gallery</a></li>
      <li><a href="about.html">👤 About me</a></li>
      <li><a href="contact.html">✉️ Contact</a></li>
    </ul>
  </aside>

  <main class="main">
    <article class="post">
      <header class="post-header">
        <h1 id="page-title">Grammar</h1>
        <div class="post-meta">Grammar – Ngữ pháp</div>
      </header>

      <div id="content" class="post-content md-content">
        Đang tải nội dung...
      </div>

      <footer class="post-footer">
        ← <a href="tieng-anh/grammar.html">Quay lại Grammar</a>
      </footer>
    </article>
  </main>

</div>

<script>
const params = new URLSearchParams(location.search);
const file = params.get("file");

if (!file || !file.endsWith(".md")) {
  document.getElementById("content").innerText =
    "❌ Grammar Viewer chỉ hỗ trợ file .md";
  throw new Error("Invalid file");
}

fetch(file)
  .then(res => {
    if (!res.ok) throw new Error();
    return res.text();
  })
  .then(md => {
    md = md
      .replace(/<script[\s\S]*?<\/script>/gi, "")
      .replace(/<link[^>]*>/gi, "")
      .replace(/<!--[\s\S]*?-->/g, "");

    document.getElementById("content").innerHTML = marked.parse(md);
    injectQuizButton();
    setTitleFromFile();
  })
  .catch(() => {
    document.getElementById("content").innerText =
      "❌ Không thể tải nội dung.";
  });

function slugFromFile() {
  return file.split("/").pop().replace(".md", "");
}

function setTitleFromFile() {
  document.getElementById("page-title").innerText =
    slugFromFile().replace(/-/g, " ").toUpperCase();
}

function injectQuizButton() {
  const slug = slugFromFile();

  const wrapper = document.createElement("div");
  wrapper.className = "quiz-btn";
  wrapper.innerHTML = `
    <a href="tieng-anh/quiz-viewer.html?quiz=${slug}">
      📝 Làm bài kiểm tra ${slug.replace(/-/g," ").toUpperCase()}
    </a>
  `;

  document.getElementById("content").appendChild(wrapper);
}
</script>
</body>
</html>
