<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — Tran Bình</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <div class="wrapper">

    <!-- Sidebar -->
    <aside class="sidebar" role="navigation" aria-label="Chính">
      <div class="brand">
        <img src="assets/avatar.jpg" alt="Avatar Tran Binh" />
        <div>
          <h1>Tran Binh</h1>
          <div style="color:var(--muted);font-size:13px">Personal website</div>
        </div>
      </div>

      <ul class="nav">
        <li><a href="index.html">Home</a></li>
        <li><a href="tieng-anh.html">Tiếng Anh</a></li>
        <li><a href="cuoc-song.html">Cuộc sống</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="about.html">About me</a></li>
        <li><a class="active" href="contact.html">Contact</a></li>
      </ul>

  <!-- Nút chuyển Dark Mode -->
    <div class="theme-switch-wrapper">
        <label class="theme-switch" for="darkToggle">
            <input type="checkbox" id="darkToggle">
            <span class="slider"></span>
        </label>
        <span id="themeLabel">🌙 Dark Mode</span>
    </div>
      
    </aside>

    <!-- Main content -->
    <main class="main">
      <div class="header-row">
        <div>
          <h2 class="site-title">Contact</h2>
          <p class="lead">Liên hệ với tôi qua biểu mẫu hoặc email bên dưới.</p>
        </div>
      </div>

      <section class="article">

        <form class="form-row" action="mailto:youremail@example.com" method="post" enctype="text/plain">
          <label>Họ và tên</label>
          <input type="text" name="name" placeholder="Tên của bạn" required>

          <label>Email</label>
          <input type="email" name="email" placeholder="email@domain.com" required>

          <label>Nội dung</label>
          <textarea name="message" rows="6" placeholder="Viết nội dung bạn muốn gửi..." required></textarea>

          <button class="primary" type="submit">Gửi</button>
        </form>

        <p style="margin-top:14px;color:var(--muted)">
          Hoặc gửi email trực tiếp tới:
          <a href="mailto:youremail@example.com">youremail@example.com</a>
        </p>

      </section>

    </main>

  </div>

<script>
  const toggle = document.getElementById("darkToggle");
  const label = document.getElementById("themeLabel");
  const root = document.documentElement;

  // Load trạng thái đã lưu
  if (localStorage.getItem("theme") === "dark") {
    root.classList.add("dark");
    toggle.checked = true;
    label.textContent = "☀️ Light Mode";
  }

  toggle.addEventListener("change", () => {
    if (toggle.checked) {
      root.classList.add("dark");
      label.textContent = "☀️ Light Mode";
      localStorage.setItem("theme", "dark");
    } else {
      root.classList.remove("dark");
      label.textContent = "🌙 Dark Mode";
      localStorage.setItem("theme", "light");
    }
  });
</script>

<script>
  const navLinks = document.querySelectorAll(".nav a");

  navLinks.forEach(link => {
    link.addEventListener("click", function(e) {
      const rect = this.getBoundingClientRect();
      const ripple = document.createElement("span");

      const size = Math.max(rect.width, rect.height);
      ripple.style.width = ripple.style.height = size + "px";

      ripple.style.left = (e.clientX - rect.left - size / 2) + "px";
      ripple.style.top = (e.clientY - rect.top - size / 2) + "px";

      ripple.classList.add("ripple");
      this.appendChild(ripple);

      setTimeout(() => {
        ripple.remove();
      }, 600);
    });
  });
</script>
  
</body>
</html>
